      en:"Le Bon argues that viewing socialism as an economic movement is a psychological misjudgement; in its essence it is a **religious movement**, because it rests on \"absolute faith\" in the power of the state and its ability to work miracles. And when he describes it as **\"the modern divine right\"**, he clarifies that the masses have transferred the attributes of \"the wilful God\" to \"the state-God\" (the Providential State), expecting from it a solution to every existential impasse." },
    { t:"h2", ar:"1. الانهيارُ الاقتصادي.. من \"المبادرة\" إلى \"السُّخرة\"",
      en:"1. Economic Collapse.. From \"Initiative\" to \"Corvée Labour\"" },
    { t:"p", ar:"يؤكد لوبون أنَّ الإنتاج الذي تديره الدولة محكومٌ عليه بالفشل والمغالاة؛ لغيابِ مُحرك **\"المصلحة الشخصية\"**.",
      en:"Le Bon affirms that production managed by the state is doomed to failure and excess costs, for want of the engine of **\"personal interest\"**." },
    { t:"ul", items:[
      { ar:"**قانونُ العطالة:** بمجرد أن تبتلع الدولةُ كافّة الصناعات، ستجد نفسها عاجزةً عن الاستمرار بغير إرساء نظامِ **\"العمل القسري\"** مقابل أدنى أجرٍ للمعيشة.",
        en:"**The law of idleness:** Once the state swallows all industries, it will find itself unable to continue without instituting a system of **\"forced labour\"** for the lowest subsistence wage." },
      { ar:"**العبوديةُ المقننة:** يتحول المواطنون إلى \"أرقامٍ\" في آلةٍ بيروقراطيةٍ ضخمة، وهو ما يسميه لوبون بـ \"الرِّق الحديث\"، حيث يُجبر الجميع على كدحٍ بائس لتعويض قصور الإدارة المركزية.",
        en:"**Codified slavery:** Citizens become \"numbers\" in a vast bureaucratic machine — what Le Bon calls \"modern bondage\" — where all are forced to toil miserably to compensate for the shortcomings of centralised administration." }
    ]},
    { t:"h2", ar:"2. شللُ التقدمِ وسيادةُ \"الرداءةِ الجماعية\"",
      en:"2. The Paralysis of Progress and the Reign of \"Collective Mediocrity\"" },
    { t:"p", ar:"ينطلق لوبون من قاعدةٍ ثابتة: \"إنَّ الفردَ المبدع هو صانعُ الحضارة، لا الجموع\".",
      en:"Le Bon starts from an established rule: \"It is the creative individual who makes civilisation, not the crowds\"." },
    { t:"ul", items:[
      { ar:"**مَحْوُ النُّخبة:** بسحق المبادرة الفردية باسم \"المساواة\"، تُعطل الاشتراكية أهمَّ روافع العصر الحديث.",
        en:"**The erasure of the elite:** By crushing individual initiative in the name of \"equality\", socialism disables the most important levers of the modern age." },
      { ar:"**الرسوبُ الاجتماعي:** تؤول الأمة إلى حالةٍ من **\"الرداءة الشاملة\"** (Base Equality)، حيث يتحول المجتمع إلى \"رواسب اجتماعية\" تفتقر إلى أيِّ بريقٍ ذهني أو علمي، وتغدو الأمةُ مَحضَ كتلةٍ خاملةٍ من البشر.",
        en:"**Social failure:** The nation lapses into a condition of **\"universal mediocrity\"** (Base Equality), where society turns into \"social sediments\" lacking any intellectual or scientific brilliance, and the nation becomes a sheer inert mass of human beings." }
    ]},
    { t:"h2", ar:"3. اضمحلالُ الشخصيةِ و\"نفسيةُ المرتزقة\"",
      en:"3. The Atrophy of Personality and \"the Psychology of Mercenaries\"" },
    { t:"p", ar:"يصف لوبون النتيجةَ السيكولوجيةَ النهائية لهذا النظام بـ **\"العبودية المهينة\"**؛ فالدولة عندما تتدخل في أدق تفاصيل الحياة، تقتل في الفرد عادة \"الحكم الذاتي\" (Self-government).",
      en:"Le Bon describes the ultimate psychological outcome of this system as **\"humiliating servitude\"**: when the state intervenes in the finest details of life, it kills in the individual the habit of \"self-government\"." },
    { t:"ul", items:[
      { ar:"**خريفُ الإرادة:** يتحول المواطنون إلى **\"مرتزقةٍ جُبناء\"**، يفتقرون للجسارة والمسؤولية، بانتظارِ أوامر \"البابا الجماعي\" لتسيير شؤونهم. إنَّ هذا \"الجحيم من العبودية\" في نظره يفوق قسوةَ أيِّ أرستقراطيةٍ غابرة؛ لأنَّ الطاغية هنا \"مجهول\" ولا قلب له.",
        en:"**The autumn of the will:** Citizens turn into **\"cowardly mercenaries\"**, lacking boldness and responsibility, awaiting the orders of the \"collective Papa\" to run their affairs. This \"hell of servitude\", in his view, exceeds the harshness of any bygone aristocracy — for the tyrant here is \"anonymous\" and has no heart." }
    ]},
    { t:"h2", ar:"المآلُ المحتوم: بين \"القيصر\" و\"الغزو\"",
      en:"The Inevitable Fate: Between \"the Caesar\" and \"the Invasion\"" },
    { t:"p", ar:"يخلص لوبون إلى أنَّ الأمة التي تضحي بالتميز من أجل المساواة، وتقتل روح المبادرة، تنتهي حتماً إلى **\"الفوضى الاجتماعية\"**. وفي هذه الحالة، لا يخرج المجتمع من تيهه إلا عبر أحد مسارين:",
      en:"Le Bon concludes that the nation which sacrifices excellence for equality and kills the spirit of initiative inevitably ends in **\"social chaos\"**. In such a case, society emerges from its bewilderment by only one of two paths:" },
    { t:"ol", items:[
      { ar:"**ظهور \"قيصر\":** دكتاتورٌ قوي يفرض النظام بالقوة لإنقاذ ما يمكن إنقاذه.",
        en:"**The rise of \"a Caesar\":** a strong dictator who imposes order by force to salvage what can be salvaged." },
      { ar:"**الغزو الخارجي:** أن تبتلعها دولٌ جارةٌ أكثرُ حيويةً ونشاطاً، لم تفتك بها عدوى الاشتراكية بعد.",
        en:"**Foreign invasion:** that more vital and active neighbouring states swallow her up, the contagion of socialism not having yet plagued them." }
    ]},
    { t:"note", ar:"إضاءة من مِخبرة المترجم: \"تكمن قوةُ طرحِ لوبون في إدراكِهِ أنَّ 'الدولة' لا تملكُ عقلاً لتبدع، بل تملكُ يداً لتقمع. إنَّ الاشتراكيةَ عنده هي 'ردةٌ بيولوجية'؛ لأنها تحاول أن تجعل من 'الخلية' (الفرد) خادماً للـ 'كتلة' (الدولة)، متجاهلةً أنَّ حياة الكائن الحي تكمن في تميز خلاياه لا في انصهارهـا.\"",
      en:"Illumination from the translator's laboratory: \"The strength of Le Bon's argument lies in his realisation that the 'state' has no mind to create, only a hand to repress. Socialism, for him, is a 'biological regression', because it tries to make 'the cell' (the individual) a servant of 'the mass' (the state), ignoring that the life of a living being lies in the distinction of its cells, not in their melting away.\"" }
  ]
},
{
  id:"u7", icon:"arrows-rotate",
  t:{ ar:"تشريحُ \"دورةِ الغواية\": كيف تَتغلغلُ الأيديولوجيا في رُوحِ الـجماهير؟",
      en:"Anatomy of the \"Cycle of Seduction\": How Does Ideology Infiltrate the Spirit of the Masses?" },
  blocks:[
    { t:"p", ar:"إنَّ هذا الـمخطط المفاهيمي الذي رَسمتَهُ يَنفذُ إلى جـوهر \"الإبستيمولوجيا السيكولوجية\" لغوستاف لوبون (Gustave Le Bon)؛ فهو لا يكتفي بـوصفِ مَظاهرِ الحركاتِ الاجتماعية، بل يَكشفُ عن \"الميكانيكا الخفية\" لـصناعةِ الانقياد. إنَّ الربطَ بَيْنَ هذه الآلياتِ يُوضحُ لـماذا تَعجزُ النظرياتُ العقلانيةُ عن مـجابهةِ الحركاتِ العقائدية؛ فالمعركةُ لا تُدارُ في ساحةِ \"البرهان\"، بل في دَهاليزِ \"اللاشعور\".",
      en:"This conceptual scheme you have drawn reaches the heart of the \"psychological epistemology\" of Gustave Le Bon; he does not content himself with describing the appearances of social movements but uncovers the \"hidden mechanics\" of manufacturing obedience. The linkage of these mechanisms explains why rationalist theories fail to confront movements of faith: the battle is not conducted in the arena of \"proof\" but in the corridors of \"the unconscious\"." },
    { t:"p", ar:"وإليك صياغةُ هذا الـمخطط بلسانٍ عربيٍّ رصين، يُجلي كيف تَتضافرُ هذه القوانينُ لِتحقيقِ غَلَبَةِ الـمُعتقد:",
      en:"Here is this scheme formulated in a sedate Arabic tongue, elucidating how these laws combine to achieve the victory of the belief:" },
    { t:"p", ar:"يَرى لوبون أنَّ نجاحَ أيِّ مذهبٍ -وعلى رأسِها الاشتراكية- لا يَرتبطُ بـصِحَّتِه المادية، بل بـمدى اتساقِه مع \"القوانينِ النفسيةِ\" للإقناع؛ حيثُ يَتحولُ الـمُحرضُ إلى \"نبيٍّ\" والكلمةُ إلى \"سِحر\".",
      en:"Le Bon holds that the success of any doctrine — socialism at its head — is not tied to its material validity but to its consistency with the \"psychological laws\" of persuasion, where the agitator becomes a \"prophet\" and the word becomes \"magic\"." },
    { t:"h2", ar:"1. الـمُرتكزُ الـجوهري: سِيادةُ الـمَنطقِ العاطفي",
      en:"1. The Essential Pivot: The Sovereignty of Emotional Logic" },
    { t:"p", ar:"إنَّ القانونَ الأولَ الذي يَحكمُ صُعودَ الاشتراكيةِ هو أنَّ الـجماهيرَ لا تَنفعلُ بـالأدلةِ المنطقية، بل بـ **\"منطقِ العواطف\"**. وبما أنَّ الاشتراكيةَ تَقبعُ في مـنطقةِ \"الأحلامِ والوعودِ الخيالية\"، فإنها تـَتجاوزُ العقلَ التحليليَّ تـماماً.",
      en:"The first law governing the ascent of socialism is that the masses are not moved by logical evidence but by **\"the logic of emotions\"**. And since socialism resides in the region of \"dreams and fantastic promises\", it bypasses the analytical mind entirely." },
    { t:"q", ar:"\"بـمجردِ أن يَدخلَ الـمفهومُ مـجالَ العاطفة، فإنه يَتحولُ إلى **عقيدةٍ مـحصنة** لا يـمكنُ لـلنقاشِ أن يَنالَ منها، ويُصبحُ الزمنُ وحده -لا الجدال- هو القادرَ على تـفكيكِها.\"",
      en:"\"Once a concept enters the domain of emotion, it becomes an **entrenched doctrine** that discussion cannot touch, and time alone — not debate — becomes capable of dismantling it.\"" },
    { t:"h2", ar:"2. الـمُحفز: دَورُ \"الرُّسل\" (الـمـُحركون)",
      en:"2. The Stimulus: The Role of the \"Apostles\" (the Drivers)" },
    { t:"p", ar:"لا تـنجحُ الدعايةُ إلا بـوجودِ قادةٍ (Apostles/Meneurs) يَملكونَ جـسارةَ الإيمانِ اللازمةَ لـخلقِ العقيدة:",
      en:"Propaganda succeeds only with the existence of leaders (apostles/meneurs) who possess the audacity of faith needed to create the doctrine:" },
    { t:"ul", items:[
      { ar:"**الهيبة (Prestige):** القائدُ لا يُقنعُ بـالـمنطق، بل يَفرضُ سُلطانَه عَبْرَ \"الهيبة\"؛ وهي القوةُ السحريةُ التي تـَجعلُ الأفكارَ مـقبولةً دونَ جـهدٍ نـقدي.",
        en:"**Prestige:** The leader does not persuade by logic but imposes his authority through \"prestige\" — the magical force that makes ideas acceptable without critical effort." },
      { ar:"**الـعقليةُ الـميتافيزيقية:** هؤلاءِ القادةُ هم \"أنصافُ مـهطوعين\" أو مـتحمسون دينيون، نـقلوا غرائزَهم الدينيةَ الموروثةَ إلى مـعبدِ \"الدولةِ الـمُدبّرة\".",
        en:"**The metaphysical mindset:** These leaders are \"half-deranged\" men or religious fanatics who have transferred their inherited religious instincts to the temple of the \"providential state\"." },
      { ar:"**نحوُ الإقناع:** يَستخدمون تـقنيةً سيكولوجيةً ثـنائيةً تـتكونُ من **التوكيد** (Affirmation) و**التكرار** (Repetition) لـغرسِ الأفكارِ في \"اللاشعورِ\" الـجَمـعي.",
        en:"**The method of persuasion:** They employ a twofold psychological technique consisting of **affirmation** and **repetition** to implant ideas in the \"collective unconscious\"." }
    ]},
    { t:"h2", ar:"3. الأداة: سُلطانُ الكلماتِ والـمُعادلاتِ السحرية",
      en:"3. The Tool: The Rule of Words and Magical Formulas" },
    { t:"p", ar:"الأداةُ الأكثرُ فـعاليةً لدى هؤلاءِ القادةِ هي استغلالُ **الكلماتِ والـمـُعادلات** التي تعملُ كـ \"تـعويذاتٍ\" تَستحضرُ صـوراً ذهنيةً قوية:",
      en:"The most effective tool available to these leaders is the exploitation of **words and formulas** that work as \"spells\" conjuring up powerful mental images:" },
    { t:"ul", items:[
      { ar:"**لغةُ الصور:** بما أنَّ الـجمهورَ عاجزٌ عن الـمـُحاكمةِ العقلية، يَستخدمُ القادةُ صِيغاً حيةً مثل \"مـملكةِ الفقراء\" لـتحلَّ مـحلَّ الـواقعِ الـمـُعقد.",
        en:"**The language of images:** Since the public is incapable of rational judgement, the leaders use living formulas such as \"the kingdom of the poor\" in place of complex reality." },
      { ar:"**تـشويهُ الـمعاني:** تـفرغُ الكلماتُ من مـحتواها العقلاني لـتُشحنَ بـطاقةٍ عاطفية، مِمَّا يَسمحُ لكلِّ فردٍ أن يَرى فيها تـحقيقاً لـطموحاتِه الشخصية.",
        en:"**The distortion of meanings:** Words are emptied of their rational content and charged with emotional energy, allowing each individual to see in them the fulfilment of his personal ambitions." }
    ]},
    { t:"h2", ar:"4. التوزيع: العدوى الذهنية (Mental Contagion)",
      en:"4. Distribution: Mental Contagion" },
    { t:"p", ar:"بـمجردِ أن يَغرسَ القائدُ الفكرةَ في نـفوسِ قِلةٍ من الأتباع، تـنتشرُ عَبْرَ الـجماهيرِ بـواسطةِ **العدوى الذهنية**:",
      en:"Once the leader implants the idea in the souls of a few followers, it spreads through the masses by means of **mental contagion**:" },
    { t:"ul", items:[
      { ar:"**الانتشارُ الفيروسي:** تـعملُ هذه العدوى كـالـفـيروس، مِمَّا يُسببُ انتشاراً فـورياً للانفعالاتِ واليقينياتِ دونَ حـاجةٍ لـلمـُناقشة.",
        en:"**Viral spread:** This contagion works like a virus, causing the immediate spread of emotions and certainties without any need for discussion." },
      { ar:"**الاستقرارُ في \"رُوحِ الـجمهور\":** لا تـصبحُ الأفكارُ عـواملَ اجتماعيةً قويةً إلا بـعدَ أن تـهبطَ إلى \"التربةِ العميقة\" لـروحِ الـجماهير، لـتُشكلَ في نـهايةِ الـمـطاف **\"رُوحاً قومية\"** تـَعملُ بـتوجيهِ واحـدٍ لـلمشاعر.",
        en:"**Settling in the \"spirit of the crowd\":** Ideas do not become powerful social agents until they descend into the \"deep soil\" of the spirit of the masses, finally shaping a **\"national spirit\"** that operates with a single direction of the emotions." }
    ]},
    { t:"h2", ar:"خُلاصةُ \"دورةِ الدعاية\":",
      en:"Summary of the \"Cycle of Propaganda\":" },
    { t:"p", ar:"وِفقَ إطارِ لوبون، يـتبعُ صُعودُ أيِّ حـركةٍ مـساراً حـتمياً: يـبدأُ القادةُ بـاستخدامِ **هيبتِهم** لإطلاقِ **الكلماتِ والـمـُعادلات** التي تـُخاطبُ **الـمنطقَ العاطفي**؛ وعبرَ **التوكيدِ والتكرار**، تـتوزعُ هذه الأفكارُ بـسرعةٍ بـفعلِ **العدوى الذهنية** حتى تـغدوَ \"عقيدةً دينيةً\" لا تـتزحزح.",
      en:"Within Le Bon's framework, the ascent of any movement follows an inevitable course: the leaders begin by using their **prestige** to launch the **words and formulas** that address **emotional logic**; and through **affirmation and repetition**, these ideas are distributed rapidly by **mental contagion** until they become an unshakable \"religious doctrine\"." },
    { t:"note", ar:"إضاءةٌ من مِحبرةِ المترجم: \"إنَّ هذا الـمخططَ يَكشفُ بـوضوحٍ لـماذا يَفشلُ 'الـمـُثقف' ويـنجحُ 'الـمـُحرض'؛ فالأولُ يَخاطبُ في الإنسانِ 'القشرةَ الـدماغية' الحديثة، بـينما يَضربُ الثاني على أوتارِ 'الـدماغِ البدائي' حيثُ تـَسكنُ الغرائزُ والأساطير.\"",
      en:"Illumination from the translator's inkwell: \"This scheme clearly reveals why 'the intellectual' fails and 'the agitator' succeeds; the former addresses the modern 'cerebral cortex' in man, while the latter strikes the strings of the 'primitive brain' where instincts and myths reside.\"" }
  ]
},
{
  id:"u8", icon:"flask",
  t:{ ar:"الفلسفةُ التربويةُ اللوبونية: نحو \"راديكاليةِ الواقع\"",
      en:"Le Bon's Educational Philosophy: Toward \"Radicalising Reality\"" },
  blocks:[
    { t:"p", ar:"إنَّ هذه الرؤيةَ التربويةَ التي تَبسطُها بـاسمِ غوستاف لوبون (Gustave Le Bon) تُمثلُ ثورةً على ما كان يُسميهِ لوبون بـ **\"النزعةِ اللاتينيةِ الـعقيمة\"** في التعليم؛ تلك التي تـحشو الرؤوسَ بـالكلماتِ وتـُفرغُها من الإرادة. إنَّ اعتبارَ التعليمِ \"فناً لـتحويلِ الـوعي إلى لاوعي\" هو جـوهرُ الصناعةِ البشريةِ عند لوبون؛ فالعلمُ الحقيقيُّ لديه ليس ما تـحفظُه، بل ما تـمارسُه بـدقةِ \"الـمنعكسِ الشرطي\". وإليك تشريحُ هذا الـمنهجِ التربوي بـلسانٍ عربيٍّ رصين، يَتجلى فيه بَيانُ عمالقةِ الفكر:",
      en:"This educational philosophy, simplified in the name of Gustave Le Bon, represents a revolution against what Le Bon used to call **\"the sterile Latin trend\"** in education — the one that crams heads with words and empties them of will. Regarding education as \"an art of turning the conscious into the unconscious\" is the essence of the human craft for Le Bon: true knowledge, for him, is not what you memorise but what you practise with the precision of a \"conditioned reflex\". Here is the anatomy of this educational method in a sedate Arabic tongue, in which the exposition of the giants of thought shines:" },
    { t:"h2", ar:"1. الـمعلمُ بوصفِه \"مـُحرضاً\" (Meneur)",
      en:"1. The Teacher as an \"Agitator\" (Meneur)" },
    { t:"p", ar:"في مـدرسةِ لوبون، يـَسقطُ الـمعلمُ الأكاديميُّ التقليدي لـيحلَّ مـحلَّه الـمعلمُ ذو **\"الهيبة\"** (Prestige). إنَّ التدريسَ هنا لا يَعتمدُ على الحِجاجِ الـمنطقي الذي يـُنهكُ التلميذ، بل على **\"نـحوِ الإقناع\"**:",
      en:"In Le Bon's school, the traditional academic teacher falls to be replaced by the teacher of **prestige**. Teaching here does not rest on the logical argument that exhausts the pupil but on **\"the method of persuasion\"**:" },
    { t:"ul", items:[
      { ar:"**التوكيدُ والتكرار:** غَرْسُ الـحقائقِ الأساسيةِ كـبذورٍ في التربةِ السيكولوجية لـلطفلِ عبرَ صِيغٍ مـركزةٍ وتكرارٍ مـُلحّ، حتى تـصبحَ الفكرةُ جـزءاً من \"غريزتِه الذهنية\".",
        en:"**Affirmation and repetition:** Implanting the essential truths like seeds in the child's psychological soil through concise formulas and insistent repetition, until the idea becomes part of \"his mental instinct\"." },
      { ar:"**العدوى الانفعالية:** تـحويلُ الفصلِ الدراسي إلى كِيانٍ جـماعي يـسري فيه الشغفُ والـجدُّ بـالعدوى، مِمَّا يـَجعلُ التعلمَ فِعلاً تـلقائياً تـُحركه مـحاكاةُ الأفضل.",
        en:"**Emotional contagion:** Turning the classroom into a collective organism in which passion and diligence spread by contagion, making learning an automatic act driven by emulating the best." }
    ]},
    { t:"h2", ar:"2. سُـموُّ الـمختبرِ على الكتاب: \"مَنطقُ الأشياء\"",
      en:"2. The Supremacy of the Workshop over the Book: \"The Logic of Things\"" },
    { t:"p", ar:"يـرى لوبون أنَّ استبدالَ الكتبِ بـالأشغالِ اليدويةِ ليس مـجردَ تـغييرٍ في \"الوسيلة\"، بل هو تـغييرٌ في \"جـوهرِ العقل\". إنَّ مـمارسةَ الـخراطةِ أو الـنـجارةِ تـُعلمُ الطفلَ ما لا تعلمُه إياه كتبُ اللغاتِ القديمة:",
      en:"Le Bon holds that replacing books with manual labour is not merely a change of \"the means\" but a change in \"the essence of the mind\". Practising turning or carpentry teaches the child what the books of ancient languages cannot teach him:" },
    { t:"ul", items:[
      { ar:"**الـتصادمُ مع الـواقع:** في الـورشة، لا مـكانَ لـلأوهامِ أو الـتلاعبِ بـالكلمات؛ فـإما أن يـكونَ القياسُ دقيقاً أو تـفشلَ الـقطعة. هذا \"الاستبصارُ الـمادي\" هو الذي يَصقلُ **الـحكمَ الصائب** (Judgment).",
        en:"**Collision with reality:** In the workshop there is no place for illusions or wordplay; either the measurement is exact or the piece fails. This \"material insight\" is what polishes **sound judgement**." },
      { ar:"**الاستقراءُ الـفردي:** بَدلاً من تـلقينِ القوانينِ العلمية، يُوضَعُ الطالبُ أمامَ \"مُعضلةٍ مادية\" ويُطلبُ منه حـلُّها. إنَّ الـمعرفةَ التي تـأتي كـ \"نـتيجة\" لـبحثٍ ذاتي تـغوصُ في الـلاشعور، بـينما الـمعرفةُ الـملقنة تـبقى طـافيةً على سطحِ الذاكرة.",
        en:"**Individual induction:** Instead of dictating scientific laws, the student is placed before a \"material problem\" and asked to solve it. Knowledge that comes as the \"result\" of self-inquiry dives into the unconscious, whereas knowledge poured in from outside remains floating on the surface of memory." }
    ]},
    { t:"h2", ar:"3. بـناءُ \"الإرادة\" لا \"الذاكرة\"",
      en:"3. Building \"the Will\", Not \"the Memory\"" },
    { t:"p", ar:"يـحتقرُ لوبون نظامَ الـمبارياتِ والامتحاناتِ القائمَ على الـحفظ، ويراه مـصنعاً لـ \"الـساخطين\" والعاجزين. البديلُ لديه هو:",
      en:"Le Bon despises the system of competitions and examinations built on memorisation, seeing it as a factory of \"the discontented\" and the inept. His alternative is:" },
    { t:"ul", items:[
      { ar:"**الانضباطُ الداخلي (Self-control):** الهدفُ هو تـحويلُ الانضباطِ القسري (الخارجي) إلى \"قوةِ إرادة\" نـابعةٍ من الداخل. فالرجلُ الـمُتعلمُ عند لوبون هو مـَن يَملكُ سُلطاناً على نـفسِه، لا مـَن يَملكُ شهادةً في جـيبِه.",
        en:"**Internal discipline (self-control):** The aim is to transform compulsory (external) discipline into a \"power of will\" issuing from within. The learned man, for Le Bon, is he who holds authority over himself, not he who holds a certificate in his pocket." },
      { ar:"**مـحوُ الأنانيةِ الـفردية:** عبرَ العملِ الـجماعي والـمسؤوليةِ الـفرديةِ تجاهَ الـمهمة، يـتحولُ الطالبُ من \"مرتزقٍ\" يـبحثُ عن العلامات، إلى \"مواطنٍ\" يـعتزُّ بـالإتقان.",
        en:"**Erasure of individual selfishness:** Through collective work and individual responsibility toward the task, the student turns from a \"mercenary\" hunting for marks into a citizen who values excellence of work." }
    ]},
    { t:"h2", ar:"هل يـتلاءمُ هذا الـمنظورُ مع \"الـمدرسةِ الـحديثة\"؟",
      en:"Does This Perspective Accord with the \"Modern School\"?" },
    { t:"p", ar:"إنَّ رؤيةَ لوبون -على رَغمِ قِدمِها- تـتقاطعُ بـشكلٍ مـُذهل مع الـمنطلقاتِ الـحديثةِ لـ **\"التعلمِ الـقائمِ على الـمشروعات\"** (PBL) و**\"التعلمِ بـالـممارسة\"** (Learning by Doing). إنَّ استبدالَ \"الرموزِ الـمـيتة\" (الكتب) بـ \"الـواقعِ الحي\" هو السبيلُ الوحيدُ لـصناعةِ عقولٍ قادرةٍ على الابتكارِ لا مـجردِ الاجترار.",
      en:"Le Bon's vision — despite its age — intersects astonishingly with the modern premises of **\"project-based learning\"** (PBL) and **\"learning by doing\"**. Replacing \"dead symbols\" (books) with \"living reality\" is the only way to forge minds capable of innovation rather than mere reproduction." },
    { t:"p", ar:"بـرأيي، إنَّ الـمدرسةَ الحديثةَ تـفتقرُ بـالضبط إلى فِكرةِ **\"تـمرينِ الـحكمِ الصائب\"** عَبْرَ الـصدمةِ بـالواقع؛ فـنحنُ نـخرجُ \"عباقرةً في الورق\" و\"عاجزينَ في الميدان\". إنَّ دروسَ لوبون تـُذكرنا بـأنَّ الذكاءَ الحقيقيَّ يَسكنُ في \"الأطراف\" و\"الحواس\" بـقدرِ ما يَسكنُ في \"الدماغ\".",
      en:"In my view, the modern school lacks precisely the idea of **\"training sound judgement\"** through collision with reality; we graduate \"geniuses on paper\" and \"the helpless in the field\". Le Bon's lessons remind us that true intelligence dwells in the \"limbs\" and \"the senses\" as much as it dwells in \"the brain\"." },
    { t:"note", ar:"إضاءةٌ من مِحبرةِ المترجم: \"التعليمُ عند لوبون هو 'عمليةُ نـحتٍ' في الـرُّوح؛ فـبينما يـكتفي المعلمُ التقليدي بـطلاءِ السطح، يـغوصُ المعلمُ اللوبوني لـيغيرَ 'التركيبةَ الكيميائية' لـلإرادة. إنَّ 'يدَ' التلميذِ هي الـمختبرُ الحقيقيُّ لـعقله.\"",
      en:"Illumination from the translator's inkwell: \"Education for Le Bon is a process of carving the spirit; while the traditional teacher is content to paint the surface, the Le Bon-ian teacher dives in to change the 'chemical composition' of the will. The pupil's 'hand' is the true laboratory of his mind.\"" },
    { t:"p", ar:"هل تودُّ مني أن أصوغَ لك \"خطةَ درسٍ\" مـُصممةً وِفقَ قواعدِ لوبون لـمادةِ \"العلوم\" (مثلاً: دراسة الكهرباء عبر التطبيق اليدوي) أو \"التاريخ\" (عبر تقنيات التوكيد والعدوى الذهنية لبناء الروح القومية)؟",
      en:"\"Would you like me to draft for you a \"lesson plan\" designed according to Le Bon's rules for the subject of \"science\" (e.g., studying electricity through manual application) or \"history\" (through the techniques of affirmation and mental contagion for building the national spirit)?\"" }
  ]
}
);

/* ===== FLASHCARDS DATA — 84 cards covering all 8 units ===== */
const CARDS = [
/* ---- u1 ---- */
{id:"c01",u:"u1",f:{ar:"ما الذي يضعنا أمامه غوستاف لوبون في تحليله للاشتراكية؟",en:"What does Gustave Le Bon place us before in his analysis of socialism?"},b:{ar:"أمام تشريحٍ سيكولوجيٍّ فذٍّ لمكمن القوة في المذهب الاشتراكية؛ لا يراها نظرية اقتصادية قابلة للنقاش، بل \"عقيدةً دينيةً مستحدثة\" نبتت في رحيم \"المنطق العاطفي\".",en:"An outstanding psychological anatomy of the source of strength within the socialist doctrine; he does not see it as an economic theory open to discussion but as a \"new religious doctrine\" born in the womb of \"emotional logic\"."}},
{id:"c02",u:"u1",f:{ar:"ما المقصود بـ\"المنطق العاطفي\" عند لوبون؟",en:"What does \"emotional logic\" mean in Le Bon's thought?"},b:{ar:"عقلٌ يحكمه الإيمان والعاطفة لا البرهان؛فبمجرد أن يعبر المعتقد عتبة العاطفة يبني حصناً لا تطاله معاول المنطق. فهم هذا التحول من \"العقل\" إلى \"الإيمان\" يفسر عجز البراهين الاقتصادية أمام المؤمنين.",en:"A mind governed by faith and emotion rather than proof: once a belief crosses the threshold of emotion it builds a fortress immune to the battering rams of reason. Understanding this shift from \"reason\" to \"faith\" explains why economic proofs fail before believers."}},
{id:"c03",u:"u1",f:{ar:"لماذا تبدو جميع براهين علماء الاقتصاد صحيحة \"في وادٍ\" أمام جسارة المؤمنين بالاشتراكية؟",en:"Why do all the economists' proofs seem correct yet useless before the believers' audacity?"},b:{ar:"لأن الاشتراكية انتقلت من حيّز الواقع إلى حيّز \"الأحلام والتوكيدات\"؛ والجماهير لا تُقنع بالأرقام بل بالعاطفة والإيمان، فتبقى الحصون العاطفية محصنة أمام لغة الأرقام.",en:"Because socialism moved from the sphere of reality to the sphere of \"dreams and affirmations\"; the masses are not convinced by numbers but by emotion and faith, so the emotional fortresses remain impregnable before the language of numbers."}},
/* ---- u2 ---- */
{id:"c04",u:"u2",f:{ar:"اذكر بواعث الإيمان بالـ\"معبود الجديد\" (الدولة) كما يحللها لوبون.",en:"Name the sources of faith in the \"new deity\" (the State) as Le Bon analyses them."},b:{ar:"ثلاثة: (1) غريزة الخضوع؛ (2) خيبة الأمل في العِلم؛ (3) بابا جماعي (Providential State) أي الدولة بوصفها الإله المدبّر.",en:"Three: (1) the instinct of submission; (2) disillusionment with science; (3) the collective \"Papa\" (Providential State) — the state as the providentially managing deity."}},
{id:"c05",u:"u2",f:{ar:"ما \"غريزة الخضوع\" عند لوبون؟",en:"What is the \"instinct of submission\" for Le Bon?"},b:{ar:"يرى لوبون أن الإنسان لا ينزع نحو \"حرية الفكر\" كما يُشاع، بل نحو \"عبودية الفكر\": بحثٌ عن يقين ميكانيكي يوجه حياته ويُعفيه من عناء التفكير.",en:"Le Bon holds that man does not incline toward \"freedom of thought\" as commonly claimed but toward \"servitude of thought\": seeking a mechanical certainty that directs his life and relieves him of the toil of thinking."}},
{id:"c06",u:"u2",f:{ar:"ما \"خيبة الأمل في العِلم\" ولماذا انتعشت الاشتراكية بعدها؟",en:"What is the \"disillusionment with science\", and why did socialism rise after it?"},b:{ar:"استطاع العِلم هدم الآلهة القديمة لكنه عجز عن منح \"الأمل\" الذي تتوق إليه النفوس؛ فقفزت الاشتراكية لتملأ هذا الفراغ الروحي، واعدةً بـ\"فردوس أرضي\" يحل محل \"الفردوس السماوي\".",en:"Science managed to destroy the old gods but failed to bestow the \"hope\" that souls long for; socialism leapt in to fill this spiritual void, promising an \"earthly paradise\" to replace the \"heavenly paradise\"."}},
{id:"c07",u:"u2",f:{ar:"ما معنى \"بابا جماعي\" (Providential State) في تحليل لوبون؟",en:"What does the collective \"Papa\" (Providential State) mean in Le Bon's analysis?"},b:{ar:"أصبحت الدولة هي \"الإله المدبّر\" الذي يُنتظر منه محو الظلم وتوزيع السعادة بجرة قلم؛ أي نقل صفات الإله المريد إلى الدولة-الإله.",en:"The state became the \"deity who providentially manages all\", expected to erase injustice and distribute happiness at a stroke of the pen — the attributes of the wilful God transferred to the state-God."}},
{id:"c08",u:"u2",f:{ar:"ما ثلاثة أسباب عجز الاقتصاديين في مواجهة الاشتراكية؟",en:"What are the three reasons economists fail to confront socialism?"},b:{ar:"(1) المناعة ضد البرهان: انتشارها لا يرتبط بصحتها؛ (2) سلطان الرسل: الدعاية تمرّ عبر رسل لا مفكرين؛ (3) تبسيط المعقّد: صيغ بالغة البساطة تُقبل دون جهد ذهني.",en:"(1) Immunity against proof: its spread is not tied to its truth; (2) the rule of the apostles: propaganda travels through apostles, not intellectuals; (3) simplification of the complex: formulations of great simplicity accepted without mental effort."}},
{id:"c09",u:"u2",f:{ar:"ما المقصود بـ\"العدوى النفسية\" و\"الرُّسل\" (Apostles)؟",en:"What are \"psychological contagion\" and the \"apostles\"?"},b:{ar:"الجماهير لا تنفعل بالأدلة الدامغة بل بالعدوى النفسية؛ والرُّسل أفراد \"منوّمون مغناطيسياً\" بإيمانهم، مستعدون لكل تضحية، يرون نقد مذهبهم تدنيساً للمقدسات.",en:"The masses are not moved by conclusive evidence but by psychological contagion; the apostles are individuals \"magnetically mesmerised\" by their faith, ready for any sacrifice, who see critique of their doctrine as a desecration of the sacred."}},
{id:"c10",u:"u2",f:{ar:"لماذا يصف لوبون الاشتراكية بأنها \"دين المعدة\"؟",en:"Why does Le Bon call socialism \"the religion of the stomach\"?"},b:{ar:"لأنها تعد بإشباع المطامع المادية للجماهير؛ وتُخاطب \"الرغبة\" و\"الحقد الطبقي\" وهما عاطفتان بدائيتان، فتبدو براهين \"قوانين السوق\" و\"ندرة الموارد\" باردة ولا معنى لها أمام المندفعين خلف السراب.",en:"Because it promises to satisfy the masses' material cravings; it addresses \"desire\" and \"class hatred\" — primitive emotions — so the economists' proofs about the \"laws of the market\" or \"scarcity of resources\" seem cold and meaningless to those charging after the mirage."}},
{id:"c11",u:"u2",f:{ar:"ما خلاصة الموقف من أفول الاشتراكية عند لوبون؟",en:"What is Le Bon's summary of socialism's decline?"},b:{ar:"قد تنتصر توقيتاً لأنها تُوقظ \"تفانياً غير مشروط\"؛ لكن أفولها حتمي لأن وعودها ستصطدم بصخرة \"الحتميات الاقتصادية\" القاسية التي لا ترحم الأوهم.",en:"It may prevail for a time because it awakens \"unconditional self-sacrifice\"; yet its decline is inevitable, for its promises will crash against the rock of the harsh \"economic necessities\" that show no mercy to illusions."}},
{id:"c12",u:"u2",f:{ar:"بمَ يشبّه المترجم مشكلة مواجهة الاشتراكية بالأرقام؟",en:"What does the translator compare the problem of confronting socialism with numbers to?"},b:{ar:"بمحاولة إقناع عاشق ولهان بأن محبوبته قبيحة عبر استعراض قياسات وجهها؛ فالمنطق لا يملك سلطاناً على مملكة الخيال.",en:"Trying to convince an infatuated lover that his beloved is ugly by displaying measurements of her face; logic holds no sovereignty over the kingdom of imagination."}},
/* ---- u3 ---- */
{id:"c13",u:"u3",f:{ar:"ما \"روح العِرق\" ولماذا تعدّلها لوبون جوهر النظم السياسية والاجتماعية؟",en:"What is the \"spirit of the race\", and why does Le Bon treat it as the essence of political and social systems?"},b:{ar:"يرى لوبون أن النظم السياسية والاجتماعية - وعلى رأسها الاشتراكية - \"أعراض\" خارجية لجوهر باطن هو روح العرق؛ فحلم أمة هو في حقيقته كابوس لأمة أخرى، وكل يقرأ الاشتراكية بمداد تاريخه الموروث.",en:"Le Bon sees political and social systems — socialism at their head — as outward \"symptoms\" of an inward essence: the spirit of the race; the dream of one nation is in essence the nightmare of another, and each reads \"socialism\" with the ink of its inherited history."}},
{id:"c14",u:"u3",f:{ar:"ما فكرته الشهيرة عن الكلمات والشعارات؟",en:"His famous idea about words and slogans?"},b:{ar:"إنها أوعية فارغة يملؤها كل شعب بمحتوى سيكولوجي يتفق مع موروثاته \"الأتافية\" (Atavistic)، ولهذا اشتراكية الأنجلوسكسون نقيض اشتراكية اللاتين؛ والسر موضع \"الانضباط\".",en:"They are empty vessels each people fills with psychological content matching its \"atavistic\" inheritances; hence Anglo-Saxon socialism is the opposite of Latin socialism, and the secret lies in the source of \"discipline\"."}},
{id:"c15",u:"u3",f:{ar:"عرّف \"الانضباط الداخلي\" (Internal Discipline) وسماته عند الأنجلوسكسون.",en:"Define \"internal discipline\" and its traits among the Anglo-Saxons."},b:{ar:"عقل صقله تاريخ طويل من الاعتماد على الذات وروح المبادرة وضبط النفس؛ يرون الدولة \"شراً لابد منه\" تُقلص مهامها إلى الحد الأدنى.",en:"A mind polished by a long history of self-reliance, the spirit of initiative and self-control; they see the state as \"an unavoidable evil\" whose functions must be cut to the minimum."}},
{id:"c16",u:"u3",f:{ar:"ما \"اشتراكية الأحرار\" كما يراها لوبون في العالم الأنجلوسكسوني؟",en:"What is \"the socialism of free men\" as Le Bon sees it in the Anglo-Saxon world?"},b:{ar:"عندما يتبنون نظريات اشتراكية يحولونها إلى مسعى لتعزيز حرية المواطن عبر الجمعيات التطوعية والنقابات المهنية المستقلة؛ فالعامل الإنجليزي فرداني بطبعه يأنف من \"الدولة المدبرة\" التي تطعمه وتكسوه مقابل مصادرة إرادته.",en:"When they adopt socialist theories they turn them into a pursuit of citizen freedom through voluntary associations and independent professional unions; the English worker is individualistic by nature and recoils from the \"managing state\" that feeds and clothes him in exchange for confiscating his will."}},
{id:"c17",u:"u3",f:{ar:"عرّف \"الانضباط الخارجي\" (External Discipline) عند الشعوب اللاتينية.",en:"Define \"external discipline\" among the Latin peoples."},b:{ar:"قرون من المركزية المفرطة والسلطة الأبوية؛ \"حاجة مروعة لأن يكون مُحكماً\" وعجز متأصل عن المبادرة المستقلة، فالانضباط يُفرض بالسوط أو القانون من الأعلى لافتقار النفس اللاتينية إلى \"الوازع الداخلي\".",en:"Centuries of excessive centralisation and paternalistic authority; \"an alarming need to be governed\" and a deep-rooted incapacity for independent initiative, so discipline is imposed by the whip or the law from above, the Latin soul lacking the \"inner restraint\"."}},
{id:"c18",u:"u3",f:{ar:"ما المقصود بـ\"الاشتراكية الارتدادية\" (Retrograde) عند اللاتين؟",en:"What is \"retrograde socialism\" among the Latins?"},b:{ar:"ليست ثورة نحو المستقبل بل عقيدة ارتدادية تهدف لإحلال \"سلطة الدولة\" محل \"سلطة الملك\": تقوم الدولة بكل شيء - تصنع وتدير وتوزع وتساوي بين الرؤوس.",en:"Not a revolution toward the future but a retrograde doctrine replacing \"the authority of the state\" in place of \"the authority of the king\": the state does everything — produces, manages, distributes, and levels heads equal."}},
{id:"c19",u:"u3",f:{ar:"لماذا يصف لوبون الاشتراكية الألمانية بأنها \"حالة هجينة\"؟",en:"Why does Le Bon call German socialism a \"hybrid case\"?"},b:{ar:"لأن كارل ماركس منحها غلافاً علمياً، بينما مهدت لها \"الروح البروسية\" الطريق عبر قرنٍ من الانضباط العسكري الصارم؛ فصار العقل الألماني مستعداً سيكولوجياً للامتثال لتراتبيات الدولة الصارمة.",en:"Karl Marx gave it a scientific cover, while the \"Prussian spirit\" paved its way through a century of strict military discipline, leaving the German mind psychologically ready to submit to the rigid hierarchies of the state."}},
{id:"c20",u:"u3",f:{ar:"لماذا يعدّ لوبون الهندسة الاجتماعية \"وهماً خطيراً\"؟",en:"Why does Le Bon consider social engineering a \"dangerous illusion\"?"},b:{ar:"لأن المؤسسات لا تُصنع في المختبرات بل هي نتاج \"روح العرق\"؛ فنقل نظام شعب \"منضبط داخلياً\" إلى شعب \"لا يتحرك إلا بالزجر الخارجي\" كزراعة عضو غريب في جسد سيلفظه حتماً.",en:"Because institutions are not made in laboratories but are the product of the \"spirit of the race\"; transplanting the system of an \"internally disciplined\" people onto a people that \"moves only by external rebuke\" is like grafting a foreign organ into a body that will inevitably reject it."}},
{id:"c21",u:"u3",f:{ar:"ما \"فضيحة\" الفكر اللوبوني كما يصوّرها المترجم؟",en:"What is the \"scandal\" of Le Bon's thought as the translator portrays it?"},b:{ar:"جعل \"العرق\" سجناً لا فكاك منه؛ فالديمقراطية والاشتراكية والحرية ليست قيماً كونية بل مخرجات سيكولوجية تختلف باختلاف \"التربة الروحية\" لكل أمة.",en:"Making \"race\" a prison with no release; democracy, socialism and freedom are not universal values but psychological outputs that vary with the \"spiritual soil\" of each nation."}},
{id:"c22",u:"u3",f:{ar:"بمَ يجسّد المترجم مبدأ \"تعدد قراءات الاشتراكية\"؟",en:"How does the translator embody the principle of socialism's multiple readings?"},b:{ar:"بأن ما تسميه إنجلترا \"حرية\" قد تسميه فرنسا \"فوضى\"؛ والسر دائماً في \"اللاشعور الجمعي\" الموروث، فحلم أمة هو كابوس أخرى.",en:"What England calls \"freedom\", France may call \"anarchy\"; the secret always lies in the inherited \"collective unconscious\" — the dream of one nation is the nightmare of another."}},
/* ---- u4 ---- */
{id:"c23",u:"u4",f:{ar:"بمَ يجرّد لوبون الاشتراكية من ثوبها الاقتصادي؟",en:"Of what garment does Le Bon strip socialism?"},b:{ar:"يجردها من ثوبها الاقتصادي ليلبسها ثوبها الحقيقي في نظره: \"الحالة النفسية\" أو \"المعتقد الديني\"؛ فلا يرى في مذهبها صراعاً حول \"وسائل الإنتاج\" بل صراعاً حول \"الأوهام والغرائز\".",en:"He strips it of its economic garment to clothe it in what he sees as its true garment: the \"psychological state\" or \"religious belief\"; he sees in it not a struggle over the \"means of production\" but a struggle over \"illusions and instincts\"."}},
{id:"c24",u:"u4",f:{ar:"ما الذي يجعل الاشتراكية تزدهر في تحليل لوبون؟",en:"What makes socialism flourish in Le Bon's analysis?"},b:{ar:"ليست صحة نظرياتها بل \"البنية النفسية\" لمن يعتنقونها؛ فهي ملجأ لكل من عجز عن مواجهة قسوة النواميس الطبيعية والاقتصادية.",en:"Not the validity of its theories but the \"psychological structure\" of those who embrace it: a refuge for all who could not face the harshness of natural and economic laws."}},
{id:"c25",u:"u4",f:{ar:"من \"جيش الساخطين\"؟ وما الدافع السيكولوجي السائد فيه؟",en:"Who are \"the army of the discontented\"? What is its dominant psychological motive?"},b:{ar:"هم \"غير المتكيفين\" (The Unadapted): منعجزوا عن متطلبات المدنية الحديثة فتحوّلوا إلى \"حطام اجتماعي\"؛ ودافعهم السائد \"الحقد الأتافي\" لا الفقر ذاته بل \"التفوق\"؛ غيرة من كل جلال أو ثروة لا يملكون مواهب نيلها.",en:"They are \"the unadapted\": those who failed the demands of modern civilisation and became \"social wreckage\"; their dominant motive is \"atavistic hatred\" — not poverty itself but \"superiority\", envying every brilliance or wealth whose gifts they lack."}},
{id:"c26",u:"u4",f:{ar:"ما \"الأمل السحري\" في نظر لوبون؟",en:"What is \"magical hope\" in Le Bon's view?"},b:{ar:"نظرة إلى الاشتراكية كـ\"فانوس سحري\" سيعيد توزيع الأرزاق دون أن يُضطرّ المريد لبذل أدنى جهد شخصي.",en:"Viewing socialism as a \"magic lantern\" that will redistribute fortunes without the follower having to expend the slightest personal effort."}},
{id:"c27",u:"u4",f:{ar:"من \"أنصاف المتعلمين\" (Demi-savants) ولماذا يعدّهم لوبون الفئة الأخطر؟",en:"Who are the \"demi-savants\", and why does Le Bon deem them the most dangerous class?"},b:{ar:"يملكون \"ثقافة مكتبية\" واسعة يفتقرون معها إلى \"الحكمة العملية\"؛ وخطورتهم تكمن في غرورهم المعرفي ودعايتهم للهدم.",en:"They possess wide \"bookish culture\" while lacking \"practical wisdom\"; their danger lies in their intellectual pride and their propaganda of destruction."}},
{id:"c28",u:"u4",f:{ar:"ما \"المحركون\" (Meneurs) وما حلمهم الأسمى؟",en:"Who are the drivers (meneurs), and what is their supreme dream?"},b:{ar:"هم \"رسل الدمار\": يكرهون المجتمع الذي لم يعدهم عباقرة فوق العادة؛ وحلمهم الأسمى \"هدم المعبد\" ليتربعوا على عرشه بوصفهم الفلاسفة-الملوك الجدد.",en:"They are the \"apostles of destruction\": they hate the society that did not deem them geniuses above the ordinary; their supreme dream is to \"destroy the temple\" so they may sit on its throne as the new philosopher-kings."}},
{id:"c29",u:"u4",f:{ar:"ما خطر \"المنطق التجريدي\" عند أنصاف المتعلمين؟",en:"What is the danger of \"abstract logic\" among the demi-savants?"},b:{ar:"يظنون أن المجتمعات البشرية معادلات رياضية يمكن صياغتها من جديد بجرة قلم أو مرسوم قانوني، متجاهلين عناد التاريخ والبيولوجيا.",en:"They imagine human societies are mathematical equations reformulable by a mere stroke of the pen or a legal decree, ignoring the stubbornness of history and biology."}},
{id:"c30",u:"u4",f:{ar:"من \"النخبة الانتحارية\" وما \"اللامبالاة المريضة\" (Je m’enfichisme)؟",en:"Who are \"the suicidal elite\", and what is \"sick indifference\" (Je m'enfichisme)?"},b:{ar:"هم \"الطبقات الموجهة\" (البرجوازية والأثرياء) الذين تجد فيهم الاشتراكية مريدين مخلصين؛ ويعانون \"اللامبالاة المريضة\": فقدان الإرادة اللازمة للدفاع عن مكانتهم وحقوقهم.",en:"The \"leading classes\" (bourgeoisie and wealthy) among whom socialism finds devoted followers; they suffer \"sick indifference\": losing the will needed to defend their position and rights."}},
{id:"c31",u:"u4",f:{ar:"ما آليات \"التنازلات الجبانة\" وما نتاجها؟",en:"What is the mechanism of \"cowardly concessions\" and what does it produce?"},b:{ar:"يسرعون لتقديم التنازلات تحت وطأة \"طيف الخوف\"؛ وكل تنازل لا يُرضي الخصم بل يزيد من جسارته، في \"انتحار طبقي\" بطيء.",en:"They rush to concede under the pressure of \"the spectre of fear\"; every concession fails to satisfy the adversary but increases his boldness — a slow \"class suicide\"."}},
{id:"c32",u:"u4",f:{ar:"اذكر ثلاثة أوجه تجعل الاشتراكية \"حالة ذهنية\" لا نظرية علمية.",en:"Give three features making socialism a \"mental state\" rather than a scientific theory."},b:{ar:"(1) المناعة ضد العقل: مبنية على الحقد (الفقير) والخوف (الغني) والغرور (المثقف)؛ (2) بديل الدين: تُشبع الغريزة الدينية وتجعل الدولة \"الإله\"؛ (3) انتصار الغريزة: ردة بربرية تُعلي الغريزة الجماعية على العقل الفردي.",en:"(1) Immunity against reason: built on hatred (poor), fear (rich) and pride (intellectual); (2) substitute for religion: it satisfies the religious instinct and makes the state the \"god\"; (3) triumph of instinct: a barbaric regression exalting the collective instinct over individual reason."}},
{id:"c33",u:"u4",f:{ar:"ما \"عُقد النقص\" و\"ضعف الإرادة\" في إضاءة المترجم؟",en:"What are the \"inferiority complex\" and \"weakness of will\" in the translator's illumination?"},b:{ar:"أن نزع لوبون القداسة عن الثورات الاجتماعية: ما يبدو مطالب بالعدالة هو في باطنه صراع بين \"عُقد النقص\" لدى المهمشين و\"ضعف الإرادة\" لدى السادة؛ وحالة الاشتراكية حالة أمة فقدت روحها القومية.",en:"Le Bon stripped sanctity from social revolutions: what appears as demands for justice is inwardly a struggle between the \"inferiority complex\" of the marginalised and the \"weakness of will\" of the masters; socialism's mental state is that of a nation that lost its national spirit."}},
/* ---- u5 ---- */
{id:"c34",u:"u5",f:{ar:"بمَ يضرب لوبون جذور الحلم الاشتراكي؟",en:"With what does Le Bon strike at the roots of the socialist dream?"},b:{ar:"بمعاول \"الحتمية البيولوجية والنواميس الطبيعية\": التباين الصارخ بين \"قوانين الانتخاب الطبيعي\" و\"وهم المساواة المطلقة\" يجعله يراها مشروعاً لانحطاط الحضارة لا لرفعتها.",en:"With the mattocks of \"biological necessity and natural laws\": the stark contrast between \"the laws of natural selection\" and \"the illusion of absolute equality\" makes him see it as a project for civilisation's decline, not its elevation."}},
{id:"c35",u:"u5",f:{ar:"ما العلاقة بين اللامساواة الطبيعية والتقدم؟",en:"What is the relation between natural inequality and progress?"},b:{ar:"جميع صور التقدم في الأنواع الحية والحضارات البشرية نتاج \"اللامساواة الطبيعية\" و\"التنازع من أجل البقاء\"؛ البقاء للأصلح والأكثر قدرة على التكيف.",en:"All forms of progress in living species and human civilisations are the product of \"natural inequality\" and the \"struggle for existence\"; survival favours the better adapted."}},
{id:"c36",u:"u5",f:{ar:"ما معنى \"عقم التسوية\" و\"رق العاجزين\"؟",en:"What do \"the sterility of levelling\" and \"the enslavement of the weak\" mean?"},b:{ar:"التفاوت الاجتماعي ليس إلا تجلياً خارجياً لتفاوتات طبيعية بيولوجية لا سلطان للبشر على تغييرها؛ وفي نظام الحرية والمساواة المطلقة يُسحق الضعفاء افتقاراً إلى \"الاستعدادات الموروثة\"، أشد قسوة من المجتمعات الأرستقراطية.",en:"Social disparity is but the outward manifestation of natural and biological differences humans cannot change; under absolute freedom and equality the weak are crushed for lacking \"inherited endowments\", more harshly than in aristocratic societies."}},
{id:"c37",u:"u5",f:{ar:"ما \"التطور الارتدادي\" (Regressive Evolution) في مشروع الاشتراكية؟",en:"What is \"regressive evolution\" in the socialist project?"},b:{ar:"مسعى قمع اللامساواة الطبيعية نحو البربرية البدائية بالتضحية بـ\"الأفراد المتفوقين\" - صناع العلم والصناعة - لأجل الأغلبية \"المتوسطة أو المتبلدة\".",en:"The endeavour to suppress natural inequality, regressing toward primitive barbarism by sacrificing \"superior individuals\" — the makers of science and industry — for the \"mediocre or dull\" majority."}},
{id:"c38",u:"u5",f:{ar:"لماذا تعني المساواة عند لوبون سيادة \"الرداءة\"؟",en:"Why does equality, for Le Bon, mean the reign of \"mediocrity\"?"},b:{ar:"لأنها تخنق التميز الفردي الذي هو المصدر الوحيد للثروة والحضارة؛ وحماية الحضارة تكمن في صيانة التراتبية التي تسمح للأذكياء بالقيادة وللعاجزين بالانضواء تحت نظام يحميهم دون أن يعطل التقدم.",en:"Because it chokes individual excellence, the sole source of wealth and civilisation; protecting civilisation lies in preserving the hierarchy that lets the intelligent lead and shelters the weak without halting progress."}},
{id:"c39",u:"u5",f:{ar:"لماذا يعدّ لوبون الاشتراكية \"تهديد كياني\"؟",en:"Why does Le Bon deem socialism an \"existential threat\"?"},b:{ar:"لأنها تحاول بناء مجتمع ضد الطبيعة؛ وكل ما هو ضد الطبيعة محكوم عليه بالانهيار بعد تحويل العالم إلى خراب.",en:"Because it attempts to build a society against nature; and everything against nature is doomed to collapse after turning the world into ruin."}},
{id:"c40",u:"u5",f:{ar:"كيف تختلف الوعود الاشتراكية عن وعود الأديان التقليدية؟",en:"How do socialist promises differ from those of traditional religions?"},b:{ar:"الأديان تعدّ بسعادة سماوية لا يمكن دحضها؛ أما الاشتراكية فتعدّ بـ\"سعادة أرضية\" سرعان ما يفضح الواقع زيفها عبر البؤس والفوضى الاجتماعية العارمة.",en:"Traditional religions promise a heavenly happiness that cannot be refuted; socialism promises an \"earthly happiness\" whose falsity reality soon exposes through misery and immense social chaos."}},
{id:"c41",u:"u5",f:{ar:"بمَ يشبه المترجم موقف لوبون من الحقوق؟",en:"How does the translator characterise Le Bon's stance on rights?"},b:{ar:"بأنه \"دارويني السوسيولوجيا\": لا يؤمن بحقوق مجردة تُمنح للجميع بل بحقوق تُكتسب بالارتقاء؛ فمأساة الاشتراكية أنها تريد إلغاء \"المحرك\" (التفاوت) لتدبير \"الآلة\" (المجتمع)، والنتيجة عطالة حتمية.",en:"As \"the Darwin of sociology\": he believes not in abstract rights granted to all but in rights acquired through ascent; socialism's tragedy is that it wants to abolish \"the engine\" (difference) to run \"the machine\" (society), and the result is inevitable paralysis."}},
/* ---- u6 ---- */
{id:"c42",u:"u6",f:{ar:"ما المقصود بـ\"الحق الإلهي الحديث\" و\"الدولة-الإله\"؟",en:"What do \"the modern divine right\" and \"the state-God\" mean?"},b:{ar:"الاشتراكية حركة دينية تقوم على الإيمان المطلق بقوة الدولة وقدرة على اجتراح المعجزات؛ والجماهير نقلت صفات \"الإله المريد\" إلى \"الدولة-الإله\" (The Providential State) منتظرةً حلاً لكل معضلات الوجود.",en:"Socialism is a religious movement resting on absolute faith in the state's power to work miracles; the masses transferred the attributes of \"the wilful God\" to the \"state-God\" (the Providential State), expecting a solution to every existential impasse."}},
{id:"c43",u:"u6",f:{ar:"لماذا محكوم الإنتاج الذي تديره الدولة بالفشل؟",en:"Why is state-managed production doomed to fail?"},b:{ar:"لغياب محرّك \"المصلحة الشخصية\"؛ فيؤدي ابتلاع الدولة لكل الصناعات إلى عجز عن الاستمرار بغير إرساء \"العمل القسري\" مقابل أدنى أجر للمعيشة (قانون العطالة).",en:"For want of the engine of \"personal interest\"; the state's swallowing of all industries leaves it unable to continue without instituting \"forced labour\" for the lowest subsistence wage (the law of idleness)."}},
{id:"c44",u:"u6",f:{ar:"ما \"العبودية المقننة\" أو \"الرق الحديث\" عند لوبون؟",en:"What is \"codified slavery\" or \"modern bondage\" for Le Bon?"},b:{ar:"تحول المواطنين إلى \"أرقام\" في آلة بيروقراطية ضخمة يُجبر الجميع على كدح بائس لتعويض قصور الإدارة المركزية.",en:"Citizens turning into \"numbers\" in a vast bureaucratic machine, all forced to toil miserably to compensate for the shortcomings of centralised administration."}},
{id:"c45",u:"u6",f:{ar:"ما القاعدة الثابتة التي ينطلق منها لوبون في شلل التقدم؟",en:"What established rule does Le Bon start from regarding the paralysis of progress?"},b:{ar:"\"إن الفرد المبدع هو صانع الحضارة، لا الجموع\"؛ فبسحق المبادرة الفردية باسم المساواة تُعطل الاشتراكية أهم روافع العصر الحديث.",en:"\"It is the creative individual who makes civilisation, not the crowds\"; by crushing individual initiative in the name of equality, socialism disables the modern age's most important levers."}},
{id:"c46",u:"u6",f:{ar:"ما \"الرسوب الاجتماعي\" و\"الرداءة الشاملة\" (Base Equality)؟",en:"What are \"social failure\" and \"universal mediocrity\" (Base Equality)?"},b:{ar:"تأول الأمة إلى حالة من الرداءة الشاملة: مجتمع يتحول إلى \"رواسب اجتماعية\" تفتقر إلى أي بريق ذهني أو علمي، وأمة تغدو مضحة كتلة خاملة من البشر.",en:"The nation lapsing into universal mediocrity: a society of \"social sediments\" lacking any intellectual or scientific brilliance, a nation become a sheer inert mass of human beings."}},
{id:"c47",u:"u6",f:{ar:"ما \"العبودية المهينة\" ومقابلها \"حكم ذاتي\" (Self-government)؟",en:"What is \"humiliating servitude\" versus \"self-government\"?"},b:{ar:"عندما تتدخل الدولة في أدق تفاصيل الحياة تقتل في الفرد عادة \"الحكم الذاتي\"؛ فتضمحل الشخصية وينتقل المجتمع إلى العبودية المهينة.",en:"When the state intervenes in the finest details of life it kills in the individual the habit of \"self-government\"; personality atrophies and society sinks into humiliating servitude."}},
{id:"c48",u:"u6",f:{ar:"صِف \"نفسية المرتزقة\" في الدولة الاشتراكية.",en:"Describe \"the psychology of mercenaries\" in the socialist state."},b:{ar:"مواطنون يتحولون إلى \"مرتزقة جبناء\" يفتقرون للجسارة والمسؤولية، بانتظار أوامر \"البابا الجماعي\"؛ و\"جحيم العبودية\" هذا يفوق قسوة أي أرستقراطية غابرة لأن الطاغية \"مجهول\" ولا قلب له.",en:"Citizens become \"cowardly mercenaries\" lacking boldness and responsibility, awaiting the orders of the \"collective Papa\"; this \"hell of servitude\" exceeds any bygone aristocracy, for the tyrant is \"anonymous\" and has no heart."}},
{id:"c49",u:"u6",f:{ar:"ما \"المآل المحتوم\" للأمة التي تضحي بالتميز؟",en:"What is the \"inevitable fate\" of the nation sacrificing excellence?"},b:{ar:"الفوضى الاجتماعية، ثم أحد مسارين: (1) ظهور \"قيصر\" دكتاتور يفرض النظام بالقوة؛ (2) الغزو الخارجي من دول جارة أكثر حيوية لم تفتك بها عدوى الاشتراكية.",en:"Social chaos, then one of two paths: (1) the rise of \"a Caesar\", a strong dictator imposing order by force; (2) foreign invasion by more vital neighbouring states not yet plagued by the contagion of socialism."}},
{id:"c50",u:"u6",f:{ar:"بمَ يلخّز المترجم قوة طرح لوبون؟",en:"How does the translator sum up the strength of Le Bon's argument?"},b:{ar:"بأن \"الدولة\" لا تملك عقلاً لتبدع بل يداً لتقمع؛ والاشتراكية \"ردة بيولوجية\" لأنها تجعل \"الخلية\" (الفرد) خادمة لـ\"الكتلة\" (الدولة) متجاهلة أن حياة الكائن في تميز خلاياه لا في انصهارها.",en:"That the \"state\" has no mind to create, only a hand to repress; socialism is a \"biological regression\" making \"the cell\" (the individual) a servant of \"the mass\" (the state), ignoring that a being's life lies in the distinction of its cells, not their melting away."}},
/* ---- u7 ---- */
{id:"c51",u:"u7",f:{ar:"ما \"دورة الغواية\" في الإبستيمولوجيا السيكولوجية للوبون؟",en:"What is the \"cycle of seduction\" in Le Bon's psychological epistemology?"},b:{ar:"نجاح أي مذهب لا يرتبط بصحته المادية بل باتساقه مع \"القوانين النفسية\" للإقناع؛ حيث يتحول المحرض إلى \"نبي\" والكلمة إلى \"سحر\"؛ والمعارك تُدار في دهاليز \"اللاشعور\" لا ساحة البرهان.",en:"A doctrine's success is tied not to its material validity but to its consistency with the \"psychological laws\" of persuasion, where the agitator becomes a \"prophet\" and the word becomes \"magic\"; battles are fought in the corridors of \"the unconscious\", not the arena of proof."}},
{id:"c52",u:"u7",f:{ar:"ما \"القانون الأول\" الذي يحكم صعود الاشتراكية؟",en:"What is the \"first law\" governing socialism's ascent?"},b:{ar:"سيادة \"منطق العواطف\": الجماهير لا تنفعل بالأدلة المنطقية؛ وبما أن الاشتراكية تقع في منطقة \"الأحلام والوعود الخيالية\" فإنها تتجاوز العقل التحليلي تماماً.",en:"The sovereignty of \"emotional logic\": the masses are not moved by logical evidence; and since socialism lies in the region of \"dreams and fantastic promises\", it bypasses the analytical mind entirely."}},
{id:"c53",u:"u7",f:{ar:"متى يتحول المفهوم إلى \"عقيدة محصنة\"؟",en:"When does a concept become an \"entrenched doctrine\"?"},b:{ar:"بمجرد أن يدخل مجال العاطفة؛ عندها لا ينال النقاش منها شيئاً ويصبح الزمن وحده - لا الجدال - قادراً على تفكيكها.",en:"The moment it enters the domain of emotion; then discussion cannot touch it and time alone — not debate — can dismantle it."}},
{id:"c54",u:"u7",f:{ar:"ما \"الهيبة\" (Prestige) ودورها في الإقناع؟",en:"What is \"prestige\" and its role in persuasion?"},b:{ar:"القوة السحرية التي يفرض بها القائد سلطانه دون منطق؛ تجعل الأفكار مقبولة دون جهد نقدي، وهي شرط لنجاح الدعاية إلى جانب وجود قادة (Apostles/Meneurs).",en:"The magical force by which a leader imposes authority without logic; it makes ideas acceptable without critical effort, and — alongside the existence of leaders (apostles/meneurs) — is a condition of propaganda's success."}},
{id:"c55",u:"u7",f:{ar:"ما \"العقلية الميتافيزيقية\" للقادة عند لوبون؟",en:"What is the \"metaphysical mindset\" of leaders for Le Bon?"},b:{ar:"القادة \"أنصاف مهطوعين\" أو متحمسون دينيون نقلوا غرائزهم الدينية الموروثة إلى معبد \"الدولة المدبرة\".",en:"The leaders are \"half-deranged\" men or religious fanatics who transferred their inherited religious instincts to the temple of the \"providential state\"."}},
{id:"c56",u:"u7",f:{ar:"ما التقنية السيكولوجية الثنائية لغرس الأفكار؟",en:"What is the twofold psychological technique for implanting ideas?"},b:{ar:"\"التوكيد\" (Affirmation) و\"التكرار\" (Repetition)؛ يُغرسان الأفكار في \"اللاشعور الجمعي\".",en:"\"Affirmation\" and \"repetition\", implanting ideas in the \"collective unconscious\"."}},
{id:"c57",u:"u7",f:{ar:"كيف تستخدم الكلمات \"كتعويذات\"؟",en:"How are words used as \"spells\"?"},b:{ar:"بلغة الصور: صيغ حية مثل \"مملكة الفقراء\" تحل محل الواقع المعقّد أمام جمهور عاجز عن المحاكمة العقلية؛ وتشويهاً للمعاني: تُفرغ الكلمات من محتواها العقلاني لتُشحن بطاقة عاطفية يرى فيها كل فرد تحقق طموحاته.",en:"Through the language of images: living formulas like \"the kingdom of the poor\" replacing complex reality before a public incapable of rational judgement; and through distortion of meanings: words emptied of rational content and charged with emotional energy, each individual seeing his ambitions fulfilled in them."}},
{id:"c58",u:"u7",f:{ar:"ما \"العدوى الذهنية\" (Mental Contagion) ومسارها؟",en:"What is \"mental contagion\" and its course?"},b:{ar:"انتشار فيروسي للانفعالات واليقينيات دون مناشرة؛ ولا تصبح الأفكار عواملة اجتماعية قوية إلا بعد نزولها إلى \"التربة العميقة\" لروح الجماهير لتُشكل \"روح قومية\" تعمل بتوحيد المشاعر.",en:"A viral spread of emotions and certainties without discussion; ideas become powerful social agents only after descending into the \"deep soil\" of the crowd's spirit to shape a \"national spirit\" unifying the emotions."}},
{id:"c59",u:"u7",f:{ar:"لخّص \"دورة الدعاية\" عند لوبون في سلسلة مترابطة.",en:"Summarise Le Bon's \"cycle of propaganda\" as a chain."},b:{ar:"هيبة القادة → إطلاق الكلمات والمعادلات التي تخاطب المنطق العاطفي → التوكيد والتكرار → انتشار سريع بالعدوى الذهنية → تحوّل الفكرة إلى عقيدة دينية لا تتزحزح.",en:"Leaders' prestige → launching words and formulas addressing emotional logic → affirmation and repetition → rapid spread by mental contagion → the idea becomes an unshakable religious doctrine."}},
{id:"c60",u:"u7",f:{ar:"لماذا يفشل \"المثقف\" وينجح \"المحرض\"؟",en:"Why does \"the intellectual\" fail while \"the agitator\" succeeds?"},b:{ar:"لأن المثقف يخاطب \"القشرة الدماغية\" الحديثة في الإنسان، بينما المحرض يضرب على أوتار \"الدماغ البدائي\" حيث تسكن الغرائز والأساطير.",en:"Because the intellectual addresses the modern \"cerebral cortex\" in man, while the agitator strikes the strings of the \"primitive brain\" where instincts and myths reside."}},
/* ---- u8 ---- */
{id:"c61",u:"u8",f:{ar:"ما \"النزعة اللاتينية العقيمة\" في التعليم عند لوبون؟",en:"What is the \"sterile Latin trend\" in education for Le Bon?"},b:{ar:"تلك التي تحشو الرؤوس بالكلمات وتُفرغها من الإرادة؛ ورؤيته التعليم ثورة عليها: فنٌّ لتحويل الوعي إلى لاوعي.",en:"The one that crams heads with words and empties them of will; his vision of education is a revolution against it: an art of turning the conscious into the unconscious."}},
{id:"c62",u:"u8",f:{ar:"ما \"العلم الحقيقي\" عند لوبون؟",en:"What is \"true knowledge\" for Le Bon?"},b:{ar:"ليس ما تحفظه بل ما تمارسه بدقّة \"المنعكس الشرطي\"؛ فالتعليم عملية نحتٍ في الروح يغيّر \"التركيبة الكيميائية\" للإرادة لا مجرد طلاء السطح.",en:"Not what you memorise but what you practise with the precision of a \"conditioned reflex\"; education is a carving of the spirit that changes the \"chemical composition\" of the will rather than merely painting the surface."}},
{id:"c63",u:"u8",f:{ar:"كيف يكون المعلم \"محرضاً\" (Meneur) في مدرسة لوبون؟",en:"How is the teacher an \"agitator\" (meneur) in Le Bon's school?"},b:{ar:"يحل المعلم ذو \"الهيبة\" محل الأكاديمي التقليدي؛ والتدريس لا يعتمد على الحجاج المنطقي المُنهك بل على \" نحو الإقناع\": التوكيد والتكرار، والعدوى الانفعالية.",en:"The teacher of \"prestige\" replaces the traditional academic; teaching rests not on exhausting logical argument but on \"the method of persuasion\": affirmation and repetition, and emotional contagion."}},
{id:"c64",u:"u8",f:{ar:"ماذا يُحدث \"التأكيد والتكرار\" في النفس الطفلية؟",en:"What do \"affirmation and repetition\" achieve in the child's psyche?"},b:{ar:"غرس الحقائق الأساسية كبذور في التربة السيكولوجية عبر صيغ مركزة وتكرار ملح، حتى تصير الفكرة جزءاً من \"غريزته الذهنية\".",en:"Implanting essential truths like seeds in the psychological soil through concise formulas and insistent repetition, until the idea becomes part of \"his mental instinct\"."}},
{id:"c65",u:"u8",f:{ar:"ما \"العدوى الانفعالية\" في الفصل الدراسي؟",en:"What is \"emotional contagion\" in the classroom?"},b:{ar:"تحويل الفصل إلى كيان جماعي يسري فيه الشغف والجد بالعدوى، فيصير التعلّم فعلاً تلقائياً تُحركه محاكاة الأفضل.",en:"Turning the classroom into a collective organism where passion and diligence spread by contagion, making learning an automatic act driven by emulating the best."}},
{id:"c66",u:"u8",f:{ar:"لماذا يعدّ لوبون المختبر والأشغال اليدوية أنفع من الكتب؟",en:"Why does Le Bon deem the workshop and manual labour more useful than books?"},b:{ar:"لأنها ليست تغيير في \"الوسيلة\" بل في \"جوهر العقل\": التصادم مع الواقع في الورشة - لا مكان للأوهام ولا للتلاعب بالكلمات؛ إما قياس دقيق أو فشل القطعة، وهذا \"الاستبصار المادي\" يصقل \"الحكم الصائب\" (Judgment).",en:"Because they change not \"the means\" but \"the essence of the mind\": in the workshop one collides with reality — no room for illusions or wordplay; either the measurement is exact or the piece fails, and this \"material insight\" polishes \"sound judgement\"."}},
{id:"c67",u:"u8",f:{ar:"ما \"الاستقراء الفردي\" ولماذا يُفضَّل على التلقين؟",en:"What is \"individual induction\", and why is it preferred to dictation?"},b:{ar:"وضع الطالب أمام \"معضلة مادية\" يُطلب منه حلها بدل تلقين القوانين العلمية؛ فالمعرفة النتيجة لبحث ذاتي تغوص في اللاشعور، بينما الملقوقة تبقى طافية على سطح الذاكرة.",en:"Placing the student before a \"material problem\" to solve instead of dictating scientific laws; knowledge that results from self-inquiry dives into the unconscious, whereas knowledge poured in remains floating on memory's surface."}},
{id:"c68",u:"u8",f:{ar:"ما البديل الذي يقترحه لوبون لنظام المباريات والامتحانات؟",en:"What alternative does Le Bon propose for the system of competitions and examinations?"},b:{ar:"بناء \"الإرادة\" لا \"الذاكرة\": تحويل الانضباط القسري (الخارجي) إلى \"قوة إرادة\" من الداخل؛ فالمتعلم من يملك سلطاناً على نفسه لا من يملك شهادة في جيبه، ويتحول من \"مرتزق\" يبحث عن العلامات إلى \"مواطن\" يعتز بالإتقان عبر العمل الجماعي والمسؤولية الفردية.",en:"Building \"the will\", not \"the memory\": transforming compulsory (external) discipline into an inner \"power of will\"; the learned man is he with authority over himself, not a certificate in his pocket — turning from a \"mercenary\" hunting marks into a citizen valuing excellence through collective work and individual responsibility."}},
{id:"c69",u:"u8",f:{ar:"أين تتقاطع رؤية لوبون مع المدرسة الحديثة؟",en:"Where does Le Bon's vision intersect with the modern school?"},b:{ar:"مع \"التعلم القائم على المشروعات\" (PBL) و\"التعلم بالفعل\" (Learning by Doing)؛ واستبدال \"الرموز الميتة\" (الكتب) بالواقع الحي سبيل صناعة عقول قادرة على الابتكار لا مجرد الاجترار.",en:"With \"project-based learning\" (PBL) and \"learning by doing\"; replacing \"dead symbols\" (books) with living reality is the way to forge minds capable of innovation rather than mere reproduction."}},
{id:"c70",u:"u8",f:{ar:"ما النقد الذي يوجهه للمدرسة الحديثة وما درس لوبون التذكيري؟",en:"What critique does he level at the modern school, and what is Le Bon's reminder?"},b:{ar:"تفقرها إلى \"تمرين الحكم الصائب\" عبر الصدمة بالواقع؛ فنخرج \"عباقرة في الورق\" و\"عاجزين في الميدان\". ودرس لوبون: الذكاء الحقيقي يسكن \"الأطراف\" و\"الحواس\" بقدر ما يسكن \"الدماغ\"، و\"يد\" التلميذ هي مختبر عقله.",en:"Its lack of \"training sound judgement\" through collision with reality; we graduate \"geniuses on paper\" and \"the helpless in the field\". Le Bon's lesson: true intelligence dwells in the \"limbs\" and \"senses\" as much as in \"the brain\", and the pupil's \"hand\" is the true laboratory of his mind."}}
];

 e:{ar:"يرفض لوبون الشائع بأن الإنسان ينزع نحو حرية الفكر؛ بل ينزع نحو عبودية الفكر: يقين جاهز يُدير حياته ويعفيه من مسؤولية التفكير النقدي.",en:"Le Bon rejects the common claim that man inclines to freedom of thought; he inclines to servitude of thought: a ready-made certainty managing his life and freeing him from critical thinking."}},
