<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="سيكولوجيا الاشتراكية — تطبيق تعلّم ذكي مستقل يعمل دون إنترنت | The Psychology of Socialism — offline smart learning app">
<title>سيكولوجيا الاشتراكية — تعلّم ذكي | The Psychology of Socialism</title>
<style>
/* ================= Soft UI Minimalist ================= */
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#eef1f8; --bg2:#f7f9fd; --card:#ffffff; --card2:#f6f8fd;
  --text:#1b2233; --muted:#69738c; --line:#e6eaf3;
  --pri:#6c5ce7; --pri2:#8f83f5; --pri-soft:#efedff;
  --ok:#0fb083; --ok-soft:#e3f8f1; --bad:#e8604c; --bad-soft:#fdeae6; --warn:#f0a53e; --warn-soft:#fdf1e0;
  --sh:0 12px 30px -14px rgba(23,32,64,.20); --sh2:0 6px 18px -10px rgba(23,32,64,.22);
  --r:22px; --r2:16px; --r3:12px;
}
html[data-theme=dark]{
  --bg:#0e1320; --bg2:#131a2a; --card:#1a2234; --card2:#202a40;
  --text:#e8ecf6; --muted:#98a2ba; --line:#2a3450;
  --pri:#8b7cf7; --pri2:#a99df8; --pri-soft:#262449;
  --ok:#2fd3a2; --ok-soft:#123528; --bad:#ff7a63; --bad-soft:#3a211d; --warn:#f7b955; --warn-soft:#38301c;
  --sh:0 14px 34px -14px rgba(0,0,0,.55); --sh2:0 8px 20px -12px rgba(0,0,0,.5);
}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 500px at 100% -10%, color-mix(in srgb, var(--pri) 12%, transparent), transparent 60%),
    radial-gradient(900px 480px at -10% 110%, color-mix(in srgb, var(--ok) 10%, transparent), transparent 60%),
    var(--bg);
  color:var(--text); font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Amiri",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  min-height:100vh; line-height:1.75; -webkit-font-smoothing:antialiased;
}
button,input,select{font-family:inherit; color:inherit}
button{cursor:pointer; border:none; background:none}
::selection{background:color-mix(in srgb, var(--pri) 30%, transparent)}
.wrap{max-width:1120px; margin:0 auto; padding:16px clamp(10px,3vw,26px) 90px}
.icon{display:inline-block; width:1.15em; height:1.15em; vertical-align:-.22em; fill:currentColor; flex:none}
.icon svg{width:100%; height:100%; display:block}

/* ---------- Header ---------- */
header.top{
  position:sticky; top:0; z-index:40; backdrop-filter:blur(14px);
  background:color-mix(in srgb, var(--bg) 78%, transparent); border-bottom:1px solid var(--line);
}
.top-in{max-width:1120px; margin:0 auto; padding:10px clamp(10px,3vw,26px); display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.brand{display:flex; align-items:center; gap:12px; min-width:0}
.brand .logo{
  width:46px; height:46px; border-radius:16px; display:grid; place-items:center; flex:none;
  background:linear-gradient(140deg, var(--pri), var(--pri2)); color:#fff; box-shadow:var(--sh2)
}
.brand .logo .icon{width:24px; height:24px}
.brand h1{font-size:clamp(15px,2.4vw,19px); margin:0; line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand .by{font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px}
.brand .by .icon{color:var(--pri)}
.top-tools{margin-inline-start:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.tbtn{
  display:inline-flex; align-items:center; gap:7px; padding:9px 13px; border-radius:14px;
  background:var(--card); box-shadow:var(--sh2); font-size:13px; color:var(--text); transition:.18s;
}
.tbtn:hover{transform:translateY(-1px)}
.tbtn select{border:none; background:transparent; font-size:13px; outline:none; cursor:pointer}
.lang-pill{padding:5px; display:inline-flex; gap:4px; border-radius:16px; background:var(--card); box-shadow:var(--sh2)}
.lang-pill button{padding:7px 12px; border-radius:12px; font-size:12.5px; color:var(--muted); transition:.18s; white-space:nowrap}
.lang-pill button.on{background:linear-gradient(140deg,var(--pri),var(--pri2)); color:#fff; box-shadow:var(--sh2)}
.badge-dot{font-size:11px; color:var(--ok)}

/* ---------- Tabs ---------- */
nav.tabs{display:flex; gap:10px; overflow-x:auto; padding:14px 2px 6px; scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
.tab{
  display:flex; align-items:center; gap:10px; padding:10px 16px; border-radius:18px; flex:1 0 auto;
  background:var(--card); box-shadow:var(--sh2); color:var(--muted); transition:.2s; min-width:120px;
}
.tab .icon{width:19px; height:19px}
.tab b{display:block; font-size:14px; color:var(--text); font-weight:600; line-height:1.3}
.tab small{display:block; font-size:11px; line-height:1.3}
.tab.on{background:linear-gradient(140deg,var(--pri),var(--pri2)); color:#e9e6ff; box-shadow:var(--sh)}
.tab.on b{color:#fff}
.tab:hover:not(.on){transform:translateY(-2px)}

/* ---------- Panels & cards ---------- */
.panel{display:none; animation:pop .28s ease}
.panel.on{display:block}
@keyframes pop{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
.card{background:var(--card); border-radius:var(--r); box-shadow:var(--sh); padding:clamp(14px,2.5vw,24px); margin:14px 0}
.card h2{margin:.1em 0 .4em; font-size:clamp(17px,2.6vw,22px)}
.hint{color:var(--muted); font-size:13.5px}
.grid2{display:grid; grid-template-columns:260px 1fr; gap:16px; align-items:start}
@media(max-width:880px){.grid2{grid-template-columns:1fr}}
.side{position:sticky; top:86px}
@media(max-width:880px){.side{position:static}}
.unitlist{display:flex; flex-direction:column; gap:8px}
.unitlist .u{
  text-align:start; display:flex; gap:10px; align-items:center; padding:10px 12px; border-radius:var(--r3);
  background:var(--card2); transition:.18s; width:100%; border:1.5px solid transparent;
}
.unitlist .u .icon{color:var(--pri); width:17px; height:17px}
.unitlist .u span{font-size:13px; line-height:1.45; flex:1; min-width:0}
.unitlist .u small{display:block; color:var(--muted); font-size:11px}
.unitlist .u.on{border-color:var(--pri); background:var(--pri-soft)}
.unitlist .u .ck{color:var(--ok)}
.chips{display:none; gap:8px; overflow-x:auto; padding-bottom:6px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
@media(max-width:880px){.chips{display:flex} .unitlist{display:none}}
.chip{flex:0 0 auto; padding:8px 14px; border-radius:999px; background:var(--card); box-shadow:var(--sh2); font-size:13px; color:var(--muted); display:inline-flex; gap:7px; align-items:center}
.chip.on{background:linear-gradient(140deg,var(--pri),var(--pri2)); color:#fff}

/* ---------- Content typography ---------- */
.content .unit-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.content .unit-head .icon{width:26px; height:26px; color:var(--pri)}
.content h2{font-size:clamp(18px,3vw,24px); margin:.2em 0}
.content h3{font-size:clamp(15px,2.4vw,18px); margin:1.3em 0 .4em; padding-inline-start:12px; border-inline-start:4px solid var(--pri2); color:var(--text)}
.content p{margin:.65em 0; font-size:clamp(14.5px,2.2vw,16.2px)}
.content ul,.content ol{margin:.5em 0; padding-inline-start:0; list-style:none}
.content li{position:relative; padding-inline-start:26px; margin:.45em 0; font-size:clamp(14.5px,2.2vw,16px)}
.content ul li::before{content:""; position:absolute; inset-inline-start:6px; top:.72em; width:9px; height:9px; border-radius:50%; background:linear-gradient(140deg,var(--pri),var(--ok))}
.content ol{counter-reset:n}
.content ol li{counter-increment:n}
.content ol li::before{content:counter(n); position:absolute; inset-inline-start:0; top:.15em; width:22px; height:22px; border-radius:8px; background:var(--pri-soft); color:var(--pri); font-size:12px; font-weight:700; display:grid; place-items:center}
.content strong{color:var(--pri)}
.note{
  background:linear-gradient(140deg, var(--warn-soft), transparent 70%), var(--card2);
  border:1px dashed color-mix(in srgb, var(--warn) 55%, transparent); border-radius:var(--r2); padding:14px 16px; margin:1em 0;
}
.note .note-t{font-weight:700; color:var(--warn); display:flex; gap:8px; align-items:center; margin-bottom:4px}
.quote{border-inline-start:5px solid var(--pri2); background:var(--pri-soft); border-radius:var(--r2); padding:14px 16px; margin:1em 0; font-style:normal}
.bi{display:block}
.bi .ar{display:block}
.bi .en{display:block; margin-top:.45em; padding-top:.45em; border-top:1px dashed var(--line); color:var(--muted); font-size:.93em; direction:ltr; text-align:left}
html[dir=rtl] .bi .en{text-align:left}
html[dir=ltr] .bi .en{border-top:none; margin-top:.15em; padding-top:0; color:inherit; font-size:1em}
.only-en{direction:ltr; text-align:left}
.mark-hit{background:color-mix(in srgb, var(--warn) 45%, transparent); border-radius:6px; padding:0 3px}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 20px; border-radius:16px;
  background:linear-gradient(140deg,var(--pri),var(--pri2)); color:#fff; font-weight:600; font-size:14.5px;
  box-shadow:var(--sh2); transition:.18s;
}
.btn:hover{transform:translateY(-1px)}
.btn:disabled{opacity:.5; cursor:not-allowed; transform:none}
.btn.ghost{background:var(--card); color:var(--text); box-shadow:var(--sh2)}
.btn.ok{background:linear-gradient(140deg,var(--ok),#3ddcae)}
.btn.dang{background:linear-gradient(140deg,var(--bad),#ff8f78)}
.btn.soft{background:var(--pri-soft); color:var(--pri); box-shadow:none}
.btn.wide{width:100%}
.btnrow{display:flex; gap:10px; flex-wrap:wrap; margin-top:12px}
.seg{display:inline-flex; background:var(--card2); border-radius:14px; padding:4px; gap:4px; flex-wrap:wrap}
.seg button{padding:8px 14px; border-radius:11px; font-size:13px; color:var(--muted)}
.seg button.on{background:var(--card); color:var(--text); box-shadow:var(--sh2); font-weight:600}

/* ---------- Progress ---------- */
.bar{height:10px; border-radius:999px; background:var(--card2); overflow:hidden; box-shadow:inset 0 1px 3px rgba(0,0,0,.06)}
.bar i{display:block; height:100%; border-radius:999px; background:linear-gradient(90deg,var(--pri),var(--ok)); transition:width .5s}
.pbar-row{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--muted)}
.pbar-row .bar{flex:1}

/* ---------- Flashcards ---------- */
.fc-stage{max-width:640px; margin:0 auto}
.fc{perspective:1400px; min-height:300px; cursor:pointer}
.fc-in{position:relative; width:100%; min-height:300px; transition:transform .55s cubic-bezier(.4,.1,.2,1); transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
html[dir=rtl] .fc.flip .fc-in{transform:rotateY(-180deg)}
.fc-face{
  position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  border-radius:var(--r); background:var(--card); box-shadow:var(--sh); padding:26px;
  display:flex; flex-direction:column; justify-content:center; gap:10px; text-align:center; overflow:auto;
}
.fc-face .lbl{font-size:12px; color:var(--pri); font-weight:700; letter-spacing:.4px}
.fc-face .txt{font-size:clamp(16px,3vw,20px); font-weight:600; line-height:1.7}
.fc-back{transform:rotateY(180deg)}
html[dir=rtl] .fc-back{transform:rotateY(-180deg)}
.fc-face.sub .txt{font-weight:500; font-size:clamp(14px,2.5vw,17px)}
.rate{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:14px}
.rate button{padding:12px 6px; border-radius:14px; font-weight:700; font-size:13.5px; background:var(--card); box-shadow:var(--sh2); transition:.15s}
.rate button small{display:block; font-weight:400; font-size:10.5px; color:var(--muted)}
.rate button:active{transform:scale(.96)}
.rate .r1{color:var(--bad)} .rate .r2{color:var(--warn)} .rate .r3{color:var(--ok)} .rate .r4{color:var(--pri)}
.fc-meta{display:flex; justify-content:space-between; gap:10px; font-size:12.5px; color:var(--muted); margin-top:10px; flex-wrap:wrap}

/* ---------- Quiz ---------- */
.qcard{max-width:760px; margin:0 auto}
.qprog{display:flex; gap:5px; margin-bottom:14px}
.qprog i{flex:1; height:7px; border-radius:99px; background:var(--card2)}
.qprog i.done{background:var(--ok)} .qprog i.wrongp{background:var(--bad)} .qprog i.cur{background:var(--pri)}
.qtext{font-size:clamp(16px,3vw,20px); font-weight:600; margin:.2em 0 .8em; line-height:1.75}
.opts{display:flex; flex-direction:column; gap:10px}
.opt{
  display:flex; gap:12px; align-items:flex-start; text-align:start; padding:13px 16px; border-radius:var(--r2);
  background:var(--card2); border:2px solid transparent; transition:.16s; font-size:15px; line-height:1.65; width:100%;
}
.opt .k{width:28px; height:28px; border-radius:10px; background:var(--card); display:grid; place-items:center; font-weight:700; font-size:13px; color:var(--pri); flex:none; box-shadow:var(--sh2)}
.opt:hover:not(.locked){border-color:var(--pri2); transform:translateY(-1px)}
.opt.good{border-color:var(--ok); background:var(--ok-soft)}
.opt.bad{border-color:var(--bad); background:var(--bad-soft)}
.opt.dim{opacity:.55}
.fb{margin-top:14px; border-radius:var(--r2); padding:14px 16px; display:none}
.fb.show{display:block; animation:pop .25s ease}
.fb.good{background:var(--ok-soft); border:1px solid color-mix(in srgb,var(--ok) 40%, transparent)}
.fb.bad{background:var(--bad-soft); border:1px solid color-mix(in srgb,var(--bad) 40%, transparent)}
.fb .h{font-weight:700; display:flex; gap:8px; align-items:center; margin-bottom:6px}
.fb.good .h{color:var(--ok)} .fb.bad .h{color:var(--bad)}
.qmeta{display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:12.5px; color:var(--muted); flex-wrap:wrap}
.savebtn{display:inline-flex; gap:6px; align-items:center; padding:7px 12px; border-radius:12px; background:var(--card2); font-size:12.5px; color:var(--muted)}
.savebtn.on{color:var(--warn); background:var(--warn-soft)}

/* ---------- Stats ---------- */
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
.tile{background:var(--card); border-radius:var(--r2); box-shadow:var(--sh2); padding:16px}
.tile .n{font-size:clamp(20px,4vw,28px); font-weight:800; background:linear-gradient(120deg,var(--pri),var(--ok)); -webkit-background-clip:text; background-clip:text; color:transparent; line-height:1.2}
.tile .l{font-size:12px; color:var(--muted); display:flex; gap:6px; align-items:center}
.ubar{margin:8px 0}
.ubar .t{display:flex; justify-content:space-between; font-size:12.5px; color:var(--muted); margin-bottom:4px; gap:8px}
.mlist{display:flex; flex-direction:column; gap:10px}
.mitem{background:var(--card2); border-radius:var(--r3); padding:12px 14px; font-size:14px}
.mitem small{color:var(--muted); display:block; font-size:12px; margin-top:4px}

/* ---------- Search ---------- */
.searchbox{display:flex; gap:10px; align-items:center; background:var(--card); border-radius:18px; box-shadow:var(--sh2); padding:6px 6px 6px 16px}
html[dir=rtl] .searchbox{padding:6px 16px 6px 6px}
.searchbox input{flex:1; border:none; outline:none; background:transparent; padding:12px 4px; font-size:15px}
.searchbox .btn{padding:10px 16px}
.res{display:flex; flex-direction:column; gap:10px}
.ritem{background:var(--card); border-radius:var(--r2); box-shadow:var(--sh2); padding:14px 16px; cursor:pointer; transition:.16s; border:1.5px solid transparent}
.ritem:hover{transform:translateY(-2px); border-color:var(--pri2)}
.ritem .tag{font-size:11px; color:var(--pri); font-weight:700; display:flex; gap:6px; align-items:center; margin-bottom:4px}
.ritem .tt{font-weight:600; font-size:14.5px}
.ritem .sn{font-size:13px; color:var(--muted); margin-top:4px; line-height:1.65}

/* ---------- Toast / modal ---------- */
#toast{
  position:fixed; bottom:18px; inset-inline-start:50%; transform:translateX(50%) translateY(80px);
  background:var(--text); color:var(--bg); padding:11px 20px; border-radius:14px; font-size:13.5px;
  box-shadow:var(--sh); opacity:0; transition:.3s; z-index:90; pointer-events:none; max-width:90vw;
}
html[dir=ltr] #toast{transform:translateX(-50%) translateY(80px)}
#toast.show{opacity:1; transform:translateX(50%) translateY(0)}
html[dir=ltr] #toast.show{transform:translateX(-50%) translateY(0)}
.modal{position:fixed; inset:0; background:rgba(10,14,28,.5); backdrop-filter:blur(4px); display:none; place-items:center; z-index:80; padding:18px}
.modal.show{display:grid}
.modal .box{background:var(--card); border-radius:var(--r); box-shadow:var(--sh); max-width:560px; width:100%; padding:22px; max-height:85vh; overflow:auto}
.empty{text-align:center; color:var(--muted); padding:34px 10px}
.empty .icon{width:44px; height:44px; opacity:.5; margin-bottom:8px}
.center{text-align:center}
.mt{margin-top:14px} .mt2{margin-top:22px}
.small{font-size:12.5px; color:var(--muted)}
.kbd{background:var(--card2); border-radius:6px; padding:1px 7px; font-size:11.5px; box-shadow:var(--sh2)}
footer.app{margin-top:40px; text-align:center; color:var(--muted); font-size:12.5px; line-height:2}
@media(max-width:520px){
  .rate{grid-template-columns:repeat(2,1fr)}
  .tab{min-width:104px; padding:9px 12px}
  .brand h1{white-space:normal}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <div class="logo"><i class="icon" data-icon="brain"></i></div>
      <div style="min-width:0">
        <h1 data-k="appName">سيكولوجيا الاشتراكية</h1>
        <div class="by"><i class="icon" data-icon="feather"></i><span>إعداد وتصميم: رشيد ابعوض</span></div>
      </div>
    </div>
    <div class="top-tools">
      <div class="lang-pill" role="group" aria-label="Language">
        <button data-lang="bi" class="on">English / العربية</button>
        <button data-lang="en">English</button>
        <button data-lang="ar">العربية</button>
      </div>
      <button class="tbtn" id="themeBtn" title="Theme"><i class="icon" data-icon="moon"></i></button>
      <button class="tbtn" id="helpBtn" title="Guide"><i class="icon" data-icon="circle-info"></i></button>
    </div>
  </div>
</header>

<div class="wrap">
  <nav class="tabs" id="tabs">
    <button class="tab on" data-tab="learn"><i class="icon" data-icon="graduation-cap"></i><span><b data-k="tabs.learn">التعلّم</b><small data-k="tabsSub.learn">المحتوى الكامل</small></span></button>
    <button class="tab" data-tab="cards"><i class="icon" data-icon="layer-group"></i><span><b data-k="tabs.cards">البطاقات</b><small data-k="tabsSub.cards">استرجاع نشط</small></span></button>
    <button class="tab" data-tab="quiz"><i class="icon" data-icon="circle-question"></i><span><b data-k="tabs.quiz">الاختبار</b><small data-k="tabsSub.quiz">اختيار من متعدد</small></span></button>
    <button class="tab" data-tab="review"><i class="icon" data-icon="arrows-rotate"></i><span><b data-k="tabs.review">مراجعة ذكية</b><small data-k="tabsSub.review">مدعومة بالأخطاء</small></span></button>
    <button class="tab" data-tab="stats"><i class="icon" data-icon="chart-pie"></i><span><b data-k="tabs.stats">الإحصائيات</b><small data-k="tabsSub.stats">تقدّمك</small></span></button>
    <button class="tab" data-tab="search"><i class="icon" data-icon="magnifying-glass"></i><span><b data-k="tabs.search">البحث</b><small data-k="tabsSub.search">في كل شيء</small></span></button>
  </nav>

  <!-- LEARN -->
  <section class="panel on" id="p-learn">
    <div class="chips" id="unitChips"></div>
    <div class="grid2">
      <aside class="side">
        <div class="card" style="padding:12px">
          <div class="small" style="padding:4px 8px 8px; display:flex; justify-content:space-between">
            <span data-k="units">الوحدات</span><span id="readCount" class="small"></span>
          </div>
          <div class="unitlist" id="unitlist"></div>
        </div>
      </aside>
      <div class="content">
        <div class="card" id="learnContent"></div>
        <div class="btnrow" id="learnNav"></div>
      </div>
    </div>
  </section>

  <!-- FLASHCARDS -->
  <section class="panel" id="p-cards"><div id="cardsArea"></div></section>

  <!-- QUIZ -->
  <section class="panel" id="p-quiz"><div id="quizArea"></div></section>

  <!-- SMART REVIEW -->
  <section class="panel" id="p-review"><div id="reviewArea"></div></section>

  <!-- STATS -->
  <section class="panel" id="p-stats"><div id="statsArea"></div></section>

  <!-- SEARCH -->
  <section class="panel" id="p-search">
    <div class="card">

    { t:"p", ar:"يضعُنا غوستاف لوبون (Gustave Le Bon) أمام تشريحٍ سيكولوجيٍّ فذٍّ لمَكمنِ القوةِ في المذهبِ الاشتراكي؛ فهو لا يراهُ نظريةً اقتصاديةً قابلةً للنقاشِ والقياس، بل يراهُ **\"عقيدةً دينيةً مستحدثة\"** نَبتتْ في رَحِمِ \"المنطقِ العاطفي\". إنَّ فَهْمَ هذا التحولِ من \"العقلِ\" إلى \"الإيمان\" هو الذي يُفسرُ لنا لـماذا تَبدو جَميعُ براهينِ علماءِ الاقتصادِ صَيحةً في وادٍ أمامَ جَسارةِ المؤمنين بالاشتراكية.",
      en:"Gustave Le Bon places us before an outstanding psychological anatomy of the source of strength within the socialist doctrine; for he does not see it as an economic theory open to discussion and measurement, but as a **\"new religious doctrine\"** born in the womb of **\"emotional logic\"**. It is the understanding of this shift from \"reason\" to \"faith\" that explains to us why all the proofs of the economists seem correct yet fall in a valley before the audacity of the believers in socialism." },

{

    { t:"p", ar:"يَذهبُ لوبون إلى أنَّ سِرَّ القوةِ \"الـمُرهبة\" للاشتراكيةِ يكمنُ في ابتعادِها عن حَيّزِ الواقعِ والتحاقِها بـحَيّزِ **\"الأحلامِ والتوكيدات\"**. فبمجردِ أن يَعبرَ المعتقدُ عَتَبَةَ العاطفة، فإنه يَبني حِصناً مـنيعاً لا تَطالُه مـعاولُ المَنطقِ أو أدلةُ الإثبات.",
      en:"Le Bon holds that the secret of the formidable strength of socialism lies in its departure from the sphere of reality and its entry into the sphere of **\"dreams and affirmations\"**. Once a belief crosses the threshold of emotion, it builds an impregnable fortress that neither the battering rams of logic nor the evidence of proof can reach." },

        en:"**The instinct of submission:** Le Bon argues that man does not incline toward \"freedom of thought\" as is commonly claimed, but rather toward **\"servitude of thought\"** — that is, seeking a mechanical certainty to direct his life and relieve him of the \"toil of thinking\"." },
      { ar:"**خَيبةُ الأملِ في العِلم:** بَيْنَما استطاعَ العِلمُ هَدْمَ الآلهةِ القديمة، فإنه عَجِزَ عن مَنحِ \"الأمل\" الذي تَتوقُ إليه الـنُّفوس. وهنا قَفزتِ الاشتراكيةُ لِتملأَ هذا الفراغَ الروحي، واعدةً بـ \"فردوسٍ أرضي\" يحلُّ مَحلَّ \"الفردوسِ السماوي\".",
        en:"**Disillusionment with science:** While science managed to destroy the old gods, it failed to bestow the \"hope\" that souls long for. Socialism then leapt in to fill this spiritual void, promising an \"earthly paradise\" to take the place of the \"heavenly paradise\"." },

      { ar:"**المـَناعةُ ضدَّ البرهان:** بما أنَّ الاشتراكيةَ عقيدة، فإنَّ انتشارَها لا يَرتبطُ بـمِقدارِ ما فيها من صِدقٍ أو خَطأ؛ فالجماهيرُ لا تَنفعلُ بـ \"الأدلةِ الدامغة\" بل بـ **\"العدوى النفسية\"**.",
        en:"**Immunity against proof:** Since socialism is a doctrine, its spread is not tied to how much truth or error it contains; the masses are not moved by \"conclusive evidence\" but by **\"psychological contagion\"**." },

      en:"This description hits the liver of truth; for Le Bon sees socialism, in its essence, as **\"the religion of the stomach\"** because it promises to satisfy the material cravings of the masses. And since it addresses \"desire\" and \"class hatred\" — primitive emotions — the economists' proofs about the \"laws of the market\" or the \"scarcity of resources\" appear cold and meaningless in the eyes of those who charge after the mirage." },

  blocks:[
    { t:"p", ar:"يضعنا غوستاف لوبون (Gustave Le Bon) هنا أمام مِقصلةٍ نقدية لا ترحم، حيث يُجرد الاشتراكية من ثوبها الاقتصادي لِيُلبسها ثوبها الحقيقي في نظره: **\"الحالة النفسية\"** أو **\"المعتقد الديني\"**. إنَّ هذا التقسيم الفذ لمريدي الاشتراكية يكشف لنا لـماذا لا يرى لوبون في هذا المذهب صراعاً حول \"وسائل الإنتاج\"، بل يراه صراعاً حول \"الأوهام والغرائز\".",
      en:"Gustave Le Bon here places us before a pitiless critical guillotine, stripping socialism of its economic garment to clothe it in what he sees as its true garment: the **\"psychological state\"** or the **\"religious belief\"**. This outstanding classification of socialism's followers reveals why Le Bon does not see in this doctrine a struggle over the \"means of production\" but a struggle over \"illusions and instincts\"." },
    { t:"p", ar:"وإليك تشريح هذا المشهد بلسانٍ عربيٍّ رصين، يتقصى أغوار النفس البشرية كما رآها \"ماكيافيلي الجماهير\":",
      en:"Here is the anatomy of this scene in a sedate Arabic tongue, probing the depths of the human soul as the \"Machiavelli of the crowds\" saw it:" },
    { t:"p", ar:"إنَّ عبقرية لوبون تكمن في إدراكِهِ أنَّ الاشتراكية لا تَزدهرُ بفضلِ صِحّةِ نظرياتها، بل بفضلِ **\"البنية النفسية\"** لـمن يعتنقونها؛ فهي مَلجأٌ لكل مَن عجزَ عن مـواجهةِ قسوةِ النواميسِ الطبيعيةِ والاقتصادية.",
      en:"Le Bon's genius lies in his perception that socialism does not flourish thanks to the validity of its theories but thanks to the **\"psychological structure\"** of those who embrace it; it is a refuge for all who could not face the harshness of natural and economic laws." },
    { t:"h2", ar:"1. \"جيشُ الساخطين\": الرواسبُ الاجتماعيةُ والنزعةُ التدميرية",
      en:"1. \"The Army of the Discontented\": Social Sediments and the Destructive Trend" },
    { t:"p", ar:"يرى لوبون أنَّ \"غير المتكيفين\" (The Unadapted) هم الوقودُ الحقيقيُّ لأيِّ اضطراب. هؤلاء هم مَن عَجزوا عن مواجهةِ متطلباتِ المدنيةِ الحديثة، فتحوّلوا إلى \"حطامٍ اجتماعي\":",
      en:"Le Bon holds that \"the unadapted\" are the real fuel of any disturbance. They are those who failed to meet the demands of modern civilisation and turned into \"social wreckage\":" },
    { t:"ul", items:[
      { ar:"**الحقدُ الأتـافي (Atavistic Hatred):** لا يَنقمُ هؤلاء على الفقرِ بحدِّ ذاته، بل على \"التفوق\"؛ فدوافعهم هي الغيرةُ من كلِّ جلالٍ أو ثروةٍ لا يملكون مَواهبَ نَيلِها.",
        en:"**Atavistic hatred:** These people bear a grudge not against poverty as such but against \"superiority\"; their motives are envy of every brilliance or wealth whose gifts they do not possess." },
      { ar:"**الأملُ السحري:** يَنظرون للاشتراكية بوصفها \"فانوساً سحرياً\" سَيُعيدُ توزيعَ الأرزاقِ دونَ أن يَضطروا لِبذلِ أدنى جُهدٍ شخصي.",
        en:"**Magical hope:** They view socialism as a \"magic lantern\" that will redistribute fortunes without their having to expend the slightest personal effort." }
    ]},
    { t:"h2", ar:"2. \"أنصافُ المتعلمين\": خطرُ الغرورِ الـمعرفي",

    { t:"p", ar:"يمثل هؤلاء (Demi-savants) في نظر لوبون الفئةَ الأكثرَ خطورة؛ فهم يملكون \"ثقافةً مـكتبية\" واسعة ولكنهم يفتقرون لـ \"الحكمةِ العملية\".",
      en:"These (demi-savants) represent, in Le Bon's eyes, the most dangerous class; they possess wide \"bookish culture\" but lack \"practical wisdom\"." },
    { t:"ul", items:[
      { ar:"**المحركون (Meneurs):** هؤلاء هم \"رُسلُ الدمار\"؛ إذ يكرهون الـمجتمع الذي لم يَعتبرهم عباقرةً فوق العادة. إنَّ حُلمهم الأسمى هو \"هدمُ الـمعبد\" لِيتربعوا هم على عرشهِ بوصفهم الفلاسفة-الملوك الجدد.",
        en:"**The drivers (meneurs):** They are the \"apostles of destruction\"; they hate the society that did not deem them geniuses above the ordinary. Their supreme dream is to \"destroy the temple\" so that they themselves may sit on its throne as the new philosopher-kings." },

    { t:"p", ar:"لعلَّ أكثرَ ملاحظات لوبون إثارةً للدهشة هي أنَّ الاشتراكية تَجدُ مـريدين مخلصين في صفوفِ \"الطبقاتِ الـموجهة\" (البرجوازية والأثرياء).",
      en:"Perhaps Le Bon's most astonishing observation is that socialism finds devoted followers among the \"leading classes\" (the bourgeoisie and the wealthy)." },
    { t:"ul", items:[

        en:"**The autumn of the will:** They suffer from what Le Bon calls \"sick indifference\" (Je m'enfichisme), having lost the will needed to defend their position and their rights." },
      { ar:"**التنازلاتُ الجبانة:** يهرعون لتقديم التنازلات تحت وطأة \"طيفِ الخوف\"؛ بَيْدَ أنَّ كلَّ تنازلٍ يُقدمونه لا يُرضي الخصم، بل يَزيدُ من جَسارته، في عمليةِ \"انتحارٍ طبقي\" بَطيء.",
        en:"**Cowardly concessions:** They rush to offer concessions under the pressure of \"the spectre of fear\"; yet every concession they make does not satisfy the adversary but increases his boldness, in a process of slow \"class suicide\"." }
    ]},
    { t:"h2", ar:"الاشتراكية بوصفها \"حالةً مَرضية\" لا نظريةً عِلمية",
      en:"Socialism as a \"Pathological State\", Not a Scientific Theory" },
    { t:"p", ar:"تُوضحُ لنا هذه الدوافع لـماذا يَعتبرُ لوبون الاشتراكية **\"حالةً ذهنية\"**:",
      en:"These motives show us why Le Bon considers socialism a **\"mental state\"**:" },
    { t:"ol", items:[
      { ar:"**المناعةُ ضدَّ العقل:** بما أنها مَبنيةٌ على \"الحقد\" (عند الفقير) و\"الخوف\" (عند الغني) و\"الغرور\" (عند الـمثقف)، فإنَّ براهينَ الاقتصاديين تظلُّ عاجزةً عن اختراقِ هذه الحصونِ العاطفية.",
        en:"**Immunity against reason:** Since it is built on \"hatred\" (in the poor), \"fear\" (in the rich) and \"pride\" (in the intellectual), the economists' proofs remain powerless to breach these emotional fortresses." },
      { ar:"**بِديلُ الدين:** إنها تُشبعُ \"الغريزة الدينية\" لدى الجماهير؛ فالدولةُ تُصبح هي \"الإله\" الذي سيجلبُ الفردوسَ للأرض.",
        en:"**A substitute for religion:** It satisfies the \"religious instinct\" among the masses; the state becomes the \"god\" who will bring paradise down to earth." },
      { ar:"**انتصارُ الغريزة:** تُمثلُ الاشتراكيةُ \"ردةً بربرية\" تُعلي من شأنِ الغريزةِ الجماعيه على حسابِ العقلِ الفردي.",
        en:"**The triumph of instinct:** Socialism represents a \"barbaric regression\" that exalts the collective instinct at the expense of individual reason." }
    ]},
    { t:"note", ar:"إضاءةٌ من مِخبرةِ المترجم: \"يُمكننا القولُ إنَّ غوستاف لوبون قد نَـزعَ 'القُدسيةَ' عن الثوراتِ الاجتماعية؛ فما يَبدو في الظاهرِ كـمَطالبَ بالعدالة، هو في بـاطنهِ -حسبَ تشريحه- صِراعٌ بـين 'عُقدِ النقصِ' لدى المهمشين و'ضعفِ الإرادة' لدى السادة. إنَّ 'الحالة الذهنية' للاشتراكية عنده هي حالةُ أمةٍ فقدتْ 'رُوحَها القومية' وبدأتْ بالتحلل.\"",
      en:"Illumination from the translator's laboratory: \"One may say that Gustave Le Bon stripped 'sanctity' from social revolutions; what appears outwardly as demands for justice is inwardly — by his anatomy — a struggle between the 'inferiority complex' of the marginalised and the 'weakness of will' of the masters. The 'mental state' of socialism, for him, is the condition of a nation that has lost its 'national spirit' and begun to disintegrate.\"" }
  ]
