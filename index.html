/* ================= SMART REVIEW ================= */
var RV=null;
function buildReview(){
  var now=Date.now(),items=[];
  var qs=QUIZ.filter(function(q){var s=S.qs[q.id];return s&&s.att>0&&s.due<=now;});
  qs.sort(function(a,b){var x=S.qs[a.id],y=S.qs[b.id];
    if((x.ok===0)!==(y.ok===0))return x.ok===0?-1:1;
    if(x.badS!==y.badS)return y.badS-x.badS;
    return (x.att-x.ok)-(y.att-y.ok);});
  qs.slice(0,6).forEach(function(q){items.push({t:"q",id:q.id,why:qState(q.id).ok===0?"err":"due"});});
  var cs=dueCards().slice(0,6);
  cs.forEach(function(c){items.push({t:"c",id:c.id,why:cardState(c.id).lapses>0?"err":"due"});});
  items.sort(function(a,b){return (a.why==="err"?0:1)-(b.why==="err"?0:1);});
  return items.slice(0,12);
}
function startReview(){var it=buildReview();if(!it.length){RV={items:[]};renderReview(true);return;}RV={items:it,i:0,flipped:false,picked:null,locked:false};renderReview();}
function renderReview(done){
  var area=$("#reviewArea");
  if(done||!RV){
    var dueNow=buildReview().length;
    area.innerHTML='<div class="card"><h2>'+T("smartTitle")+"</h2><p class='hint'>"+pick({ar:"يجمع المراجعة الذكية بين أخطائك ثم أضعف وحداتك ثم ما حان موعده، مع تجنّب تكرار ما أتقنته وحفظتَ إجابته.",en:"Smart review combines your mistakes first, then your weakest topics, then what is due — avoiding what you have mastered and saved."})+"</p>"+
      '<div class="tiles mt"><div class="tile"><div class="n">'+dueNow+'</div><div class="l"><i class="icon" data-icon="clock"></i>'+T("dueNow")+"</div></div>"+
      '<div class="tile"><div class="n">'+S.st.revTotal+'</div><div class="l"><i class="icon" data-icon="arrows-rotate"></i>'+T("reviewsTotal")+"</div></div>"+
      '<div class="tile"><div class="n">'+(S.st.streak||0)+'</div><div class="l"><i class="icon" data-icon="fire"></i>'+T("dayStreak")+"</div></div></div>"+
      '<div class="btnrow"><button class="btn" id="rvStart"><i class="icon" data-icon="play"></i>'+T("startSmart")+"</button></div></div>";
    if(done&&RV&&!RV.items.length)area.innerHTML='<div class="card center"><div class="empty"><i class="icon" data-icon="medal"></i></div><h2>'+T("mixDone")+"</h2></div>"+area.innerHTML;
    $("#rvStart").addEventListener("click",startReview);iconify();return;
  }
  var it=RV.items[RV.i];
  if(!it){renderReview(true);RV=null;return;}
  var why=it.why==="err"?pick({ar:'<i class="icon" data-icon="triangle-exclamation"></i> لأنك أخطأت فيه سابقاً',en:'<i class="icon" data-icon="triangle-exclamation"></i> You answered this wrongly before'}):pick({ar:'<i class="icon" data-icon="clock"></i> حان موعده',en:'<i class="icon" data-icon="clock"></i> It is due'});
  var head='<div class="qprog">'+RV.items.map(function(_,k){return '<i class="'+(k<RV.i?"done":(k===RV.i?"cur":""))+'"></i>';}).join("")+"</div>"+
    '<div class="qmeta"><span class="small">'+why+"</span><span class='small'>"+(RV.i+1)+" / "+RV.items.length+"</span></div>";
  if(it.t==="c"){
    var c=getCard(it.id);
    var st=cardState(it.id);
    area.innerHTML='<div class="card qcard">'+head+'<div class="fc-stage"><div class="fc'+(RV.flipped?" flip":"")+'" id="rvFc" style="min-height:230px"><div class="fc-in" style="min-height:230px">'+
      '<div class="fc-face" style="min-height:230px"><div class="lbl">'+T("tapFlip")+'</div><div class="txt">'+pick(c.f)+"</div></div>"+
      '<div class="fc-face fc-back sub" style="min-height:230px"><div class="lbl">'+T("explanation")+'</div><div class="txt">'+pick(c.b)+"</div></div></div></div>"+
      '<div class="rate" id="rvRate" style="'+(RV.flipped?"":"opacity:.45;pointer-events:none")+'">'+
      '<button class="r1" data-rate="again">'+T("again")+"</button><button class='r2' data-rate='hard'>"+T("hard")+"</button>"+
      "<button class='r3' data-rate='good'>"+T("good")+"</button><button class='r4' data-rate='easy'>"+T("easy")+"</button></div>"+
      '<div class="fc-meta"><span>'+T("mastery")+" "+st.mastery+'%</span><span>'+T("nextReview")+" "+fmtDue(st.due)+"</span></div></div></div>";
    $("#rvFc").addEventListener("click",function(){RV.flipped=!RV.flipped;renderReview();});
    $("#rvRate").addEventListener("click",function(e){var b=e.target.closest("[data-rate]");if(!b)return;rateCard(it.id,b.getAttribute("data-rate"));RV.i++;RV.flipped=false;renderReview();});
  }else{
    var q=getQ(it.id);
    var locked=RV.locked,picked=RV.picked,book=(S.qs[q.id]||{}).book;
    area.innerHTML='<div class="card qcard">'+head+
      '<div class="qmeta"><span><i class="icon" data-icon="'+getUnit(q.u).icon+'"></i> '+esc(pickFlat(getUnit(q.u).t))+'</span><button class="savebtn '+(book?"on":"")+'" id="rvSave"><i class="icon" data-icon="bookmark"></i>'+(book?T("savedQ"):T("saveQ"))+"</button></div>"+
      '<div class="qtext">'+pick(q.q)+"</div>"+
      '<div class="opts" id="rvOpts">'+q.o.map(function(o,i){var cls="opt";if(locked){if(i===q.a)cls+=" good";else if(i===picked)cls+=" bad";else cls+=" dim";}
        return '<button class="'+cls+'" data-i="'+i+'"><span class="k">'+qLetter(i)+"</span><span>"+pick(o)+"</span></button>";}).join("")+"</div>"+
      '<div class="fb '+(locked?("show "+(picked===q.a?"good":"bad")):"")+'">'+(locked?'<div class="h"><i class="icon" data-icon="'+(picked===q.a?"circle-check":"circle-xmark")+'"></i>'+(picked===q.a?T("correct"):T("wrong"))+"</div><div>"+pick(q.e)+"</div>":"")+"</div>"+
      '<div class="btnrow"><button class="btn" id="rvNext" style="margin-inline-start:auto">'+T("next")+' <i class="icon" data-icon="arrow-left"></i></button></div></div>';
    $("#rvOpts").addEventListener("click",function(e){
      var b=e.target.closest("[data-i]");if(!b||RV.locked)return;
      var i=parseInt(b.getAttribute("data-i"),10);RV.locked=true;RV.picked=i;answerQ(q.id,i===q.a);renderReview();
    });
    $("#rvNext").addEventListener("click",function(){RV.i++;RV.locked=false;RV.picked=null;renderReview();});
    $("#rvSave").addEventListener("click",function(){var s=qState(q.id);s.book=s.book?0:1;save();renderReview();toast(s.book?T("savedQ"):T("unsaved"));});
  }
  iconify();
}
function fmtDue(ts){if(!ts)return"—";var d=ts-Date.now();if(d<=0)return T("dueNow");var n=Math.round(d/DAY);return (n<1?T("min"):n+"d");}
document.addEventListener("keydown",function(e){
  if(S.tab!=="review"||!RV||!RV.items[RV.i])return;
  var it=RV.items[RV.i];
  if(it.t==="c"&&e.code==="Space"){e.preventDefault();RV.flipped=!RV.flipped;renderReview();}
  if(it.t==="c"&&RV.flipped&&["1","2","3","4"].indexOf(e.key)>=0){var m={"1":"again","2":"hard","3":"good","4":"easy"};rateCard(it.id,m[e.key]);RV.i++;RV.flipped=false;renderReview();}
  if(it.t==="q"&&["1","2","3","4"].indexOf(e.key)>=0&&!RV.locked){var b=$('#rvOpts [data-i="'+(parseInt(e.key,10)-1)+'"]');if(b)b.click();}
  if(e.key==="Enter"){var n=$("#rvNext");if(n)n.click();}
});

/* ================= STATS ================= */
function overallMastery(){
  var readN=Object.keys(S.units).length,readPct=Math.round(100*readN/CONTENT.length);
  var cardAvg=Math.round(CARDS.reduce(function(a,c){return a+cardState(c.id).mastery;},0)/CARDS.length);
  var quizPct=S.st.quizAtt?Math.round(100*S.st.quizOk/S.st.quizAtt):null;
  var parts=[readPct,cardAvg],sum=2;
  if(quizPct!==null){parts.push(quizPct);sum++;}
  return {pct:Math.round(parts.reduce(function(a,b){return a+b;},0)/sum),readPct:readPct,cardAvg:cardAvg,quizPct:quizPct,readN:readN};
}
function renderStats(){
  var om=overallMastery(),cnt=cardCounts();
  var savedN=Object.keys(S.qs).filter(function(id){return S.qs[id].book;}).length;
  var wrongs=Object.keys(S.qs).filter(function(id){return S.qs[id].att>0&&S.qs[id].ok===0;}).map(getQ).filter(Boolean);
  var perUnit=CONTENT.map(function(u){
    var cs=CARDS.filter(function(c){return c.u===u.id;}),m=cs.length?Math.round(cs.reduce(function(a,c){return a+cardState(c.id).mastery;},0)/cs.length):0;
    var pct=Math.min(100,Math.round(m*0.7+(S.units[u.id]?30:0)));
    return '<div class="ubar"><div class="t"><span>'+esc(pickFlat(u.t))+"</span><span>"+pct+'%</span></div><div class="bar"><i style="width:'+pct+'%"></i></div></div>';
  }).join("");
  $("#statsArea").innerHTML='<div class="card"><h2>'+T("statsTitle")+"</h2>"+
    '<div class="tiles mt"><div class="tile"><div class="n">'+om.pct+'%</div><div class="l"><i class="icon" data-icon="gauge-high"></i>'+T("overall")+'</div></div>'+
    '<div class="tile"><div class="n">'+S.st.quizOk+"/"+S.st.quizAtt+'</div><div class="l"><i class="icon" data-icon="circle-question"></i>'+T("totalQuiz")+' · '+(om.quizPct===null?"—":om.quizPct+"%")+'</div></div>'+
    '<div class="tile"><div class="n">'+cnt.mastered+"/"+cnt.total+'</div><div class="l"><i class="icon" data-icon="layer-group"></i>'+T("totalCards")+'</div></div>'+
    '<div class="tile"><div class="n">'+om.readN+"/"+CONTENT.length+'</div><div class="l"><i class="icon" data-icon="graduation-cap"></i>'+T("readUnits")+'</div></div>'+
    '<div class="tile"><div class="n">'+(S.st.streak||0)+'</div><div class="l"><i class="icon" data-icon="fire"></i>'+T("dayStreak")+'</div></div>'+
    '<div class="tile"><div class="n">'+(S.st.revTotal||0)+'</div><div class="l"><i class="icon" data-icon="arrows-rotate"></i>'+T("reviewsTotal")+'</div></div></div></div>'+
    '<div class="card"><h2 style="font-size:17px">'+T("perUnit")+"</h2>"+perUnit+"</div>"+
    (wrongs.length?'<div class="card"><h2 style="font-size:17px">'+T("mistakes")+"</h2><div class='mlist mt'>"+
      wrongs.map(function(q){return '<div class="mitem"><strong>'+pick(q.q)+"</strong><small>✓ "+pickFlat(q.o[q.a])+"</small></div>";}).join("")+
      '</div><div class="btnrow"><button class="btn ok" id="fixWrong"><i class="icon" data-icon="bullseye"></i>'+T("quizWeak")+"</button></div></div>":
      '<div class="card center small"><i class="icon" data-icon="circle-check" style="width:30px;height:30px;color:var(--ok)"></i><div>'+T("noMistakes")+"</div></div>")+
    '<div class="card"><h2 style="font-size:17px"><i class="icon" data-icon="database"></i> '+T("saved")+' · '+T("savedCount")+": "+savedN+'</h2>'+
    '<div class="btnrow"><button class="btn ghost" id="expBtn"><i class="icon" data-icon="file-export"></i>'+T("export")+"</button>"+
    '<button class="btn ghost" id="impBtn"><i class="icon" data-icon="file-import"></i>'+T("import")+"</button>"+
    '<button class="btn dang" id="clrBtn"><i class="icon" data-icon="trash"></i>'+T("clearData")+"</button></div>"+
    '<p class="small mt">'+pick({ar:"يُحفظ التقدّم تلقائياً في هذا المتصفح بعد إغلاق الملف. صدّر نسخة احتياطية لتنقله بين الأجهزة.",en:"Progress is auto-saved in this browser after you close the file. Export a backup to move it between devices."})+"</p></div>";
  var fw=$("#fixWrong");if(fw)fw.addEventListener("click",function(){startQuiz(wrongs,"weak");});
  $("#expBtn").addEventListener("click",exportData);
  $("#impBtn").addEventListener("click",function(){$("#impFile").click();});
  $("#clrBtn").addEventListener("click",function(){
    openModal(T("clearData"),'<p>'+T("clearConfirm")+'</p><div class="btnrow"><button class="btn dang" id="clrYes">'+T("clearData")+'</button><button class="btn ghost" id="clrNo">'+T("close")+"</button></div>");
    $("#clrYes").addEventListener("click",function(){localStorage.removeItem(LS_KEY);location.reload();});
    $("#clrNo").addEventListener("click",closeModal);
  });
  iconify();
}
function exportData(){
  var blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="lebon-progress-"+today().replace(/-/g,"")+".json";a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},3000);toast(T("saved"));
}
$("#impFile").addEventListener("change",function(){
  var f=this.files[0];if(!f)return;var fr=new FileReader();
  fr.onload=function(){try{var j=JSON.parse(fr.result);if(!j||j.v!==1)throw 0;
    var b=blankState();for(var k in j)b[k]=j[k];b.st=Object.assign(blankState().st,j.st||{});S=b;saveNow();
    applyDir();applyTheme();setTab(S.tab||"learn");toast(T("importOk"));
  }catch(e){toast(T("importErr"));}};
  fr.readAsText(f);this.value="";
});

/* ================= SEARCH ================= */
function plain(o){return (o.ar+" "+o.en).toLowerCase();}
function doSearch(){
  var q=$("#searchInput").value.trim().toLowerCase();
  var box=$("#searchRes");
  if(q.length<2){box.innerHTML="";return;}
  var res=[];
  CONTENT.forEach(function(u,i){
    var texts=[];
    texts.push(plain(u.t));
    u.blocks.forEach(function(b){
      if(b.items)b.items.forEach(function(it){texts.push(plain(it));});
      else if(b.ar)texts.push(plain(b));
    });
    var joined=texts.join(" ~~~ ");
    if(joined.indexOf(q)>=0){
      var arr=u.blocks.filter(function(b){var s=b.items?plain(b.items[0]):plain(b);return s.indexOf(q)>=0;})[0];
      if(!arr)arr=u.t;
      var src=arr.items?arr.items[0]:arr;
      function cut(t){var p=t.toLowerCase().indexOf(q);return p>=0?t.slice(Math.max(0,p-60),p+130):t.slice(0,170);}
      res.push({w:0,tag:"unit",title:u.t,snip:{ar:cut(src.ar),en:cut(src.en)},unit:u.id});
    }
  });
  CARDS.forEach(function(c){
    if((plain(c.f)+" "+plain(c.b)).indexOf(q)>=0)
      res.push({w:1,tag:"card",title:c.f,snip:c.b,unit:c.u,id:c.id});
  });
  QUIZ.forEach(function(k){
    if((plain(k.q)+" "+plain(k.e)+" "+k.o.map(plain).join(" ")).indexOf(q)>=0)
      res.push({w:2,tag:"quiz",title:k.q,snip:k.o[k.a],unit:k.u,id:k.id});
  });
  res.sort(function(a,b){return a.w-b.w;});
  res=res.slice(0,30);
  if(!res.length){box.innerHTML='<div class="empty"><i class="icon" data-icon="magnifying-glass"></i><div>'+T("noResults")+"</div></div>";iconify();return;}
  box.innerHTML=res.map(function(r,i){
    var tagIcon=r.tag==="unit"?"book-open":(r.tag==="card"?"layer-group":"circle-question");
    var tagName=r.tag==="unit"?T("learn"):(r.tag==="card"?T("cards"):T("quiz"));
    return '<div class="ritem" data-res="'+i+'"><div class="tag"><i class="icon" data-icon="'+tagIcon+'"></i>'+tagName+
      " · "+T("inUnit")+" "+esc(pickFlat(getUnit(r.unit).t))+'</div><div class="tt">'+pick(r.title)+
      '</div><div class="sn">'+(S.lang==="en"?esc(r.snip.en):esc(r.snip.ar))+"</div></div>";
  }).join("");
  box.onclick=function(e){
    var it=e.target.closest("[data-res]");if(!it)return;
    var r=res[parseInt(it.getAttribute("data-res"),10)];
    if(r.tag==="unit"){S.unit=r.unit;save();setTab("learn");}
    else if(r.tag==="card"){CS={mode:"all",queue:[],browse:true,uFilter:r.unit};setTab("cards");}
    else{startQuiz([getQ(r.id)],"saved");}
  };
  iconify();
}
$("#searchInput").addEventListener("input",doSearch);
$("#searchBtn").addEventListener("click",doSearch);
$("#searchInput").addEventListener("keydown",function(e){if(e.key==="Enter")doSearch();});

});

applyDir();applyTheme();iconify();
setTab(S.tab||"learn");
