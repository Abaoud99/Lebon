    {ar:"مفكرين معتزلين للجماهير",en:"Intellectuals withdrawn from the masses"},
    {ar:"أفراد \"منوّمون مغناطيسياً\" بإيمانهم، يرون نقد مذهبهم تدنيساً للمقدسات",en:"Individuals \"magnetically mesmerised\" by their faith, who see critique of their doctrine as desecration of the sacred"}],
 e:{ar:"لا يُنشر المذهب عبْر المفكرين بل عبْر الرسل: أفراد منوّمون مغناطيسياً بإيمانهم، مستعدون لكل تضحية، وتجعلهم عقيدتهم ترى النقد تدنيساً للاهوت.",en:"The doctrine spreads not through intellectuals but through apostles: individuals magnetically mesmerised by their faith, ready for any sacrifice, viewing critique as a desecration of the sacred."}},
{id:"q11",u:"u2",a:1,
 q:{ar:"لماذا تتبسّط الصيغ الاشتراكية في نظر لوبون؟",en:"Why do socialist formulations become so simplified?"},
 o:[{ar:"لأن البساطة صفة من صفات الحقيقة",en:"Because simplicity is a mark of truth"},
    {ar:"لتُخاطب \"العقول العامة\" وتُقبل دون جهد ذهني",en:"To address \"common minds\" and be accepted without mental effort"},
    {ar:"لضعف قدرة المؤلفين على التأليف",en:"For the authors' weak writing skills"},
    {ar:"لأن الترجمات كانت ركيكة",en:"Because the translations were clumsy"}],
 e:{ar:"تبسيط المعقّد سببٌ من أسباب انتشار العقيدة: صيغ بالغة البساطة تخاطب العقول العامة فتقبل دون جهد ذهني، وتتجاوز نقاش التفاصيل.",en:"Simplifying the complex is a cause of the doctrine's spread: formulations of great simplicity address common minds, accepted without mental effort and beyond detailed debate."}},
{id:"q12",u:"u2",a:2,
 q:{ar:"بمَ تُخاطب الاشتراكية لتنال إيمان الجماهير حسب \"دين المعدة\"؟",en:"What does socialism address to win the masses' faith, as \"the religion of the stomach\"?"},
 o:[{ar:"بالبراهين الرياضية لقوانين السوق",en:"With mathematical proofs of the market's laws"},
    {ar:"بمطالب العلمانية والتعليم",en:"With demands for secularism and education"},
    {ar:"بـ\"الرغبة\" و\"الحقد الطبقي\" وهما عاطفتان بدائيتان",en:"With \"desire\" and \"class hatred\" — two primitive emotions"},
    {ar:"بوعود الحرية السياسية",en:"With promises of political freedom"}],
 e:{ar:"لأنها تعد بإشباع المطامع المادية؛ وتُخاطب الرغبة والحقد الطبقي، فتبدو براهين الاقتصاديين حول قوانين السوق وندرة الموارد باردةً لا معنى لها في نظر المندفعين.",en:"Because it promises to satisfy material cravings, addressing desire and class hatred; the economists' proofs about market laws and resource scarcity seem cold and meaningless to the zealots."}},
{id:"q13",u:"u2",a:0,
 q:{ar:"ما \"خُلاصة الموقف\" من مآل الاشتراكية عند لوبون؟",en:"What is Le Bon's summary of socialism's fate?"},
 o:[{ar:"قد تنتصر توقيتاً بتفانيٍ غير مشروط، وأفولُها حتميٌّ لتصطدم وعودُها بـ\"الحتمياتِ الاقتصادية\"",en:"It may win temporarily through unconditional sacrifice, but its decline is inevitable as its promises crash into \"economic necessities\""},
    {ar:"انتصارها حتمي لأن الغرائز أقوى من العقل",en:"Its victory is inevitable, instinct being stronger than reason"},
    {ar:"ستتحوّل إلى نظام مستقر يدوم قروناً",en:"It will stabilise into a system lasting centuries"},
    {ar:"ستتفكك بفعل نقد العلماء وحده",en:"It will dissolve through scholars' critique alone"}],
 e:{ar:"يرى لوبون أن تفانياً غير المشروط قد يمنحها انتصاراً توقيتاً، لكن وعودها ستصطدم بصخرة الحتميات الاقتصادية القاسية التي لا ترحم الأوهم؛ فأفولها حتمي.",en:"Le Bon holds that unconditional self-sacrifice may grant a temporary victory, but its promises will crash against the rock of harsh \"economic necessities\"; its decline is inevitable."}},
{id:"q14",u:"u2",a:3,
 q:{ar:"بمَ يشبّه المترجم مشكلة مواجهة الاشتراكية بالأرقام؟",en:"To what does the translator compare the problem of confronting socialism with numbers?"},
 o:[{ar:"بمحاولة إقناع جمهور بحقيقة مخالفة لشعبيته",en:"Convincing a crowd of a truth against its popular sentiment"},
    {ar:"بجدل فقهي في مسألة خلافية",en:"A juristic dispute over a contested point"},
    {ar:"بمحاولة هندسة نهر إلى مجرى جديد",en:"Engineering a river into a new course"},
    {ar:"بمحاولة إقناع عاشقٍ ولهان بأن محبوبته قبيحة عبر قياسات وجهها",en:"Convincing an infatuated lover that his beloved is ugly by displaying measurements of her face"}],
 e:{ar:"يضرب المترجم المثل بأن المنطق لا يملك سلطاناً على مملكة الخيال؛ فالعاشق الولهان لا يُقنعه استعراض قياسات، وكذا المؤمن بالاشتراكية لا تُقنعه الأرقام.",en:"The illustrator's point: logic holds no sovereignty over the kingdom of imagination; an infatuated lover is unmoved by measurements, as the believer is unmoved by numbers."}},
/* ---- u3 ---- */
{id:"q15",u:"u3",a:1,
 q:{ar:"ما \"الجوهر الباطن\" الذي يراه لوبون وراء النظم السياسية والاجتماعية؟",en:"What \"inward essence\" does Le Bon see behind political and social systems?"},
 o:[{ar:"البنية الاقتصادية للمجتمع",en:"The economic structure of society"},
    {ar:"\"روح العِرق\"",en:"The \"spirit of the race\""},
    {ar:"الدستور والقوانين",en:"Constitutions and laws"},
    {ar:"المؤسسات التربوية",en:"Educational institutions"}],
 e:{ar:"يرى لوبون في النظم - وعلى رأسها الاشتراكية - أعراضاً خارجية لجوهر باطن هو روح العرق؛ فكل نظام سياسي قراءة محلية لموروث نفسي عريق.",en:"Le Bon sees systems — socialism at their head — as outward symptoms of an inward essence: the spirit of the race; every political system is a local reading of a deep psychological inheritance."}},
{id:"q16",u:"u3",a:2,
 q:{ar:"ماذا تعني مقولة \"حُلمَ أمةٍ ما هو كابوسٌ لأمةٍ أخرى\"؟",en:"What does the maxim \"one nation's dream is another's nightmare\" mean?"},
 o:[{ar:"أن الحروب تنشأ من سوء التفاهم",en:"Wars arise from misunderstanding"},
    {ar:"أن كل الأمم تتمنى السلام",en:"All nations desire peace"},
    {ar:"أن كل شعب يقرأ \"الاشتراكية\" بمداد تاريخه الموروث وثوراته الخاصة",en:"Each people reads \"socialism\" with the ink of its inherited history and revolutions"},
    {ar:"أن الأحلام لا تصدق في السياسة",en:"Dreams are unreliable in politics"}],
 e:{ar:"الكلمات والشعارات أوعية فارغة يملؤها كل شعب بمحتوى سيكولوجي متفق مع موروثاته الأتافية؛ لذا اشتراكية الأنجلوسكسون نقيض اشتراكية اللاتين.",en:"Words and slogans are empty vessels each people fills with psychological content matching its atavistic inheritances; hence Anglo-Saxon socialism is the opposite of Latin socialism."}},
{id:"q17",u:"u3",a:0,
 q:{ar:"ما مصدر \"الانضباط\" الذي يفسّر اشتراكية الأنجلوسكسون؟",en:"What source of \"discipline\" explains Anglo-Saxon socialism?"},
 o:[{ar:"الانضباط الداخلي: اعتمادٌ ذاتي ومبادرة وضبطُ نفسٍ صقلهما تاريخٌ طويل",en:"Internal discipline: self-reliance, initiative and self-control polished by long history"},
    {ar:"الانضباط الخارجي: قرونٌ من المركزية المفرطة",en:"External discipline: centuries of excessive centralisation"},
    {ar:"الانضباط الديني: تقاليد كنسية صارمة",en:"Religious discipline: strict ecclesiastical traditions"},
    {ar:"الانضباط العسكري: تقاليد ثكنات",en:"Military discipline: barracks traditions"}],
 e:{ar:"يؤمن لوبون أن العقل الأنجلوسكسوني (إنجلترا وأمريكا) صقله تاريخ طويل من الاعتماد على الذات وروح المبادرة وضبط النفس؛ فالانضباط عندهم داخلي نابع من الداخل.",en:"Le Bon holds that the Anglo-Saxon mind was polished by a long history of self-reliance, initiative and self-control; their discipline is internal, issuing from within."}},
{id:"q18",u:"u3",a:3,
 q:{ar:"كيف ينظر الأنجلوسكسون إلى الدولة بحسب لوبون؟",en:"How do Anglo-Saxons view the state, according to Le Bon?"},
 o:[{ar:"بأنها الأم الحنون التي ترعى الرعايا",en:"As a nurturing mother caring for subjects"},
    {ar:"بأنها وسيلة تحقيق المساواة",en:"As a means to achieve equality"},
    {ar:"بأنها مصدر الشرف القومي",en:"As the source of national honour"},
    {ar:"بأنها \"شرٌّ لابد منه\" تُحدَّ مهامها إلى الحد الأدنى",en:"As \"an unavoidable evil\" whose functions must be reduced to the minimum"}],
 e:{ar:"يرون في الدولة شراً لابد منه؛ ولذلك حين يتبنون نظريات اشتراكية يحولونها إلى مسعى لتعزيز حرية المواطن عبر الجمعيات التطوعية والنقابات المستقلة (اشتراكية الأحرار).",en:"They see the state as an unavoidable evil; hence when they adopt socialist theories they turn them into a pursuit of citizen freedom through voluntary associations and independent unions (the socialism of free men)."}},
{id:"q19",u:"u3",a:1,
 q:{ar:"لماذا يأنف \"العامل الإنجليزي\" من فكرة \"الدولة المدبرة\"؟",en:"Why does the English worker recoil from the \"managing state\"?"},
 o:[{ar:"لأنها ترفع عنه مسؤولية العمل",en:"It lifts the burden of work off him"},
    {ar:"لأنها تطعمه وتكسوه مقابل مصادرة إرادته وهو فرداني الطبع",en:"It feeds and clothes him in exchange for confiscating his will, and he is individualistic by nature"},
    {ar:"لأنها تفرض عليه الضرائب",en:"It imposes taxes on him"},
    {ar:"لأنها تحرم النقابات",en:"It bans unions"}],
 e:{ar:"العامل الإنجليزي في نظر لوبون فرداني بطبعه؛ يرفض المقايضة التي تُعطيه الرعاية مقابل تسليم إرادته، ولذلك تزدهر عند الانجلوسكسون الجمعيات التطوعية المستقلة.",en:"For Le Bon the English worker is individualistic by nature, rejecting the trade of care for his will; hence voluntary independent associations flourish among Anglo-Saxons."}},
{id:"q20",u:"u3",a:2,
 q:{ar:"ما الذي يحمله قرون المركزية على الشعوب اللاتينية؟",en:"What burden do centuries of centralisation place on Latin peoples?"},
 o:[{ar:"الانضباط الداخلي",en:"Internal discipline"},
    {ar:"الاعتماد على الذات",en:"Self-reliance"},
    {ar:"الانضباط الخارجي: حاجةٌ مروعةٌ لأن يكونوا مُحكماً وضعفاً عن المبادرة",en:"External discipline: an alarming need to be governed and incapacity for initiative"},
    {ar:"الكره للسلطة",en:"Hatred of authority"}],
 e:{ar:"المراكمة والسلطة الأبوية جعلت النفس اللاتينية تفتقر إلى \"الوازع الداخلي\"؛ فيُفرض الانضباط بالسوط أو القانون من الأعلى، وتبرز \"حاجة مروعة لأن يكون مُحكماً\".",en:"Centralisation and paternalism left the Latin soul without the \"inner restraint\"; discipline is imposed by whip or law from above, and an alarming need to be governed emerges."}},
{id:"q21",u:"u3",a:0,
 q:{ar:"ما طبيعة الاشتراكية عند الشعوب اللاتينية في نظر لوبون؟",en:"What is the nature of socialism among Latin peoples for Le Bon?"},
 o:[{ar:"عقيدة ارتدادية تُحلِّل سلطة الدولة محل سلطة الملك",en:"A retrograde doctrine replacing the authority of the state in place of the king's"},
    {ar:"ثورة نحو مستقبل مشرق",en:"A revolution toward a bright future"},
    {ar:"حركة تطوعية مدنية",en:"A voluntary civil movement"},
    {ar:"مشروع علمي للإصلاح",en:"A scientific reform project"}],
 e:{ar:"الاشتراكية هنا ليست ثورة نحو المستقبل بل عقيدة ارتدادية: تقوم الدولة بكل شيء - تصنع وتدير وتوزع وتساوي بين الرؤوس - أي محو سلطة الملك باستبدالها بسلطة الدولة الشاملة.",en:"Here socialism is not a revolution toward the future but a retrograde doctrine: the state does everything — producing, managing, distributing, levelling heads equal — replacing royal authority with total state authority."}},
{id:"q22",u:"u3",a:3,
 q:{ar:"ما الذي جهّز العقل الألماني سيكولوجياً للاشتراكية؟",en:"What psychologically prepared the German mind for socialism?"},
 o:[{ar:"فلسفة كانط النقدية",en:"Kant's critical philosophy"},
    {ar:"النهضة الصناعية المبكرة",en:"Early industrial revolution"},
    {ar:"الفكر الاشتراكي المبكر في جامعات لايبزغ",en:"Early socialist thought in Leipzig universities"},
    {ar:"غلاف ماركس العلمي مع قرنٍ من الانضباط العسكري الصارم في \"الروح البروسية\"",en:"Marx's scientific cover combined with a century of strict military discipline in the \"Prussian spirit\""}],
 e:{ar:"يرى لوبون الحالة الألمانية هجينة: ماركس منحها غلافاً علمياً، والروح البروسية مهدت لها بانضباط عسكري صارم؛ فصار الامتثال لتراتبيات الدولة الصارمة سهلاً.",en:"Le Bon sees the German case as hybrid: Marx gave it a scientific cover while the Prussian spirit paved the way with strict military discipline, making submission to rigid state hierarchies easy."}},
{id:"q23",u:"u3",a:1,
 q:{ar:"لماذا يعدّ لوبون الهندسة الاجتماعية \"وهماً خطيراً\"؟",en:"Why does Le Bon call social engineering a \"dangerous illusion\"?"},
 o:[{ar:"لأنها تتطلب تكاليف ضخمة",en:"It demands huge costs"},
    {ar:"لأن المؤسسات نتاج \"روح العرق\"؛ ونقل نظام شعبٍ إلى آخر كزراعة عضوٍ غريب سيلفظه الجسد",en:"Institutions are the product of the \"spirit of the race\"; transplanting a system is grafting a foreign organ the body will reject"},
    {ar:"لأنها تهدم التقاليد فجأة",en:"It destroys traditions abruptly"},
    {ar:"لأنها تفشل في أوروبا فقط",en:"It fails only in Europe"}],
 e:{ar:"المؤسسات لا تُصنع في المختبرات؛ الربّي أو المشرّع الذي ينقل نظام شعب \"منضبط داخلياً\" إلى شعب \"لا يتحرك إلا بالزجر الخارجي\" يزرع عضواً غريباً في جسدٍ سيلفظه حتماً.",en:"Institutions are not made in laboratories; the educator or legislator transplanting an \"internally disciplined\" system onto a people that moves only by external rebuke grafts a foreign organ into a body that will reject it."}},
{id:"q24",u:"u3",a:2,
 q:{ar:"ما \"فضيحة\" الفكر اللوبوني كما يصوّرها المترجم؟",en:"What is the \"scandal\" of Le Bon's thought per the translator?"},
 o:[{ar:"أنه ينفي أثر التعليم في تغيير العقول",en:"Denying education's effect on minds"},
    {ar:"أنه يدعو إلى العودة بالمجتمعات إلى العصور الوسطى",en:"Calling for a return to the Middle Ages"},
    {ar:"أنه يجعل \"العرق\" سجناً لا فكاك منه: القيم قيماً كونية عنده مخرجاتٌ سيكولوجية بتربة روحية لكل أمة",en:"Making \"race\" a prison with no release: values are not universal but psychological outputs of each nation's spiritual soil"},
    {ar:"أنه ينفي وجود اللاشعور الجمعي",en:"Denying the collective unconscious"}],
 e:{ar:"الديمقراطية والاشتراكية والحرية ليست قيماً كونية عند لوبون بل مخرجات سيكولوجية تختلف باختلاف التربة الروحية؛ ما تسميه إنجلترا حرية قد تسميه فرنسا فوضى.",en:"For Le Bon democracy, socialism and freedom are not universal values but psychological outputs varying with spiritual soil; what England calls freedom France may call anarchy."}},
/* ---- u4 ---- */
{id:"q25",u:"u4",a:0,
 q:{ar:"بمَ \"يُجرّد\" لوبون الاشتراكية من ثوبها الاقتصادي؟",en:"In what garment does Le Bon reclothe socialism?"},
 o:[{ar:"بثوب \"الحالة النفسية\" أو \"المعتقد الديني\"",en:"The garment of the \"psychological state\" or \"religious belief\""},
    {ar:"بثوب النظريات الاقتصادية الحديثة",en:"The garment of modern economic theories"},
    {ar:"بثوب الفلسفة السياسية المجردة",en:"The garment of abstract political philosophy"},
    {ar:"بثوب القانون الدستوري",en:"The garment of constitutional law"}],
 e:{ar:"لا يرى لوبون في الاشتراكية صراعاً حول وسائل الإنتاج بل صراعاً حول \"الأوهام والغرائز\"؛ فجوهرها عنده حالة ذهنية واعتقاد ديني.",en:"Le Bon does not see a struggle over the means of production but a struggle over \"illusions and instincts\"; its essence, for him, is a mental state and a religious belief."}},
{id:"q26",u:"u4",a:3,
 q:{ar:"ما الذي يجعل الاشتراكية \"تزدهر\" بحسب لوبون؟",en:"What makes socialism \"flourish\" for Le Bon?"},
 o:[{ar:"صِحَّة نظرياتها الاقتصادية",en:"The validity of its economic theories"},
    {ar:"اتساقها مع الحقائق العلمية",en:"Its consistency with scientific facts"},
    {ar:"مقدرة قادتها على المناظرة",en:"Their leaders' debating skill"},
    {ar:"\"البنية النفسية\" لمن يعتنقونها: ملجأٌ لمن عجز عن قسوة النواميس",en:"The \"psychological structure\" of its followers: a refuge for those who could not face the harshness of laws"}],
 e:{ar:"عبقرية لوبون في إدراكه أن الاشتراكية لا تزدهر بصحة نظرياتها بل بالبنية النفسية لمعتنقينا؛ فهي ملاذ كل من عجز عن مواجهة قسوة النواميس الطبيعية والاقتصادية.",en:"Le Bon's genius is perceiving that socialism flourishes not by theoretical validity but through its followers' psychological structure — a refuge for those defeated by natural and economic laws."}},
{id:"q27",u:"u4",a:1,
 q:{ar:"من \"جيش الساخطين\" وما المادة التي يُوقِد بها الاضطراب؟",en:"Who are \"the army of the discontented\", and what fuels disturbance?"},
 o:[{ar:"البرجوازية المتخمة",en:"The satiated bourgeoisie"},
    {ar:"\"غير المتكيفين\" (The Unadapted) الذين تحوّلوا إلى \"حطام اجتماعي\"",en:"\"The unadapted\" who became \"social wreckage\""},
    {ar:"النخب الأكاديمية",en:"Academic elites"},
    {ar:"العاملون في القطاع الحكومي",en:"Public-sector workers"}],
 e:{ar:"يرى لوبون أن غير المتكيفين - عجزوا عن متطلبات المدنية الحديثة - هم الوقود الحقيقي لأي اضطراب، بعد أن صاروا حطاماً اجتماعياً يائساً.",en:"Le Bon holds that the unadapted — those failing modern civilisation's demands — are the real fuel of any disturbance, having become desperate social wreckage."}},
{id:"q28",u:"u4",a:2,
 q:{ar:"على ماذا ينقم \"الحقد الأتافي\" (Atavistic Hatred)؟",en:"What does \"atavistic hatred\" bear a grudge against?"},
 o:[{ar:"الفقر بحد ذاته",en:"Poverty itself"},
    {ar:"الظلم الإداري",en:"Administrative injustice"},
    {ar:"\"التفوق\": الغيرة من كل جلالٍ أو ثروةٍ لا يملكون مواهب نيلها",en:"\"Superiority\": envy of every brilliance or wealth whose gifts they lack"},
    {ar:"القوانين الوراثية",en:"Inheritance laws"}],
 e:{ar:"دوافعهم ليست الفقر ذاته بل التفوق؛ يغتبون كل ميزة أو ثروة يفتقرون لمواهب الحصول عليها، فيتحوّل الحقد إلى نزعة تدميرية.",en:"Their motive is not poverty itself but superiority: envying every brilliance or wealth whose gifts they lack, hatred turning into a destructive trend."}},
{id:"q29",u:"u4",a:0,
 q:{ar:"بمَ يشبّه لوبون وعد الاشتراكية بإعادة توزيع الأرزاق؟",en:"To what does Le Bon compare socialism's promise to redistribute fortunes?"},
 o:[{ar:"إلى \"فانوس سحري\" يوزع دون جهد شخصي",en:"A \"magic lantern\" distributing without personal effort"},
    {ar:"إلى مشروع إسكان وطني",en:"A national housing project"},
    {ar:"إلى عقد اجتماعي جديد",en:"A new social contract"},
    {ar:"إلى نظام ضمان اجتماعي",en:"A social security system"}],
 e:{ar:"الملتجئون للاشتراكية ينظرون إليها كفانوس سحري سيعيد توزيع الأرزاق من دون أن يبذلوا أدنى جهد شخصي؛ وهذا هو \"الأمل السحري\".",en:"Those seeking refuge in socialism view it as a magic lantern redistributing fortunes without the slightest personal effort — the \"magical hope\"."}},
{id:"q30",u:"u4",a:3,
 q:{ar:"لماذا يُعدّ \"أنصاف المتعلمين\" (Demi-savants) الأخطر في رأي لوبون؟",en:"Why are the demi-savants the most dangerous class for Le Bon?"},
 o:[{ar:"لأنهم يملكون سلطة المال",en:"They hold economic power"},
    {ar:"لأنهم أعدادهم ضخمة",en:"They are numerous"},
    {ar:"لأنهم يكرهون التعليم",en:"They hate education"},
    {ar:"لأنهم يملكون \"ثقافة مكتبية\" واسعة بلا \"حكمة عملية\"، ويطمحون لهدم المجتمع",en:"They possess wide \"bookish culture\" without \"practical wisdom\", and crave society's destruction"}],
 e:{ar:"يمتلكون معرفة واسعة على الورق بلا حكمة عملية؛ ويكرهون مجتمعاً لم يعتبرهم عباقرة، فيصبحون \"رسل الدمار\" يحلمون بهدم المعبد ليتربعوا على عرشه.",en:"They hold wide bookish knowledge without practical wisdom; hating a society that did not crown them geniuses, they become \"apostles of destruction\" dreaming of toppling the temple to sit on its throne."}},
{id:"q31",u:"u4",a:2,
 q:{ar:"ما \"الحلم الأسمى\" للمحرّقين (Meneurs)؟",en:"What is the supreme dream of the drivers (meneurs)?"},
 o:[{ar:"تأسيس أحزابٍ اشتراكيةٍ داخل المؤسسات",en:"Founding socialist parties within institutions"},
    {ar:"إصلاح التعليم الجامعي",en:"Reforming university education"},
    {ar:"\"هدمُ الـمعبد\" ليتربعوا هم على عرشهِ بوصفهم الفلاسفة-الملوك الجدد",en:"To \"destroy the temple\" so they may sit on its throne as the new philosopher-kings"},
    {ar:"نشر أبحاثهم الأكاديمية",en:"Publishing their academic research"}],
 e:{ar:"يكرهون المجتمع الذي لم يَعتبرهم عباقرةً فوق العادة؛ فحلمهم الأسمى هدمُ الـمعبد ليتسلّقوا عرشه، لا إصلاحُ ما فيه.",en:"They hate the society that did not deem them geniuses above the ordinary; their supreme dream is destroying the temple to climb its throne, not reforming it."}},
{id:"q32",u:"u4",a:0,
 q:{ar:"ما خطورة \"المنطق التجريدي\" عند أنصاف المتعلمين؟",en:"What is the danger of \"abstract logic\" among the demi-savants?"},
 o:[{ar:"ظنّهم أن المجتمعات معادلاتٌ رياضيةٌ تُعاد صياغتها بجرة قلم، متجاهلين عِنادَ التاريخِ والبيولوجيا",en:"Believing societies are mathematical equations reformulable by a stroke of the pen, ignoring the stubbornness of history and biology"},
    {ar:"اعتمادهم على المنطق الصوري في الدراسة",en:"Relying on formal logic in study"},
    {ar:"اهتمامهم بقياسات الرأس",en:"Their attention to craniometric measurements"},
    {ar:"رفضهم للإحصاء",en:"Their rejection of statistics"}],
 e:{ar:"يظنون أن الـمجتمعاتِ البشرية معادلاتٌ رياضيةٌ يمكن إعادةُ صياغتها بمجرد جَرّةِ قلمٍ أو مـرسومٍ قانوني؛ وهذا غرورٌ معرفيٌّ يتجاهل واقع الوراثة والتاريخ.",en:"They imagine human societies are mathematical equations reformulable by a mere stroke of the pen or a legal decree — intellectual pride ignoring heredity and history."}},
{id:"q33",u:"u4",a:3,
 q:{ar:"ماذا يقصد لوبون بـ\"اللامبالاة المريضة\" (Je m’enfichisme)؟",en:"What does Le Bon mean by \"sick indifference\" (Je m’enfichisme)?"},
 o:[{ar:"امتناع الجماهير عن التصويت",en:"The masses abstaining from voting"},
    {ar:"ازدياد الإنتاج الصناعي",en:"Rising industrial output"},
    {ar:"انسحاب المثقفين من الحياة العامة",en:"Intellectuals withdrawing from public life"},
    {ar:"فقدان النخبة \"خريفَ الإرادةَ للدفاع عن مكانتها وحقوقها",en:"The elite losing \"the autumn of the will\" to defend its standing and rights"}],
 e:{ar:"يصف بها لوبون النخبة الانتحارية: برجوازية وأثرياء فَقَدوا الإرادةَ اللازمةَ للدفاع عن مـكانتهم، فصاروا يتنازلون جبناءً تحت وطأة طيف الخوف.",en:"He uses it for the suicidal elite: bourgeois and wealthy who lost the will to defend their standing, conceding cowardly under the spectre of fear."}},
{id:"q34",u:"u4",a:1,
 q:{ar:"ما نتاج دورة \"التنازلات الجبانة\"؟",en:"What does the cycle of \"cowardly concessions\" produce?"},
 o:[{ar:"استقراراً اجتماعياً",en:"Social stability"},
    {ar:"\"انتحاراً طبقياً\" بطيئاً: كل تنازل يزيد جسارة الخصم بدل أن يرضيه",en:"A slow \"class suicide\": every concession emboldens the adversary instead of satisfying him"},
    {ar:"حواراً مثمراً بين الطبقات",en:"A fruitful dialogue between the classes"},
    {ar:"تراجع الاشتراكية",en:"Socialism's retreat"}],
 e:{ar:"يسرع المُنهزمون لتقديم التنازلات تحت طيف الخوف؛ وما يُقدّمونه لا يُرضي الخصم بل يزيد جسارة، حتى تكتمل مأساة الانتحار الطبقي البطيء.",en:"The defeated rush to concede under the spectre of fear; what they offer satisfies not the adversary but emboldens him, completing the tragedy of slow class suicide."}},
{id:"q35",u:"u4",a:0,
 q:{ar:"لماذا تبقى براهين الاقتصاديين عاجزةً عن اختراق حصون الاشتراكية العاطفية؟",en:"Why do the economists' proofs remain unable to breach socialism's emotional fortresses?"},
 o:[{ar:"لأنها مبنية على الحقد (عند الفقير) والخوف (عند الغني) والغرور (عند المثقف)",en:"Because it is built on hatred (poor), fear (rich) and pride (intellectual)"},
    {ar:"لأنها مبنية على المصلحة الشخصية",en:"Because it is built on personal interest"},
    {ar:"لأنها مبنية على الدين التقليدي",en:"Because it is built on traditional religion"},
    {ar:"لأنها مبنية على قوانين السوق",en:"Because it is built on the laws of the market"}],
 e:{ar:"هذا وجه \"المناعة ضد العقلِ\" في \"الحالة الذهنية\" فالعواطفُ البدائيةُ تصنعُ حصناً لا يخترقه البرهان البارد؛ ولذلك يُعدّ لوبون الاشتراكية حالةً مرضيةً لا نظريةً علمية.",en:"This is the \"immunity against reason\" within the \"mental state\": primitive emotions forge a fortress cold proof cannot breach — hence Le Bon deems socialism a pathological state, not a scientific theory."}},
{id:"q36",u:"u4",a:2,
 q:{ar:"ما الرؤية الختامية لدور الغريزة في الاشتراكية؟",en:"What is the closing view of instinct's role in socialism?"},
 o:[{ar:"الغريزة الجماعية أداة مؤقتة لبناء الدولة",en:"Collective instinct is a temporary tool for building the state"},
    {ar:"الاشتراكية تُصلح الغريزة الفردية",en:"Socialism cures the individual instinct"},
    {ar:"الاشتراكية \"ردةٌ بربرية\" تُعلي الغريزة الجماعية على حساب العقل الفردي، و\"بديلٌ للدين\" يشبع الغريزة الدينية",en:"Socialism is a \"barbaric regression\" exalting collective instinct at individual reason's expense, and a \"substitute for religion\" satisfying the religious instinct"},
    {ar:"الغريزة لا دور لها في السياسة",en:"Instinct has no role in politics"}],
 e:{ar:"من ثلاثية \"الحالة الذهنية\": المناعة ضد العقل، وبديل الدين (الدولة إلهٌ يجلب الفردوس)، وانتصار الغريزة: ردة بربرية تُعيد سيادة الغرائز الجماعية على العقل الفردي.",en:"From the triad of the \"mental state\": immunity against reason, the substitute for religion (the state as god bringing paradise), and the triumph of instinct — a barbaric regression to collective rule."}}
];

/* ===== QUIZ DATA — Part B: Units 5-8 (46 questions) ===== */
QUIZ.push(
/* ---- u5 ---- */
{id:"q37",u:"u5",a:2,
 q:{ar:"بمَ يضرب لوبون جذور \"الحلم الاشتراكي\"؟",en:"With what does Le Bon strike at the roots of \"the socialist dream\"?"},
 o:[{ar:"بعملية المصالحة الوطنية",en:"By national reconciliation"},
    {ar:"بمعاول الاقتصاد الكلي",en:"With the mattocks of macroeconomics"},
    {ar:"بمعاول \"الحتميةِ البيولوجيةِ والنواميسِ الطبيعية\"",en:"With the mattocks of \"biological necessity and natural laws\""},
    {ar:"بنصوص الدساتير",en:"With constitutional texts"}],
 e:{ar:"يعرض لوبون مرافعة سوسيولوجية جريئة يضرب فيها جذور الحلم الاشتراكية بالحتمية البيولوجية والنواميس الطبيعية؛ فالوعود الاقتصادية تصطدم بها مباشرة.",en:"Le Bon presents a bold sociological plea striking the socialist dream with biological necessity and natural laws — its economic promises collide with them directly."}},
{id:"q38",u:"u5",a:0,
 q:{ar:"أيُّ تباينٍ يفسّر لماذا يرى لوبون الاشتراكية انحطاطاً للحضارة؟",en:"Which contrast explains why Le Bon sees socialism as civilisation's decline?"},
 o:[{ar:"التباين بين \"قوانينِ الانتخابِ الطبيعي\" و\"وهمِ المساواةِ المطلقة\"",en:"The contrast between \"the laws of natural selection\" and \"the illusion of absolute equality\""},
    {ar:"التباين بين الغرب والشرق",en:"The contrast between West and East"},
    {ar:"التباين بين الرأس المال والعمل",en:"The contrast between capital and labour"},
    {ar:"التباين بين القدماء والمعاصرين",en:"The contrast between ancients and moderns"}],
 e:{ar:"قوانين الانتخاب الطبيعي تكافئ الأصلح والأكثر تكيفاً؛ وكل مسعى لبناء مجتمع \"ضد الطبيعة\" محكوم عليه الانهيار بعد تحويل العالم إلى خراب.",en:"The laws of natural selection reward the better adapted; any project building a society \"against nature\" is doomed to collapse after turning the world into ruin."}},
{id:"q39",u:"u5",a:3,
 q:{ar:"ما محرّك التقدم في الأنواع الحية والحضارات بحسب لوبون؟",en:"What drives progress in living species and civilisations for Le Bon?"},
 o:[{ar:"التساوي في النتائج",en:"Equal outcomes"},
    {ar:"التعليم الإلزامي",en:"Compulsory education"},
    {ar:"الrząd التنظيمي للدولة",en:"State regulation"},
    {ar:"\"اللامساواةُ الطبيعية\" و\"التنازعُ من أجلِ البقاء\" ببقاء الأصلح",en:"\"Natural inequality\" and the \"struggle for existence\", survival favouring the better adapted"}],
 e:{ar:"يرى لوبون أن جميع صور التقدم نتاج اللامساواة الطبيعية والتنازع من أجل البقاء؛ فبدون تفاوتٍ لا انتقاء، وبدون انتقاء لا تطور.",en:"All forms of progress are the product of natural inequality and the struggle for existence; without difference there is no selection, and without selection no evolution."}},
{id:"q40",u:"u5",a:1,
 q:{ar:"ما معنى وصف التفاوت الاجتماعي بأنه \"التجلّي الخارجي\" للتفاوتات الطبيعية؟",en:"What does it mean to call social disparity the \"outward manifestation\" of natural differences?"},
 o:[{ar:"أن الفقر ظاهرة حضارية حديثة",en:"Poverty is a modern civilisational phenomenon"},
    {ar:"أن اللامساواة الاجتماعية تنعكاس لتفاوتات وراثية وبيولوجية لا سلطان للبشر على تغييرها",en:"Social inequality mirrors biological and hereditary differences humans cannot change"},
    {ar:"أن الطبقة الاجتماعية تتحدد بالملابس",en:"Class is determined by dress"},
    {ar:"أن المدن أكثر تفاوتاً من الريف",en:"Cities are more unequal than villages"}],
 e:{ar:"هذا جوهر \"عقم التسوية\": الاشتراكية تسعى لتساوي الظروف، بينما التفاوت الخارجي مجرد ظل لتفاوتات أعمق أصلها البيولوجيا.",en:"This is the core of \"the sterility of levelling\": socialism seeks equality of circumstances, while outward disparity is but a shadow of deeper biological differences."}},
{id:"q41",u:"u5",a:2,
 q:{ar:"لماذا يكون الضعفاء أشد معاناةً في نظام المساواة المطلقة بحسب لوبون؟",en:"Why do the weak suffer more under absolute equality for Le Bon?"},
 o:[{ar:"لأن المساواة ترفع الضرائب عن الأغنياء",en:"Equality taxes the rich less"},
    {ar:"لأن الأقوياء يتركون طوعاً",en:"The strong withdraw voluntarily"},
    {ar:"لأنهم يفتقرون إلى \"الاستعدادات الموروثة\" التي تُمكّنهم من المنافسة، فتدفعهم الحياة نحو \"الجدار\"",en:"They lack the \"inherited endowments\" enabling competition, so life drives them toward \"the wall\""},
    {ar:"لأنهم يهاجرون إلى الخارج",en:"They emigrate"}],
 e:{ar:"في نظام الحرية والمساواة المطلقة يُسحق الضعفاء بلا رحمة، أشد قسوةً من المجتمعات الأرستقراطية، لافتقارهم لما ورثته النخب من استعدادات.",en:"Under freedom and absolute equality the weak are crushed without mercy — more harshly than in aristocratic societies — for lacking the endowments inherited by elites."}},
{id:"q42",u:"u5",a:0,
 q:{ar:"بمَ يوصف مسعى قمع اللامساواة الطبيعية؟",en:"How is the endeavour to suppress natural inequality described?"},
 o:[{ar:"\"تطوراً ارتدادياً\" (Regressive Evolution) نحو البربرية بالتضحية بالمتفوقين",en:"\"Regressive evolution\" toward barbarism, sacrificing the superior"},
    {ar:"تقدماً أخلاقياً سريعاً",en:"Rapid moral progress"},
    {ar:"إصلاحاً دستورياً",en:"Constitutional reform"},
    {ar:"مراحل تطور طبيعي",en:"Stages of natural evolution"}],
 e:{ar:"التضحية بـ\"الأفراد المتفوقين\" - وهم صناع العلم والصناعة - لأجل الأغلبية \"المتوسطة أو المتبلدة\" هي رجوع إلى بربرية بدائية لا تقدم.",en:"Sacrificing \"superior individuals\" — the makers of science and industry — for the \"mediocre or dull\" majority is a return to primitive barbarism, not progress."}},
{id:"q43",u:"u5",a:3,
 q:{ar:"لماذا تعني المساواة عند لوبون سيادة \"الرداءة\"؟",en:"Why does equality mean the reign of \"mediocrity\" for Le Bon?"},
 o:[{ar:"لأنها توزع الثروة عادلاً",en:"It distributes wealth fairly"},
    {ar:"لأنها ترفع المعاناة عن الفقراء",en:"It lifts the poor's hardship"},
    {ar:"لأنها تعزز التنافسية",en:"It boosts competitiveness"},
    {ar:"لأنها تخنق التميز الفردي الذي هو المصدر الوحيد للثروة والحضارة",en:"It chokes individual excellence, the sole source of wealth and civilisation"}],
 e:{ar:"التميز الفردي عنده هو المَنبت الوحيد للثروة والحضارة؛ فكل تسطيحٍ له إسكاتٌ للمصادر التي تُنتج الرخاء.",en:"Individual excellence is for him the only soil bearing wealth and civilisation; levelling it silences the sources producing prosperity."}},
{id:"q44",u:"u5",a:1,
 q:{ar:"أين تكمن - حسب لوبون - حماية الحضارة؟",en:"Where does the protection of civilisation lie for Le Bon?"},
 o:[{ar:"في إلغاء الامتيازات بالكامل",en:"Abolishing all privileges"},
    {ar:"في صيانة التراتبية التي تُسيّر للأذكياء القيادة وللعاجزين حمايةً دون تعطيل التقدم",en:"Preserving the hierarchy that lets the intelligent lead and protects the weak without halting progress"},
    {ar:"في تسعير الموارد بحرية",en:"Free pricing of resources"},
    {ar:"في توسيع الجيش",en:"Expanding the army"}],
 e:{ar:"التراتبية عند لوبون ليست ظلماً بل آلية حماية: الأذكياء يقودون، والعاجزون ينضوون تحت نظام يمنع سحقهم، وسير التقدم لا يتوقف.",en:"For Le Bon hierarchy is not injustice but a protective mechanism: the intelligent lead, the weak are sheltered from being crushed, and progress continues."}},
{id:"q45",u:"u5",a:0,
 q:{ar:"ما الفارق الجوهري بين وعود الأديان التقليدية ووعود الاشتراكية؟",en:"What is the essential difference between traditional religions' promises and socialism's?"},
 o:[{ar:"الأديان تعدّ بسعادة سماوية لا تُدحض، والاشتراكية تعدّ بـ\"سعادة أرضية\" يفضحها الواقع ببؤسٍ وفوضى",en:"Religions promise a heavenly happiness that cannot be refuted; socialism promises an \"earthly happiness\" that reality exposes through misery and chaos"},
    {ar:"الأشدودان متطابقتان",en:"Both are identical"},
    {ar:"الاشتراكية تعدّ أكثر مما تفعل الأديان",en:"Socialism promises more than religions"},
    {ar:"الأديان لا تعدّ بشيء",en:"Religions promise nothing"}],
 e:{ar:"السعادة السماوية مصونٌ من النقد العملي، أما السعادة الأرضية فتُختبر يومياً وسطورياً؛ ولذلك سرعان ما يكشف الواقع زيف الوعود الاشتراكية.",en:"Heavenly happiness is immune to practical refutation, while earthly happiness is tested daily — hence reality soon exposes socialist promises."}},
{id:"q46",u:"u5",a:2,
 q:{ar:"لماذا يُسمّى لوبون \"داروينيَّ السوسيولوجيا\" في إضاءة المترجم؟",en:"Why is Le Bon called \"the Darwin of sociology\" in the translator's note?"},
 o:[{ar:"لأنه درس القردة",en:"For studying primates"},
    {ar:"لأنه نفى أثر البيئة",en:"For denying the environment's effect"},
    {ar:"لأنه لا يؤمن بحقوقٍ مجردة تُمنح للجميع، بل بحقوقٍ تُكتسب بالارتقاء",en:"He does not believe in abstract rights granted to all but in rights acquired through ascent"},
    {ar:"لأنه كتب عن الأحافير",en:"For writing about fossils"}],
 e:{ar:"الحقوق عنده ليست إنشائية مُمنوحة بل مكتسبة بالارتقاء؛ ومأساة الاشتراكية أنها تريد إلغاء \"المحرك\" (التفاوت) لتدبير \"الآلة\" (المجتمع) فتنتهي بالعطالة.",en:"Rights are not granted by decree but acquired through ascent; socialism's tragedy is abolishing \"the engine\" (difference) to run \"the machine\" (society), ending in paralysis."}},
{id:"q47",u:"u5",a:3,
 q:{ar:"لماذا يعدّ لوبون مسعى بناء مجتمع \"ضد الطبيعة\" تهديداً كيانياً؟",en:"Why does Le Bon deem a society built \"against nature\" an existential threat?"},
 o:[{ar:"لأنه يستهلك الموارد الطبيعية",en:"It consumes natural resources"},
    {ar:"لأنه يخالف الأعراف السائدة",en:"It contradicts prevailing customs"},
    {ar:"لأنه يتطلب إرهاقاً للعاملين",en:"It demands exhausting labour"},
    {ar:"لأن كل ما هو ضد الطبيعة محكومٌ عليه بالانهيار بعد تحويل العالم إلى خراب",en:"Everything against nature is doomed to collapse after turning the world into ruin"}],
 e:{ar:"القوانين الطبيعية عنده أعلى سلطة؛ فالمجتمع المبني على مخالفة الاختيار الطبيعي يهلك هشاشةه من داخل، ويجني فوضى تتجاوز ما كان ينتظره أشد المتشائمين.",en:"Natural laws are the supreme authority; a society built against selection collapses from its own brittleness, reaping chaos beyond even the pessimist's expectation."}},
/* ---- u6 ---- */
{id:"q48",u:"u6",a:1,
 q:{ar:"بمَ يصف لوبون حقيقة الاشتراكية بعد أن يجردها من الثوب الاقتصادي؟",en:"How does Le Bon describe socialism after stripping its economic garment?"},
 o:[{ar:"حركةً اقتصاديةً كلاسيكية",en:"A classical economic movement"},
    {ar:"حركةً دينيةً تقوم على الإيمان المطلق بقدرة الدولة على اجتراح المعجزات، أي \"الحق الإلهي الحديث\"",en:"A religious movement resting on absolute faith in the state's power to work miracles — \"the modern divine right\""},
    {ar:"مشروعَ علمانيةٍ تحرري",en:"A liberal secular project"},
    {ar:"مدرسةَ فلسفةٍ سياسية",en:"A school of political philosophy"}],
 e:{ar:"النظر إلى الاشتراكية حركة اقتصادية خطأ في التقدير السيكولوجي؛ فهي حركة دينية، والجماهير نقلت صفات الإله المريد إلى \"الدولة-الإله\" المنتظرة من حل المعجزات.",en:"Viewing socialism as an economic movement is a psychological misjudgement: it is a religious movement whose masses transferred the wilful God's attributes to the state-God expected to work miracles."}},
{id:"q49",u:"u6",a:0,
 q:{ar:"ماذا يعني وصف الدولة الاشتراكية بـ\"صنمٍ جديد\"؟",en:"What does calling the socialist state a \"new idol\" mean?"},
 o:[{ar:"أنها أُقيمت على أنقاض المعابد القديمة لتمارس سلطةً لاهوتية بمسوحٍ علمانية",en:"Erected on the ruins of the old temples to exercise theological power in secular garb"},
    {ar:"أنها تُعبد رسمياً",en:"It is officially worshipped"},
    {ar:"أنها مبنية من الحجر",en:"It is built of stone"},
    {ar:"أنها تحفظ التماثيل",en:"It preserves statues"}],
 e:{ar:"الدولة الاشتراكية ليست مؤسسة لتدبير الموارد بل صنمٌ يرث القداسة من المعابد القديمة؛ \"الإله\" تغيّر شكله لا طبيعته.",en:"The socialist state is not an institution for managing resources but an idol inheriting sanctity from old temples — the \"god\" changed its form, not its nature."}},
{id:"q50",u:"u6",a:3,
 q:{ar:"ما السبب البنيوي لفشل الإنتاج الذي تديره الدولة؟",en:"What is the structural reason state-managed production fails?"},
 o:[{ar:"ضيق المساحات الزراعية",en:"Limited arable land"},
    {ar:"ضعف التكنولوجيا",en:"Weak technology"},
    {ar:"كثرة الموظفين",en:"Too many employees"},
    {ar:"غياب محرّك \"المصلحة الشخصية\"",en:"The absence of the engine of \"personal interest\""}],
 e:{ar:"بدون المصلحة الشخصية يفقد الإنتاج دافعه؛ فتفشل الإدارة المركزية وتُغرق في المغالاة، ولا بديل لها عن سخرة الناس.",en:"Without personal interest production loses its motive; centralised management fails and spirals into excess costs, leaving corvée as the only substitute."}},
{id:"q51",u:"u6",a:2,
 q:{ar:"إلى ماذا يؤول نظام حين تبتلع الدولة كافّة الصناعات؟",en:"What does a system become when the state swallows all industries?"},
 o:[{ar:"إلى اقتصاد سوقٍ حر",en:"A free-market economy"},
    {ar:"إلى شراكةٍ عامة-خاصة",en:"A public-private partnership"},
    {ar:"إلى \"عملٍ قسريٍّ\" مقابل أدنى أجرٍ للمعيشة (قانون العطالة)",en:"\"Forced labour\" for the lowest subsistence wage (the law of idleness)"},
    {ar:"إلى تقسيمٍ للعملٍ التطوعي",en:"Voluntary division of labour"}],
 e:{ar:"تجد الدولة نفسها عاجزةً عن الاستمرار بغير إرساء نظام العمل القسري؛ فتتحول المهن إلى سخرة إدارية تُدار بالمراسيم لا بالدوافع.",en:"The state finds itself unable to continue without instituting forced labour; callings become administrative corvée run by decrees rather than motives."}},
{id:"q52",u:"u6",a:1,
 q:{ar:"ما \"الرق الحديث\" في الدولة الاشتراكية؟",en:"What is \"modern bondage\" in the socialist state?"},
 o:[{ar:"إلغاء ملكية الأراضي",en:"Abolishing land ownership"},
    {ar:"تحويل المواطنين إلى \"أرقامٍ\" في آلةٍ بيروقراطيةٍ ضخمة يكدح فيها الجميع لتعويض قصور الإدارة",en:"Turning citizens into \"numbers\" in a vast bureaucratic machine where all toil to offset administrative shortcomings"},
    {ar:"فرض الضرائب المرتفعة",en:"Imposing high taxes"},
    {ar:"منع التنقل بين المدن",en:"Banning travel between cities"}],
 e:{ar:"يسميه لوبون \"العبودية المقننة\": قوانين تُشرّع الرق وتحوّل الحياة كلها إلى ملفٍ إداري؛ فلا ملكية ولا إرادة، بل إعدادات سجلٍّ ورقم.",en:"He calls it \"codified slavery\": laws legislating servitude and turning all life into an administrative file — no ownership, no will, only registry numbers."}},
{id:"q53",u:"u6",a:0,
 q:{ar:"ما \"القاعدة الثابتة\" التي ينطلق منها لوبون؟",en:"What is the fixed rule Le Bon starts from?"},
 o:[{ar:"\"إن الفردَ المبدع هو صانعُ الحضارة، لا الجموع\"",en:"\"It is the creative individual who makes civilisation, not the crowds\""},
    {ar:"\"إن الجموع تصنع التاريخ\"",en:"\"The crowds make history\""},
    {ar:"\"إن الدولة تصنع الحضارة\"",en:"\"The state makes civilisation\""},
    {ar:"\"إن التكنولوجيا تصنع الحضارة\"",en:"\"Technology makes civilisation\""}],
 e:{ar:"من هذه القاعدة تُشتق كل نتائجه: سحق المبادرة الفردية = تعطيل روافع العصر، ومساواة الرؤوس = رداءة شاملة.",en:"All his corollaries flow from it: crushing individual initiative disables the age's levers, and levelling heads produces universal mediocrity."}},
{id:"q54",u:"u6",a:3,
 q:{ar:"كيف تُعطل الاشتراكية \"روافع العصر الحديث\"؟",en:"How does socialism disable \"the levers of the modern age\"?"},
 o:[{ar:"بتخفيض الضرائب",en:"By lowering taxes"},
    {ar:"بتقليص البيروقراطية",en:"By cutting bureaucracy"},
    {ar:"بتوسيع الحرية التجارية",en:"By expanding commercial freedom"},
    {ar:"بسحق المبادرة الفردية باسم \"المساواة\"",en:"By crushing individual initiative in the name of \"equality\""}],
 e:{ar:"محو النخبة يتم عبر التسطيح: المساواة تُساوي العادي مع المتميز، فيغيب كل الدافع للتميز الذي يصنع الاكتشافات والصناعات.",en:"The elite are erased through flattening: equality equates the ordinary with the excellent, erasing every motive for the excellence that produces discoveries and industries."}},
{id:"q55",u:"u6",a:2,
 q:{ar:"ما المقصود بـ\"الرسوب الاجتماعي\" و\"Base Equality\"؟",en:"What are \"social failure\" and \"Base Equality\"?"},
 o:[{ar:"انخفاض معدلات المواليد",en:"Falling birth rates"},
    {ar:"انهيار العملة الوطنية",en:"Currency collapse"},
    {ar:"تآكل الأمة إلى \"رداءة شاملة\": مجتمع رواسبٍ اجتماعية بلا بريق ذهني أو علمي",en:"A nation's decay into \"universal mediocrity\": a society of social sediments without intellectual or scientific brilliance"},
    {ar:"زيادة الجرائم",en:"Rising crime"}],
 e:{ar:"الأمة تغدو \"مضحَّة كتلة خاملة من البشر\"؛ الرداءة الشاملة ليست مجازاً بل وصفٌ لغياب النخب المنتجة أصلاً.",en:"The nation becomes \"a sheer inert mass of human beings\"; universal mediocrity is not a metaphor but a description of the vanished productive elite."}},
{id:"q56",u:"u6",a:1,
 q:{ar:"ما الآلية التي تقتل \"الحكم الذاتي\" (Self-government) في الفرد؟",en:"What mechanism kills \"self-government\" in the individual?"},
 o:[{ar:"انتشار الجهل",en:"The spread of ignorance"},
    {ar:"تدخل الدولة في أدق تفاصيل الحياة حتى تضحل الشخصية وتسود \"العبودية المهينة\"",en:"State intervention in the finest details of life, atrophying personality into \"humiliating servitude\""},
    {ar:"زيادة الثروة",en:"Rising wealth"},
    {ar:"انفتاح الحدود",en:"Open borders"}],
 e:{ar:"الدولة الكلية تُلغي الفراغ الذي يتنفس فيه القرار الفردي؛ فتحوّل المواطن من حاكمٍ لنفسه إلى منفّذٍ أوامر، وهي العبودية المهينة.",en:"The total state abolishes the space in which individual decision breathes; the citizen turns from self-governor to executor of orders — humiliating servitude."}},
{id:"q57",u:"u6",a:3,
 q:{ar:"كيف يتحوّل المواطن في \"نفسية المرتزقة\"؟",en:"How does the citizen become part of \"the psychology of mercenaries\"?"},
 o:[{ar:"بإحراز الشهادات الجامعية",en:"By earning academic degrees"},
    {ar:"بتولي المناصب الإشرافية",en:"By taking supervisory posts"},
    {ar:"بامتلاك الأراضي",en:"By owning land"},
    {ar:"بفقدان الجسارة والمسؤولية وانتظار أوامر \"البابا الجماعي\"",en:"By losing boldness and responsibility, awaiting the \"collective Papa's\" orders"}],
 e:{ar:"هؤلاء مرتزقة جبناء لا يُبادر أحد ولا يتحمّل مسؤولية؛ وينتظرون توجيه الإدارة المركزية لكل تفصيل، حتى في اختيار مهنتهم.",en:"They are cowardly mercenaries: none initiates or bears responsibility, awaiting the central administration's direction for every detail, even choosing their occupation."}},
{id:"q58",u:"u6",a:0,
 q:{ar:"لماذا يفوق \"جحيم العبودية\" قسوة أي أرستقراطية غابرة؟",en:"Why does \"the hell of servitude\" exceed any bygone aristocracy's harshness?"},
 o:[{ar:"لأن الطاغية هنا \"مجهولٌ\" ولا قلب له، فيقمع بلا وجهٍ ولا رحمة",en:"Because the tyrant here is \"anonymous\" and has no heart, repressing without a face or mercy"},
    {ar:"لأنه يفرض ضرائب أعلى",en:"It imposes higher taxes"},
    {ar:"لأنه يستخدم التكنولوجيا",en:"It uses technology"},
    {ar:"لأنه يدوم أطول",en:"It lasts longer"}],
 e:{ar:"الأرستقراطية القديمة كان لها أسماء ووجوه وسقفاً للتعسف؛ أما الآلة المجهولة فلا تعرفها ولا ترحم، وتُمارس العقاب الإحصائي بلا تفرقة.",en:"The old aristocracy had names, faces and limits to its abuses; the anonymous machine is unknown and merciless, applying punishment statistically without discrimination."}},
{id:"q59",u:"u6",a:2,
 q:{ar:"ما المساران اللذان يخرج منهما المجتمع من تيه \"الفوضى الاجتماعية\"؟",en:"What are the two paths out of \"social chaos\"?"},
 o:[{ar:"الانتخابات الدورية والدبلوماسية",en:"Periodic elections and diplomacy"},
    {ar:"الإصلاحيات التدريجية والتعليم",en:"Gradual reform and education"},
    {ar:"ظهور \"قيصرٍ\" يفرض النظام بالقوة، أو الغزو الخارجي من دولٍ أكثر حيوية",en:"The rise of \"a Caesar\" imposing order by force, or foreign invasion by more vital states"},
    {ar:"العودة إلى المجتمع القروي",en:"Returning to rural society"}],
 e:{ar:"الأمة التي تضحي بالتميز وتقتل المبادرة تهبط إلى الفوضى ثم تنتظر زعيمها القسري أو ابتلاع الغزو؛ كلا المسارين خسارة.",en:"A nation sacrificing excellence and killing initiative descends into chaos, then awaits a strongman or a foreign swallow — both paths are losses."}},
/* ---- u7 ---- */
{id:"q60",u:"u7",a:1,
 q:{ar:"بمَ يرتبط نجاح أي مذهبٍ - في الإبستيمولوجيا السيكولوجية للوبون؟",en:"What determines a doctrine's success in Le Bon's psychological epistemology?"},
 o:[{ar:"بصِحَّتِه المادية ودقّة رياضياته",en:"Its material validity and mathematical precision"},
    {ar:"ب مدى اتساقِه مع \"القوانينِ النفسيةِ\" للإقناع، حيث يتحوّل المحرض إلى نبيٍّ والكلمة إلى سحر",en:"Its consistency with the \"psychological laws\" of persuasion, where the agitator becomes a prophet and the word becomes magic"},
    {ar:"بعدد مؤيديه في البرلمان",en:"The number of its parliamentary supporters"},
    {ar:"بمواردَه المالية",en:"Its financial resources"}],
 e:{ar:"المعركة لا تُدار في ساحة البرهان بل في دهاليز اللاشعور؛ والنظريات العقلانية تعجز عن مجابهة العقائدية لأنها تخاطب القشرة لا الغريزة.",en:"The battle is fought not in the arena of proof but in the corridors of the unconscious; rationalist theories cannot confront faith-based movements because they address the cortex, not the instinct."}},
{id:"q61",u:"u7",a:0,
 q:{ar:"ما \"القانون الأول\" الذي يحكم صعود الاشتراكية؟",en:"What is the \"first law\" governing socialism's ascent?"},
 o:[{ar:"أن الجماهير لا تنفعل بالأدلة المنطقية بل بـ\"منطق العواطف\"؛ والاشتراكية تقع في منطقة الأحلام فتتجاوز العقل التحليلي",en:"The masses are not moved by logical evidence but by \"emotional logic\"; socialism dwells in the region of dreams, bypassing the analytical mind"},
    {ar:"أن النخب تصنع الثورات",en:"Elites make revolutions"},
    {ar:"أن الفقر يُنتج الاشتراكية آلياً",en:"Poverty automatically produces socialism"},
    {ar:"أن القوة المسلحة تحسم النزاع",en:"Armed force settles conflicts"}],
 e:{ar:"سيادة منطق العواطف: كل فكرة تُقال بعاطفةٍ أقوى من كل حجةٍ تُقال ببرود؛ وهذا ما يجعل الدعاية أقوى من البرهان.",en:"Sovereignty of emotional logic: an idea charged with emotion outpowers any argument delivered coldly — this is why propaganda beats proof."}},
{id:"q62",u:"u7",a:1,
 q:{ar:"ما تسلسل \"دورةِ الدعايةِ\" كما يلخصه إطار لوبون؟",en:"What is the sequence of the \"cycle of propaganda\" as Le Bon's framework summarises it?"},
 o:[{ar:"أفكارٌ نظريةٌ ← بحثٌ علميٌّ ← نشرُ الأدلة ← إقناعُ المثقفين",en:"Theoretical ideas → scientific research → publishing evidence → convincing intellectuals"},
    {ar:"هيبةُ القادة ← الكلماتُ والمعادلات ← التوكيدُ والتكرار ← العدوى الذهنية ← عقيدةٌ دينيةٌ لا تتزحزح",en:"Leaders' prestige → words and formulas → affirmation and repetition → mental contagion → an unshakable religious doctrine"},
    {ar:"احتجاجاتٌ شعبيةٌ ← تنظيمُ جماعات ← مطالبُ برلمانية ← قوانين",en:"Popular protests → group organisation → parliamentary demands → laws"},
    {ar:"نقاشٌ فكريٌّ ← تشكيلُ أحزاب ← انتخابات ← تطبيقُ السياسات",en:"Intellectual debate → party formation → elections → policy implementation"}],
 e:{ar:"المسار حتمي كما يرسمه لوبون: تبدأ الهيبةُ ببثِّ الكلماتِ التي تخاطبُ المنطقَ العاطفي، فتُزرعُ بالتكرار، وتنتشرُ كالعدوى، وتنتهي عقيدةً محصنةً لا ينال منها النقاش.",en:"An inevitable course per Le Bon: prestige seeds words addressing emotional logic, repetition implants them, contagion spreads them, and they end an entrenched doctrine beyond debate."}},
{id:"q63",u:"u7",a:2,
 q:{ar:"متى يتحوّل المفهوم إلى \"عقيدة محصنة\"؟",en:"When does a concept become an \"entrenched doctrine\"?"},
 o:[{ar:"عندما يُطبع في كتب مدرسية",en:"When printed in schoolbooks"},
    {ar:"عندما يُقنع به المثقفون",en:"When intellectuals are convinced by it"},
    {ar:"بمجرد أن يعبر عتبة العاطفة؛ ولا يفككها إلا الزمن لا الجدال",en:"Once it crosses the threshold of emotion; only time, not debate, dismantles it"},
    {ar:"عندما تُصدقه أغلبية البرلمان",en:"When a parliamentary majority endorses it"}],
 e:{ar:"العقيدة العاطفية محصنة بنيوياً: النقاش يُقوّيها بالذِّراع، لأن الخلاف يُعيد طرحها على المستوى العاطفي؛ والزمن وحده يفككها بتناثر جيلها.",en:"An emotional doctrine is structurally fortified: debate strengthens it by force of opposition, re-litigating it emotionally; only time dismantles it as its generation fades."}},
{id:"q64",u:"u7",a:3,
 q:{ar:"ما شرطٌ أساسيٌّ لنجاح الدعاية بحسب لوبون؟",en:"What is a basic condition of propaganda's success for Le Bon?"},
 o:[{ar:"صحافة مستقلة",en:"An independent press"},
    {ar:"أغلبية ثقافية",en:"A cultural majority"},
    {ar:"تمويل ضخم",en:"Huge funding"},
    {ar:"وجود قادة يملكون \"جسارة الإيمان\" (رسل/محرّقون)",en:"Leaders possessing the \"audacity of faith\" (apostles/drivers)"}],
 e:{ar:"لا تنجح الدعاية إلا بوجود قادة متوهّجين بإيمانهم؛ لامبتكري الأفكار وحدهم يصعقهم الجمهور، بل من يبثّ ثقته فيُعدّ لامعقوله معقولاً.",en:"Propaganda needs leaders radiant with faith; mere idea-inventors are ignored, but the one radiating certainty makes his unreason seem reasonable."}},
{id:"q65",u:"u7",a:0,
 q:{ar:"ما \"الهيبة\" (Prestige) وكيف تفرض سلطانها؟",en:"What is \"prestige\" and how does it impose itself?"},
 o:[{ar:"قوةٌ سحريةٌ تجعل الأفكار مقبولة دون جهدٍ نقدي، فلا يُقنع القائد بالمنطق بل يفرض بالهيبة",en:"A magical force making ideas acceptable without critical effort: the leader persuades not by logic but by prestige"},
    {ar:"منصب رسمي رسمي",en:"An official position"},
    {ar:"ثروةٌ مالية",en:"Wealth"},
    {ar:"شهادةٌ جامعية",en:"A university degree"}],
 e:{ar:"الهيبة تُلغي المسافة بين السؤال والقبول؛ الجماهير تبتلع الاقتراح قبل أن تفحصه، وهذا ما يجعل الدجال نبياً في نظر مريديه.",en:"Prestige abolishes the distance between question and acceptance; the masses swallow the proposal before examining it, making the charlatan a prophet in his followers' eyes."}},
{id:"q66",u:"u7",a:2,
 q:{ar:"من \"العقلية الميتافيزيقية\" للقادة عند لوبون؟",en:"Who has the \"metaphysical mindset\" among leaders for Le Bon?"},
 o:[{ar:"المهندسون والاقتصاديون",en:"Engineers and economists"},
    {ar:"القضاة والمحامون",en:"Judges and lawyers"},
    {ar:"\"أنصافُ مهطوعين\" أو متحمسون دينيون نقلوا غرائزهم الدينية إلى معبد الدولة المدبرة",en:"\"Half-deranged\" men or religious fanatics who moved their religious instincts to the temple of the providential state"},
    {ar:"التجار والمصارف",en:"Merchants and bankers"}],
 e:{ar:"هؤلاء لا يبدعون اقتصاداً بل يعبدون آلة؛ يبدّلون محرابهم القديم بآخر حديث دون أن يتغيّر إيمانهم بسلطةٍ فوقيةٍ مطلقة.",en:"They do not create an economy but worship a machine; they exchange one altar for another while their faith in an absolute supreme authority remains unchanged."}},
{id:"q67",u:"u7",a:1,
 q:{ar:"ما \"التقنية السيكولوجية الثنائية\" لغرس الأفكار في اللاشعور الجمعي؟",en:"What is the \"twofold psychological technique\" implanting ideas in the collective unconscious?"},
 o:[{ar:"الحوار والجدل",en:"Dialogue and debate"},
    {ar:"\"التوكيد\" (Affirmation) و\"التكرار\" (Repetition)",en:"\"Affirmation\" and \"repetition\""},
    {ar:"الإحصاء والرسوم البيانية",en:"Statistics and charts"},
    {ar:"الترجمة والنشر",en:"Translation and publication"}],
 e:{ar:"التوكيد يزرع الفكرة مرةً واحدة بلا برهان، والتكرار يحفرها حتى تصير جزءاً من الغريزة؛ معاً يتجاوزان العقل التحليلي إلى اللاشعور.",en:"Affirmation plants the idea once without proof; repetition engraves it until it becomes instinct — together they bypass the analytical mind into the unconscious."}},
{id:"q68",u:"u7",a:3,
 q:{ar:"كيف تعمل \"الكلمات والمعادلات السحرية\" كتعويذات؟",en:"How do \"words and magical formulas\" work as spells?"},
 o:[{ar:"بترميزها رموزاً رياضية دقيقة",en:"Encoding precise mathematical symbols"},
    {ar:"بحفظها كما تُحفظ الأدعية",en:"Being memorised like prayers"},
    {ar:"بأنها قصيرة وسهلة النطق",en:"Being short and easy to pronounce"},
    {ar:"بلغة الصور الحيّة (مثل \"مملكة الفقراء\") وتشويه المعاني لشحنها طاقةً عاطفية",en:"Through vivid imagery (like \"the kingdom of the poor\") and distorted meanings charged with emotional energy"}],
 e:{ar:"الجمهور عاجز عن المحاكمة العقلية فيستجيب للصورة لا للمفهوم؛ وتشويه المعاني يجعل كل فرد يرى في الكلمة الواحدة تحقق أحلامه الشخصية.",en:"The public, incapable of rational judgement, responds to the image, not the concept; distorted meanings let each individual see his personal dreams fulfilled in one word."}},
{id:"q69",u:"u7",a:0,
 q:{ar:"ما شروط انتشار الفكرة عبر \"العدوى الذهنية\"؟",en:"What are the conditions for an idea to spread by \"mental contagion\"?"},
 o:[{ar:"انتشارٌ فيروسيٌّ كالعدوى دون مناقشة، ثم استقرارُها في \"التربة العميقة\" لروح الجماهير حتى تصير \"روح قومية\"",en:"Viral, discussion-free spread, then settling in the \"deep soil\" of the crowd's spirit until it becomes a \"national spirit\""},
    {ar:"نشرٌ في مجلات محكّمة",en:"Publication in peer-reviewed journals"},
    {ar:"انتخاباتٌ حرة",en:"Free elections"},
    {ar:"مؤتمراتٌ دولية",en:"International conferences"}],
 e:{ar:"الفكرة قوة اجتماعية فقط بعد أن \"تهبط\" من مستوى الخطاب إلى مستوى الغريزة الجمعية؛ عندها تعمل بتوحيد المشاعر وتُنتج الولاء الأعمى.",en:"An idea becomes a social force only after descending from discourse to collective instinct; then it unifies emotions and produces blind devotion."}},
{id:"q70",u:"u7",a:2,
 q:{ar:"لماذا ينجح \"المحرّض\" ويفشل \"المثقف\"؟",en:"Why does the \"agitator\" succeed and the \"intellectual\" fail?"},
 o:[{ar:"لأن المثقف يفتقر للعلم",en:"The intellectual lacks knowledge"},
    {ar:"لأن المحرّض يملك سلاحاً مادياً",en:"The agitator holds a material weapon"},
    {ar:"لأن المثقف يخاطب \"القشرة الدماغية\" الحديثة، والمحرّض يضرب أوتار \"الدماغ البدائي\" حيث تسكن الغرائز والأساطير",en:"The intellectual addresses the modern \"cerebral cortex\", the agitator strikes the strings of the \"primitive brain\" where instincts and myths dwell"},
    {ar:"لأن الجمهور يقرأ كثيراً",en:"The audience reads a lot"}],
 e:{ar:"هذا خلاصة المخطط كله: من يخاطب الغريزة يفوز بجماهير لم تختر العقل يوماً؛ ومن يخاطب العقل يخسر في ساحة لم تُعدّ له.",en:"The scheme's summation: whoever addresses instinct wins masses that never chose reason; whoever addresses reason loses in an arena not built for him."}},
/* ---- u8 ---- */
{id:"q71",u:"u8",a:0,
 q:{ar:"ما المقصود بـ\"النزعة اللاتينية العقيمة\" في التعليم؟",en:"What is meant by \"the sterile Latin trend\" in education?"},
 o:[{ar:"تلك التي تحشو الرؤوس بالكلمات وتُفرغها من الإرادة",en:"The one cramming heads with words and emptying them of will"},
    {ar:"تدريس اللغة اللاتينية",en:"Teaching the Latin language"},
    {ar:"التعليم الخاص بالكنائس",en:"Church-run education"},
    {ar:"التعليم النسائي",en:"Women's education"}],
 e:{ar:"رؤيته التعليمية ثورةٌ على هذه النزعة: صناعةُ إراداتٍ عاملة لا سُجُلَّ محفوظة؛ فالعلم الحقيقي عنده ما يُمارس لا ما يُحفظ.",en:"His educational philosophy is a revolution against it: forging active wills, not stored records; true knowledge is practised, not memorised."}},
{id:"q72",u:"u8",a:3,
 q:{ar:"ماذا يعني اعتبار التعليم \"فناً لتحويل الوعي إلى لاوعي\"؟",en:"What does regarding education as \"an art of turning the conscious into the unconscious\" mean?"},
 o:[{ar:"أن يُخدر التلميذ حتى يقبل التلقين",en:"Dulling the pupil to accept dictation"},
    {ar:"أن يُنام في الفصل",en:"Sleeping in class"},
    {ar:"أن يُقلَّد المعلم ظاهرياً",en:"Imitating the teacher superficially"},
    {ar:"أن تصبح المهارة الحقيقية غريزةً تُمارَس بدقة \"المنعكس الشرطي\"",en:"Making real skill an instinct practised with the precision of a \"conditioned reflex\""}],
 e:{ar:"التعليم عند لوبون \"عملية نحتٍ في الروح\"؛ المعلّم اللوبوني يغيّر التركيبة الكيميائية للإرادة لا طلاء سطحها، فينتقل التعلم من الذاكرة إلى الغريزة.",en:"Education is \"a carving of the spirit\"; the Le Bon-ian teacher changes the chemical composition of the will rather than painting its surface, moving learning from memory to instinct."}},
{id:"q73",u:"u8",a:1,
 q:{ar:"ما الذي يجعل المعلم \"محرّضاً\" (Meneur) في مدرسة لوبون؟",en:"What makes the teacher an \"agitator\" (meneur) in Le Bon's school?"},
 o:[{ar:"منهجه القاسي والعقاب المستمر",en:"Harsh methods and constant punishment"},
    {ar:"امتلاكه \"الهيبة\" واعتماده على \"نحو الإقناع\" لا الحجاج المنطقي المُنهك",en:"Owning \"prestige\" and relying on \"the method of persuasion\", not exhausting logical argument"},
    {ar:"شهاداته الأكاديمية",en:"His academic degrees"},
    {ar:"خبرته الطويلة",en:"His long experience"}],
 e:{ar:"يسقط الأكاديمي التقليدي لِيحلّ محلّه مُعلّم الهيبة؛ فيزرع الحقائق بتوكيدٍ مُلحٍّ ويجعل الفصل كياناً جماعياً يسري فيه الشغف بالعدوى.",en:"The traditional academic falls, replaced by the teacher of prestige: insistent affirmation plants truths and the class becomes a collective organism where passion spreads by contagion."}},
{id:"q74",u:"u8",a:2,
 q:{ar:"إلى أين تقود \"بذور\" التأكيد والتكرار في التربة السيكولوجية للطفل؟",en:"Where do the \"seeds\" of affirmation and repetition lead in the child's psychological soil?"},
 o:[{ar:"إلى الحفظ السطحي المؤقت",en:"Temporary rote memorisation"},
    {ar:"إلى الخوف من المعلم",en:"Fear of the teacher"},
    {ar:"إلى أن تصير الفكرة جزءاً من \"غريزته الذهنية\"",en:"Becoming part of \"his mental instinct\""},
    {ar:"إلى القدرة على الجدال",en:"The ability to argue"}],
 e:{ar:"الهدف غريزة لا معلومة: صيغٌ مركزةٌ وتكرارٌ ملحٌّ حتى يستقرّ المضمون في اللاشعار ويُنفَّذ تلقائياً دون تفكير واعٍ.",en:"The goal is instinct, not information: concise formulas and insistent repetition until content settles in the unconscious and executes automatically without conscious thought."}},
{id:"q75",u:"u8",a:0,
 q:{ar:"ما \"العدوى الانفعالية\" داخل الفصل الدراسي؟",en:"What is \"emotional contagion\" inside the classroom?"},
 o:[{ar:"تحويل الفصل إلى كيانٍ جماعي يسري فيه الشغف والجدّ، فيصير التعلّم فعلاً تلقائياً تُحركه محاكاةُ الأفضل",en:"Turning the class into a collective organism where passion and diligence spread, making learning an automatic act driven by emulating the best"},
    {ar:"انتشار الأمراض بين التلاميذ",en:"Disease spreading among pupils"},
    {ar:"منافسة الطلاب على الدرجات",en:"Competition over grades"},
    {ar:"قراءة النصوص العاطفية",en:"Reading emotional texts"}],
 e:{ar:"الجماعة تُعدَّب وتمتص أسوأ ما فيها؛ لكنها حين يُصبَّ فيها الشغف الإيجابي تصبح محرّكاً جماعياً يرفع كفاءة الجميع بلا إشراف.",en:"Crowds absorb their worst; but once positive passion is infused they become a collective engine raising everyone's performance without supervision."}},
{id:"q76",u:"u8",a:3,
 q:{ar:"ما الذي يقصده لوبون بـ\"الانضباط الداخلي (Self-control)\" في المدرسة؟",en:"What does Le Bon mean by \"internal discipline (self-control)\" at school?"},
 o:[{ar:"توسيع عقوبات المجلس التأديبي",en:"Expanding disciplinary board punishments"},
    {ar:"مراقبة التلاميذ بالكاميرات",en:"Monitoring pupils by cameras"},
    {ar:"فرض الزي المدرسي",en:"Enforcing school uniforms"},
    {ar:"تحويل الانضباط القسري إلى قوة إرادةٍ من الداخل: المتعلم من يملك سلطاناً على نفسه لا شهادةً في جيبه",en:"Transforming compulsory discipline into an inner power of will: the learned man has authority over himself, not a certificate in his pocket"}],
 e:{ar:"الامتحانات المبنية على الحفظ تصنع ساخطين؛ والبديل صناعة شخصياتٍ تُدير نفسها، فيتحوّل الطالب من متلقٍّ مُكرَه إلى فاعلٍ مسؤول.",en:"Examinations based on memorisation produce the discontented; the alternative is self-governing personalities, turning the student from a coerced receiver into a responsible agent."}},
{id:"q77",u:"u8",a:1,
 q:{ar:"كيف يتحوّل الطالب من \"مرتزق\" إلى \"مواطن\" في منهج لوبون؟",en:"How does the student turn from a \"mercenary\" into a \"citizen\" in Le Bon's method?"},
 o:[{ar:"بإلغاء الدرجات نهائياً",en:"Abolishing grades entirely"},
    {ar:"عبر العمل الجماعي والمسؤولية الفردية تجاه المهمة، فيُعتز بالإتقان لا بالعلامات",en:"Through collective work and individual responsibility toward the task, valuing craftsmanship over marks"},
    {ar:"بزيادة وقت الفرصة",en:"Increasing free time"},
    {ar:"بمنافسة المدارس",en:"Competing between schools"}],
 e:{ar:"من أنانية العلامات إلى إتقان العمل: المسؤولية الفردية عن مهمة مشتركة تُنمي المواطنة داخل الصف قبل أن تُمارَس في الشارع.",en:"From marks-seeking to craftsmanship: individual responsibility for a shared task breeds citizenship in the classroom before it is practised in the street."}},
{id:"q78",u:"u8",a:2,
 q:{ar:"لماذا يُفضّل لوبون \"الورشة\" على \"الكتاب\"؟",en:"Why does Le Bon prefer the \"workshop\" to the \"book\"?"},
 o:[{ar:"لأن الكتب غالبة الثمن",en:"Books are expensive"},
    {ar:"لأن الورشة تُنتج منتجاً قابلاً للبيع",en:"The workshop produces sellable output"},
    {ar:"لأن \"مَنطق الأشياء\" لا يقبل التلاعب: إما قياسٌ دقيقٌ أو فشلُ القطعة، فيصقل \"الاستبصار المادي\" \"الحكم الصائب\"",en:"Because \"the logic of things\" admits no trickery: either exact measurement or the piece fails, and \"material insight\" polishes \"sound judgement\""},
    {ar:"لأن التلاميذ يحبون اللعب",en:"Pupils enjoy playing"}],
 e:{ar:"في الورشة لا مكان للأوهام ولا لتدليس الكلمات؛ الواقع يحاسب مباشرة، وهذا التصادم هو الذي يصنع الحكم الصائب بدل الحفظ.",en:"In the workshop there is no room for illusions or wordplay; reality judges directly, and this collision forges sound judgement instead of memorisation."}},
{id:"q79",u:"u8",a:0,
 q:{ar:"ما \"الاستقراء الفردي\" ولماذا يُفضَّل على تلقين القوانين؟",en:"What is \"individual induction\", and why is dictation inferior to it?"},
 o:[{ar:"وضع الطالب أمام \"معضلة مادية\" يحلها بنفسه؛ فالمعرفة الناتجة عن بحثٍ ذاتيٍّ تغوص في اللاشعور بخلاف الملقوقة",en:"Placing the student before a \"material problem\" he solves himself; knowledge from self-inquiry dives into the unconscious, unlike dictated knowledge"},
    {ar:"قراءة القوانين بصوتٍ عالٍ",en:"Reading laws aloud"},
    {ar:"حفظ التعريفات",en:"Memorising definitions"},
    {ar:"حلّ الامتحانات السابقة",en:"Solving past exams"}],
 e:{ar:"الطالب الباحث يملك النتيجة لأنها نتاج جهده؛ والمعرفة \"المُلقَّنة\" تبقى طافية على سطح الذاكرة سرعان ما تنسى.",en:"The inquiring student owns the result because it cost his effort; \"poured-in\" knowledge floats on memory's surface and soon fades."}},
{id:"q80",u:"u8",a:3,
 q:{ar:"أين تتقاطع رؤية لوبون التربوية مع المدرسة الحديثة؟",en:"Where does Le Bon's educational vision intersect with the modern school?"},
 o:[{ar:"مع نظام الامتحانات الموحدة",en:"With standardised examinations"},
    {ar:"مع الحفظ المُنظَّم",en:"With organised memorisation"},
    {ar:"مع تلقين المقررات الرسمية",en:"With official curricula dictation"},
    {ar:"مع \"التعلم القائم على المشروعات\" (PBL) و\"التعلم بالفعل\" (Learning by Doing)",en:"With \"project-based learning\" (PBL) and \"learning by doing\""}],
 e:{ar:"استبدال \"الرموز الميتة\" (الكتب) بالواقع الحي هو المحور المشترك؛ فالطفل الذي يبني قنبرة كهربائية يتعلم الفيزياء أكثر من الذي يحفظ صفحتها.",en:"Replacing \"dead symbols\" (books) with living reality is the common axis: the child building an electric bell learns more physics than the one memorising its page."}},
{id:"q81",u:"u8",a:1,
 q:{ar:"ما نقد لوبون للمدرسة وما \"الدرس\" التذكيري؟",en:"What is Le Bon's critique of the modern school, and his reminder?"},
 o:[{ar:"أنها تُكثر من الواجبات",en:"It assigns too much homework"},
    {ar:"أنها تخرج \"عباقرةً في الورق\" و\"عاجزينَ في الميدان\"؛ والذكاءَ الحقيقي يسكن الأطرافَ والحواسَ كما يسكن الدماغ",en:"It graduates \"geniuses on paper\" and \"the helpless in the field\"; true intelligence dwells in the limbs and senses as much as in the brain"},
    {ar:"أنها تهمل الرياضيات",en:"It neglects mathematics"},
    {ar:"أنها قديمة جداً",en:"It is too old"}],
 e:{ar:"يفتقر المنهج إلى \"تمرين الحكم الصائب\" عبر صدمة الواقع؛ فلا بد من أن يُختبر الطفل بالأشياء قبل أن يُختبر بالأوراق.",en:"The curriculum lacks \"training sound judgement\" through collision with reality; children must be tested by things before being tested on paper."}},
{id:"q82",u:"u8",a:2,
 q:{ar:"بمَ يلخّز المترجم جوهر التعليم عند لوبون؟",en:"How does the translator encapsulate education for Le Bon?"},
 o:[{ar:"بأنه \"نقلُ معلوماتٍ موثقة\"",en:"As \"transferring documented information\""},
    {ar:"بأنه \"سباقٌ نحو المراكز الأولى\"",en:"As \"a race for first places\""},
    {ar:"بأنه \"عمليةُ نحتٍ\" في الروح يغيّر المعلمُ \"التركيبة الكيميائية\" للإرادة، و\"يدُ\" التلميذ مختبرُ عقله",en:"A \"process of carving\" the spirit where the teacher changes the will's \"chemical composition\", and the pupil's \"hand\" is the laboratory of his mind"},
    {ar:"بأنه وسيلة للترفيه",en:"As a means of entertainment"}],
 e:{ar:"بين طلاء السطح ونحت العمق الفرق كله؛ المعلّم التقليدي يزيّن الذاكرة، والمعلّم اللوبوني يُعيد صياغة الإرادة من الداخل عملياً.",en:"Between painting the surface and carving the depths lies all the difference: the traditional teacher decorates memory, the Le Bon-ian reshapes the will from within, practically."}}
);

/* ===== APP CORE: state, i18n, icons, learn, flashcards ===== */
(function(){
"use strict";
var LS_KEY="lop_smart_v1", DAY=864e5, MIN=6e4;
var $=function(s,r){return (r||document).querySelector(s);};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s));};

/* ---------- state ---------- */
function blankState(){return {v:1,lang:"bi",theme:"light",tab:"learn",unit:"u1",
  units:{},cards:{},qs:{},
  st:{revTotal:0,revToday:0,revDay:"",quizAtt:0,quizOk:0,streak:0,lastDay:"",started:0}};}
var S=blankState();
function load(){try{var j=JSON.parse(localStorage.getItem(LS_KEY));if(j&&j.v===1){var b=blankState();for(var k in j)if(j[k]!==undefined)b[k]=j[k];b.st=Object.assign(blankState().st,j.st||{});return b;}}catch(e){}return blankState();}
var saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(function(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}},200);}
function saveNow(){try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}}
S=load();
if(!S.st.started)S.st.started=Date.now();

/* ---------- i18n ---------- */
function UI(){return S.lang==="en"?I18N.en:I18N.ar;}
function T(k){var o=UI(),p=k.split("."),i;for(i=0;i<p.length;i++){o=o&&o[p[i]];}return o===undefined||o===null?k:o;}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
function bold(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");}
function pick(o){ if(!o)return""; if(S.lang==="en")return bold(o.en); if(S.lang==="ar")return bold(o.ar);
  return '<span class="bi"><span class="ar">'+bold(o.ar)+'</span><span class="en">'+bold(o.en)+'</span></span>'; }
function pickFlat(o){ if(!o)return""; return S.lang==="en"?o.en:o.ar; }
function applyDir(){var en=S.lang==="en";document.documentElement.lang=en?"en":"ar";document.documentElement.dir=en?"ltr":"rtl";}
function applyI18N(){
  $$("[data-k]").forEach(function(el){var v=T(el.getAttribute("data-k"));if(v!==null)el.textContent=v;});
  var si=$("#searchInput"); if(si)si.placeholder=T("searchPh");
  $$(".lang-pill button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-lang")===S.lang);});
  var tb=$("#themeBtn"); if(tb){tb.innerHTML='<i class="icon" data-icon="'+(S.theme==="dark"?"sun":"moon")+'"></i>';tb.title=T("theme");}
  $("#helpBtn").title=T("help");
  iconify();
}

/* ---------- icons (Font Awesome Free, inlined for offline use) ---------- */
function iconify(){
  $$("[data-icon]").forEach(function(el){
    var n=el.getAttribute("data-icon"),ic=ICONS[n]||ICONS["circle-info"];
    el.innerHTML='<svg viewBox="'+ic.v+'" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true"><path d="'+ic.d+'"/></svg>';
    el.removeAttribute("data-icon");
  });
}

/* ---------- toast / modal ---------- */
var toastT=null;
function toast(msg){var t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove("show");},1900);}
function openModal(title,html){$("#modalTitle").textContent=title;$("#modalBody").innerHTML=html;$("#modal").classList.add("show");iconify();}
function closeModal(){$("#modal").classList.remove("show");}

/* ---------- day / streak ---------- */
function today(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
function touchDay(){var t=today();if(S.st.revDay!==t){if(S.st.lastDay===yesterday())S.st.streak=(S.st.streak||0)+1;else S.st.streak=1;S.st.lastDay=t;S.st.revToday=0;}S.st.revDay=t;}
function yesterday(){var d=new Date(Date.now()-DAY);return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}

/* ---------- SRS (cards) ---------- */
function cardState(id){var c=S.cards[id];if(!c){c=S.cards[id]={reps:0,lapses:0,ease:2.5,ivl:0,due:0,mastery:0,last:0,seen:0};}return c;}
function rateCard(id,r){
  var c=cardState(id),now=Date.now();
  c.seen=1;c.reps++;c.last=now;touchDay();S.st.revTotal++;S.st.revToday++;
  if(r==="again"){c.lapses++;c.ease=Math.max(1.3,c.ease-0.2);c.ivl=0;c.due=now+10*MIN;c.mastery=Math.max(0,c.mastery-12);}
  else if(r==="hard"){c.ease=Math.max(1.3,c.ease-0.12);c.ivl=Math.max(1,c.ivl*1.2);c.due=now+c.ivl*DAY;c.mastery=Math.min(100,c.mastery+4);}
  else if(r==="good"){c.ease=Math.min(3.2,c.ease+0.05);c.ivl=c.ivl?Math.round(c.ivl*c.ease):1;c.due=now+c.ivl*DAY;c.mastery=Math.min(100,c.mastery+12);}
  else{c.ease=Math.min(3.4,c.ease+0.1);c.ivl=Math.max(2,Math.round((c.ivl||1)*c.ease*1.3));c.due=now+c.ivl*DAY;c.mastery=Math.min(100,c.mastery+20);}
  save();
}
function isMastered(c){return c&&c.mastery>=80&&c.reps>=3;}
function cardPriority(a,b){
  var ca=cardState(a.id),cb=cardState(b.id);
  if(cb.lapses!==ca.lapses)return cb.lapses-ca.lapses;
  if(ca.mastery!==cb.mastery)return ca.mastery-cb.mastery;
  return (ca.due||0)-(cb.due||0);
}
function dueCards(){var now=Date.now();return CARDS.filter(function(c){var s=cardState(c.id);return s.seen&&s.due<=now;}).sort(cardPriority);}
function newCards(){return CARDS.filter(function(c){return !cardState(c.id).seen;});}
function cardCounts(){
  var m=0,l=0,f=0,d=0,now=Date.now();
  CARDS.forEach(function(c){var s=cardState(c.id);if(isMastered(s))m++;else if(s.seen)l++;else f++;if(s.seen&&s.due<=now)d++;});
  return {mastered:m,learning:l,fresh:f,due:d,total:CARDS.length};
}

/* ---------- question SRS ---------- */
function qState(id){var q=S.qs[id];if(!q){q=S.qs[id]={att:0,ok:0,okS:0,badS:0,due:0,book:0,last:0};}return q;}
function answerQ(id,correct){

  S.st.quizAtt++;if(correct)S.st.quizOk++;

}

var QZ=null;
function qLetter(i){return (S.lang==="en")?["A","B","C","D"][i]:["أ","ب","ج","د"][i];}
function buildQuiz(mode,unitId,limit){
  var now=Date.now();
  var pool=QUIZ.filter(function(q){
    if(unitId&&q.u!==unitId)return false;
    var s=S.qs[q.id];
    if(mode==="saved")return s&&s.book;
    if(!s)return mode!=="weak";
    if(S.excludeSaved&&mode!=="saved"&&s.book&&s.ok>0)return false;
    if(mode==="weak")return s.att>0&&(s.ok===0||s.due<=now);
    return s.ok===0||s.due<=now; /* quick: wrong or due */
  });
  if(mode==="quick"&&pool.length<(limit||10)){
    var extra=QUIZ.filter(function(q){
      if(unitId&&q.u!==unitId)return false;
      if(pool.indexOf(q)>=0)return false;
      var s=S.qs[q.id];
      if(S.excludeSaved&&s&&s.book&&s.ok>0)return false;
      return true;
    });
    pool=pool.concat(shuffle(extra));
  }
  pool=shuffle(pool);
  if(mode==="weak")pool.sort(function(a,b){var x=S.qs[a.id]||{att:0},y=S.qs[b.id]||{att:0};return (y.att-y.ok)-(x.att-x.ok);});
  if(mode==="quick")return pool.slice(0,limit||10);
  return pool;
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function startQuiz(list,mode){ if(!list.length){toast(T("noResults"));return;} QZ={list:list,mode:mode||"quick",i:0,picked:null,locked:false,results:[],t0:Date.now()}; renderQuiz(); }

      (locked?(picked===q.a?T("correct"):T("wrong")):T("pickAnswer"))+"</div>"+
      (locked?"<div>"+pick(q.e)+"</div>":"")+"</div>"+
    '<div class="btnrow"><button class="btn" id="qNext" style="margin-inline-start:auto">'+(QZ.i<QZ.list.length-1?T("next"):T("finish"))+' <i class="icon" data-icon="arrow-left"></i></button></div>'+
    "</div></div>";
  $("#quizArea").innerHTML=html;
  $("#opts").addEventListener("click",function(e){
    var b=e.target.closest("[data-i]");if(!b||QZ.locked)return;
    var i=parseInt(b.getAttribute("data-i"),10),ok=i===q.a;
    QZ.locked=true;QZ.picked=i;QZ.results.push(ok);answerQ(q.id,ok);renderQ();
  });
  $("#qNext").addEventListener("click",function(){QZ.i++;QZ.locked=false;QZ.picked=null;renderQ();});
  $("#bSaveQ").addEventListener("click",function(){
    var s=qState(q.id);s.book=s.book?0:1;save();renderQ();toast(s.book?T("savedQ"):T("unsaved"));
  });
  iconify();
}
function renderQEnd(){
  var ok=QZ.results.filter(Boolean).length,total=QZ.results.length,mins=Math.max(1,Math.round((Date.now()-QZ.t0)/60000));
  var wrongs=QZ.list.filter(function(q,i){return !QZ.results[i];});
  var list=QZ.list,results=QZ.results,mode=QZ.mode;
  var wr=wrongs.length?'<div class="card"><h2 style="font-size:16px">'+T("mistakes")+"</h2><div class='mlist mt'>"+
    wrongs.map(function(q){return '<div class="mitem"><strong>'+pick(q.q)+'</strong><small>'+pickFlat(q.o[q.a])+"</small></div>";}).join("")+"</div></div>":"";
  $("#quizArea").innerHTML='<div class="card center"><div class="empty"><i class="icon" data-icon="'+(ok===total?"medal":"circle-half-stroke")+'"></i></div>'+
    "<h2>"+T("result")+"</h2><p style='font-size:40px;font-weight:800'>"+ok+" / "+total+"</p>"+
    '<p class="hint">'+T("accuracy")+": "+Math.round(100*ok/total)+"% · "+mins+" "+T("min")+"</p>"+
    '<div class="btnrow" style="justify-content:center"><button class="btn" id="qAgain"><i class="icon" data-icon="arrows-rotate"></i>'+T("again2")+"</button>"+
    '<button class="btn ghost" id="qMenu">'+T("backQuiz")+"</button></div></div>"+wr;
  $("#qAgain").addEventListener("click",function(){startQuiz(mode==="unit"||mode==="saved"?list:buildQuiz(mode),mode);});
  $("#qMenu").addEventListener("click",function(){QZ=null;renderQuiz();});

}

document.addEventListener("keydown",function(e){
